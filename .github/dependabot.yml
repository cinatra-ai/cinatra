# Dependabot — keep SHA-pinned GitHub Actions fresh.
#
# Every remote `uses:` in .github/workflows/** is pinned to an immutable 40-char
# commit SHA with a `# vX.Y.Z` comment (supply-chain hardening). Dependabot's
# `github-actions` ecosystem understands that SHA+comment shape and bumps BOTH
# the SHA and the version comment together — so pins stay current without manual
# SHA chasing, and the actions-pinned-gate keeps them from rotting back to tags.
#
# Scope is the `github-actions` ecosystem ONLY (no npm/docker co-mingling), and
# all action bumps land in ONE grouped weekly PR rather than one-PR-per-action.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "github-actions"
    # The cinatra-ai/ci reusable gate workflows (and ci composite actions) are
    # DELIBERATELY excluded from auto-bumps: their pins are security-critical and
    # must stay coupled to .github/gate-suite.json requiredContexts[].pinned. The
    # truthful-attribution machine arm resolves each gate run's referenced_workflows
    # and fails closed on any uses:@SHA vs pinned mismatch, so a grouped SHA bump
    # that moved a caller's uses:@ WITHOUT the coupled gate-suite.json re-pin broke
    # the machine arm once (#1188). These pins advance only via the deliberate,
    # byte-identity-audited gate re-pin lane — never a Dependabot group bump.
    ignore:
      - dependency-name: "cinatra-ai/ci/*"
