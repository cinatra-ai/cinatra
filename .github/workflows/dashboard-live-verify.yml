# Dashboard live-verify smoke.
#
# The smoke is the only gate that exercises the FULL stack — Postgres +
# Better Auth session + Next.js + drizzle-cube/client bundle + DOM.
# typecheck + unit tests don't reach the bundler / DB driver / DOM
# render pipeline. It catches runtime bugs invisible to the offline
# gates (chart peer deps loading eagerly, missing
# <DashboardStoreProvider>, cube `from` parameter-bound, org-only WHERE
# excluding user's own runs).
#
# REQUIRED-CHECK SHIM — why this is NOT a simple `paths:`-gated workflow:
#
# This check (`/agents Playwright smoke`) is a REQUIRED status check on
# `main`. A path-gated workflow CANNOT be required: GitHub reports a
# required check whose workflow did not trigger as "Expected — Waiting
# for status to be reported" and blocks the merge forever, so every
# non-dashboard PR would be un-mergeable.
#
# Instead the workflow triggers on EVERY PR and a `detect` job decides
# (via dorny/paths-filter) whether the dashboard surface changed. The
# `smoke` job ALWAYS runs (so the required check always reports) but its
# heavy steps + its Postgres/Redis service containers are gated on the
# detect output:
#   - dashboard paths touched   → real smoke runs (can fail = red)
#   - dashboard paths untouched → green stub in ~seconds, no services
# Exactly one `/agents Playwright smoke` check reports per PR, so the
# gate is required-safe AND correct for mixed PRs (a PR touching both a
# dashboard file and unrelated files runs the real smoke).

name: dashboard-live-verify

on:
  pull_request:
    # Draft PRs green-stub the required smoke (see detect.run_real); ready_for_review
    # runs it for real; converted_to_draft lets concurrency cancel an in-flight run.
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  merge_group:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: dashboard-live-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # detect — decide whether the dashboard surface changed.
  #
  # On `pull_request`: dorny/paths-filter queries the PR's changed files via the
  # REST API (needs `pull-requests: read`); no checkout, fast (~5s), no services.
  #
  # On `merge_group` (merge queue): dorny's detection is git-based and needs a
  # checked-out repo, which this job intentionally does NOT do — so we DON'T run
  # dorny there. Instead we force `dashboards=true` so the merge-queue run
  # executes the REAL smoke (the safe choice — a merge-queue candidate has
  # passed PR review and should get the full gate, not a stub). Without this,
  # dorny would fail on merge_group → smoke's guard would exit 1 → every
  # merge-queue run would go red.
  # ---------------------------------------------------------------------------
  detect:
    runs-on: ${{ fromJSON(vars.CI_RUNNER_GATE || '"ubuntu-latest"') }}
    # Fail fast if dorny/paths-filter or the GitHub API hangs — a stuck
    # `detect` would leave the REQUIRED `/agents Playwright smoke` check
    # pending (smoke's guard can only fire after detect resolves).
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # run_real = run the REAL smoke (vs green stub). True on merge_group, or on
      # a non-draft PR that touches a dashboard surface. Draft PRs stub (they are
      # unmergeable; the real smoke runs on ready_for_review).
      run_real: ${{ steps.force_merge_group.outputs.dashboards == 'true' || (steps.filter.outputs.dashboards == 'true' && github.event.pull_request.draft != true) }}
    steps:
      - id: force_merge_group
        if: ${{ github.event_name == 'merge_group' }}
        run: echo "dashboards=true" >> "$GITHUB_OUTPUT"

      - id: filter
        if: ${{ github.event_name == 'pull_request' }}
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            dashboards:
              - 'packages/dashboards/**'
              - 'packages/sdk-dashboard/**'
              - 'src/app/api/dashboards/**'
              - 'src/app/agents/**'
              - 'tests/e2e/dashboards/**'
              - 'tests/e2e/config/dashboards.config.ts'
              - 'tests/e2e/config/base.ts'
              - 'tests/e2e/config/hydration.ts'
              # cinatra#1957: the smoke DB is provisioned from this committed
              # snapshot (apply-public-schema step) and the Better Auth runtime
              # model is defined by better-auth-schema.ts — drift in either IS a
              # smoke-behavior change and must run the real smoke, never the stub
              # (the archivedAt regression green-stubbed straight onto main).
              - 'tests/e2e/rbac/fixtures/public-schema.sql'
              - 'scripts/apply-public-schema.mjs'
              - 'src/lib/better-auth-schema.ts'
              - '.github/workflows/dashboard-live-verify.yml'
              # High-signal shared-runtime files whose breakage reaches the
              # /agents DC render even though they sit outside the dashboard
              # dirs. Kept deliberately narrow so the smoke does NOT become
              # "run on every PR": the app shell (owns the setup-redirect +
              # the chrome the smoke asserts), the setup-wizard gate (its
              # bypass env-var is load-bearing for the smoke), the DC client
              # SDK, and the Next.js + root-manifest build inputs. NOT
              # pnpm-lock.yaml (dependency churn would swamp the gate).
              - 'src/components/app-shell.tsx'
              - 'src/lib/setup-wizard.ts'
              - 'packages/sdk-ui/src/**'
              - 'packages/sdk-ui/package.json'
              - 'next.config.ts'
              - 'package.json'
              # Pinned clone-back inputs: a lock bump changes the materialized
              # extension tree the smoke's build runs against.
              - 'cinatra-required-extensions.lock.json'
              - 'cinatra-dev-extensions.lock.json'

  smoke:
    name: /agents Playwright smoke
    needs: detect
    # ALWAYS run so the required check always reports a result (never a
    # never-arriving "Expected"). The first step fails the job loudly if
    # `detect` did not succeed — otherwise a broken detector would let the
    # required check pass silently (false green).
    if: ${{ always() }}
    # Opt-in larger-runner lever — same mechanism build-image's build/e2e jobs
    # use. Zero-risk no-op (stays ubuntu-latest) until the org/repo variable
    # CI_BUILD_RUNNER is set to a larger label (e.g. ubuntu-latest-4-cores, 16GB).
    runs-on: ${{ fromJSON(vars.CI_RUNNER_E2E || '"ubuntu-latest"') }}
    # Job cap 45 (prod build + standalone server boot + suite). The Playwright
    # run is wrapped in a shell `timeout` (below) sized ABOVE the config's
    # globalTimeout, so a hung suite SIGTERMs Playwright after it has written
    # its report, the report uploads, and a final assert step fails the job RED
    # — never a job-level cancel with no diagnostics (the old failure mode).
    timeout-minutes: 45

    services:
      # Conditional service containers: an empty `image` string means the
      # service is NOT started. On non-dashboard PRs (the common case) the
      # stub path needs no Postgres/Redis, so they don't spin up.
      postgres:
        image: ${{ needs.detect.outputs.run_real == 'true' && 'postgres:18' || '' }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          # Container port only: the runner publishes it on a RANDOM free
          # host port, read back from `job.services.postgres.ports` in this
          # job's first step, so two jobs holding a postgres on ONE
          # self-hosted machine never race for one host port (cinatra#3267).
          - "5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: ${{ needs.detect.outputs.run_real == 'true' && 'redis:8' || '' }}
        ports:
          # Container port only: the runner publishes it on a RANDOM free
          # host port, read back from `job.services.redis.ports` in this
          # job's first step, so two jobs holding a redis on ONE
          # self-hosted machine never race for 6379 (cinatra#3267).
          - "6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # SUPABASE_DB_URL and REDIS_URL are deliberately NOT here: they name the
      # RANDOM host ports the runner mapped for this job's service containers,
      # which a job-level `env:` cannot read. The real-smoke path's first step
      # exports both to $GITHUB_ENV instead (cinatra#3267).
      SUPABASE_SCHEMA: cinatra_e2e_dashboard
      BULLMQ_QUEUE_NAME: cinatra-bg-e2e-dashboard
      BETTER_AUTH_URL: http://localhost:3100
      NEXT_PUBLIC_BETTER_AUTH_URL: http://localhost:3100
      NEXT_PUBLIC_APP_URL: http://localhost:3100
      NEXT_PUBLIC_SITE_URL: http://localhost:3100
      # Required by next.config.ts's REQUIRED_ENV presence check (the
      # check is presence-only; the dashboard e2e never makes an actual
      # OpenAI call — the cube layer + DOM render are exercised by the
      # smoke). Mirrors the Dockerfile placeholder at Dockerfile:45.
      OPENAI_API_KEY: ci-placeholder-not-used-at-runtime
      # Bypass the setup-wizard redirect that fires from `AppShell`
      # whenever isSetupWizardComplete() returns false. On a fresh CI
      # instance the wizard is incomplete (no instance identity row, no
      # Nango, no OpenAI connection), so the shell's `useEffect` fires
      # `router.replace("/setup")` on every authenticated route after
      # hydration. This env var is the documented browser-e2e affordance
      # at `src/lib/setup-wizard.ts`; also set by `build-image.yml`'s
      # RBAC browser e2e job.
      CINATRA_E2E_SETUP_BYPASS: "true"
      # Dev-mode boot: this smoke runs a STANDALONE repo build (`pnpm build` +
      # `node server.js`), NOT the Docker image, so it never bakes the
      # required-extension OAS seed (only the Dockerfile runs
      # build-required-oas-seed.mjs). Without this, the required-extension-
      # materialize boot phase (added in #786) runs fail-closed and aborts boot
      # on the absent seed. Dev mode makes seed-absence the intended non-prod
      # no-op — the correct owner for prod materialization is build-image.yml's
      # prod-boot e2e, not this /agents dashboard-render smoke. Mirrors the
      # `CINATRA_RUNTIME_MODE: development` on build-image.yml's RBAC/dashboards
      # e2e jobs.
      CINATRA_RUNTIME_MODE: development
      E2E_PORT: "3100"
      E2E_USER_EMAIL: option-a-test@local.test
      E2E_USER_PASSWORD: OptionATest2026!

    steps:
      # Guard: if `detect` did not succeed (failure / cancellation), fail the
      # required check loudly rather than letting it pass green by accident.
      - name: Guard — detect must have succeeded
        if: ${{ needs.detect.result != 'success' }}
        run: |
          echo "::error::detect job did not succeed (result=${{ needs.detect.result }}); failing the required smoke check rather than passing it silently."
          exit 1

      # Stub path: dashboard surface untouched → report green in seconds.
      - name: Skip stub (no dashboard-surface changes)
        if: ${{ needs.detect.outputs.run_real != 'true' }}
        run: echo "No dashboard-surface changes, or draft PR; reporting /agents Playwright smoke as a green stub (the real smoke runs on ready, non-draft PRs that touch dashboard paths, and on merge_group)."

      # Carries the same run_real guard the real-smoke steps below do: on
      # the stub path the service images are the empty string, no container
      # starts, and there is no mapped port to read (cinatra#3267).
      - name: Export the mapped service ports
        if: ${{ needs.detect.outputs.run_real == 'true' }}
        run: |
          {
            echo "SUPABASE_DB_URL=postgresql://postgres:postgres@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres"
            echo "REDIS_URL=redis://127.0.0.1:${{ job.services.redis.ports['6379'] }}"
          } >> "$GITHUB_ENV"

      # ----- real smoke path: everything below is gated on dashboards==true -----
      - name: Checkout
        if: ${{ needs.detect.outputs.run_real == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The real smoke runs untrusted fork-PR code (a fork PR touching a
          # dashboard path takes this branch). Don't leave the ephemeral
          # GITHUB_TOKEN persisted in the git config for that code to reuse —
          # the smoke does no git operations that need it.
          persist-credentials: false

      - name: Setup pnpm
        if: ${{ needs.detect.outputs.run_real == 'true' }}
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node
        if: ${{ needs.detect.outputs.run_real == 'true' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Clone companion extension repos
        if: ${{ needs.detect.outputs.run_real == 'true' }}
        uses: ./.github/actions/clone-extensions

      - name: Install deps
        if: ${{ needs.detect.outputs.run_real == 'true' }}
        run: pnpm install --frozen-lockfile

      # Reuse Next.js's incremental build cache across runs to speed `pnpm build`
      # (the smoke now runs against a prebuilt prod server, not `pnpm dev`).
      # Keyed by lockfile + next.config.ts (a config bump invalidates) and primed
      # by the most-recent matching restore-key. Mirrors build-image.yml's e2e jobs.
      - name: Cache Next.js build cache
        if: ${{ needs.detect.outputs.run_real == 'true' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: nextjs-prod-dashboard-e2e-${{ hashFiles('pnpm-lock.yaml', 'next.config.ts') }}-${{ github.sha }}
          restore-keys: |
            nextjs-prod-dashboard-e2e-${{ hashFiles('pnpm-lock.yaml', 'next.config.ts') }}-
            nextjs-prod-dashboard-e2e-

      - name: Derive secrets
        if: ${{ needs.detect.outputs.run_real == 'true' }}
        run: |
          echo "BETTER_AUTH_SECRET=$(openssl rand -hex 32)" >> $GITHUB_ENV
          echo "CINATRA_ENCRYPTION_KEY=$(printf '0%.0s' {1..64})" >> $GITHUB_ENV

      # Cache the Playwright browser download (~175 MiB chromium + ffmpeg +
      # headless-shell). Pinned to the @playwright/test version via the
      # lockfile hash so a version bump invalidates the cache. Saves 30-90s
      # on warm runs (same pattern as the build-image.yml e2e jobs).
      - name: Cache Playwright browsers
        if: ${{ needs.detect.outputs.run_real == 'true' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Playwright chromium
        if: ${{ needs.detect.outputs.run_real == 'true' }}
        run: pnpm exec playwright install --with-deps chromium

      - name: Provision Better Auth tables (public schema)
        if: ${{ needs.detect.outputs.run_real == 'true' }}
        # Apply a committed, idempotent snapshot of Better Auth's public.* tables
        # (user/session/member/organization/...). The cinatra app schema
        # (cinatra_e2e_dashboard) is created by the instrumentation hook on first
        # server query. We do NOT use the better-auth migrate CLI: it bundles
        # auth.ts's import graph, which transitively imports `server-only` and is
        # rejected outside a Next.js bundle (mirrors build-image.yml's RBAC job).
        run: node scripts/apply-public-schema.mjs

      - name: Add CI build swap (default-runner only)
        # Best-effort, GitHub-hosted runners ONLY (a self-hosted runner brings
        # its own memory and cleanup, and this step's tools are not on its
        # path). A 16G swapfile UNDER /mnt — the hosted runners' temp volume
        # has the room the root disk lacks — absorbs the production build's
        # memory SPIKES so the runner is not RECLAIMED for unresponsiveness
        # ("The runner has received a shutdown signal" inside the build step).
        # 4G on the root disk was NOT enough: a sampler over run 34558946726
        # measured mem_available_mb between 122 and 400 for six minutes with
        # mem_used_mb up to 15850, and three build attempts died in that
        # window. This is the same 16G-under-/mnt provision the image build
        # already makes. Subshell-guarded so a swap-setup failure NEVER fails
        # the job. Mirrors the build-image jobs.
        if: ${{ needs.detect.outputs.run_real == 'true' && runner.environment == 'github-hosted' }}
        run: |
          set -uxo pipefail
          SWAPFILE=/mnt/cinatra-s9k-swap
          if { sudo fallocate -l 16G "$SWAPFILE" || { sudo rm -f "$SWAPFILE"; sudo dd if=/dev/zero of="$SWAPFILE" bs=1M count=16384; }; } \
            && sudo chmod 600 "$SWAPFILE" \
            && sudo mkswap "$SWAPFILE" \
            && sudo swapon "$SWAPFILE"; then
            swapon --show || true; free -h || true
          else
            echo "::warning::CI build swap setup failed — proceeding without extra swap (today's behavior)"
          fi

      - name: Build app (production)
        if: ${{ needs.detect.outputs.run_real == 'true' }}
        # Run the smoke against a production build, NOT `pnpm dev`. Turbopack dev
        # compiles each route cold on first hit, exhausting the runner mid-suite
        # and leaving a Playwright-owned dev process tree that could not be torn
        # down — the job ran to the runner's hard kill with NO report. A prebuilt
        # standalone server serves routes instantly with steady memory. The build
        # does no real DB I/O (postgres-sync no-ops under
        # NEXT_PHASE=phase-production-build); the job env supplies the placeholder
        # OPENAI_API_KEY + SUPABASE_DB_URL the build needs.
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          # One page-data worker on the two-processor hosted runner: three workers
          # starve the runner's own heartbeat during page-data collection and GitHub
          # reclaims it ("runner received a shutdown signal") on any branch whose
          # route set makes that phase long enough; the knob maps to
          # experimental.cpus in next.config.ts.
          CINATRA_BUILD_CPUS: "1"
        # THE BUILD IS SAMPLED TOO (cinatra#3382). The runner's shutdown signal
        # arrived three times INSIDE this step at this head (attempt 1 cancelled
        # at 01:33:58Z after 7.7 min, attempt 2 at 01:43:23Z after 6.7 min,
        # attempt 3 at 01:57:18Z after 8.5 min — 53 s after "Compiled
        # successfully in 7.5min", during "Collecting page data using 1
        # worker"), so the boot+smoke step below never ran and its sampler
        # captured nothing. The same ten-line loop therefore runs here as well:
        # a step's background process dies with the step and its stdout belongs
        # to the step that started it, so one shared sampler step cannot serve
        # two steps — the loop is duplicated on purpose. It appends to the same
        # file in RUNNER_TEMP that the boot+smoke step keeps appending to, and
        # is killed by pid at the end of this script and on every error path
        # through the EXIT trap.
        run: |
          # set -e: the trailing kill must never mask a failed build; the EXIT
          # trap stops the sampler on that path.
          set -eu
          SAMPLE_FILE="${RUNNER_TEMP}/agents-smoke-memory.txt"
          : > "$SAMPLE_FILE"
          echo "AGENTS_SMOKE_MEMORY_FILE=${SAMPLE_FILE}" >> "$GITHUB_ENV"
          free -m || true
          nproc || true
          (
            while true; do
              {
                date -u +%T
                free -m | awk '/^Mem:/ { print "  mem_used_mb=" $3 " mem_available_mb=" $7 }'
                ps -eo rss=,comm= --sort=-rss | head -3 | awk '{ print "  rss_kb=" $1 " " $2 }'
              } | stdbuf -oL tee -a "$SAMPLE_FILE"
              sleep 5
            done
          ) &
          SAMPLER_PID=$!
          trap 'kill "$SAMPLER_PID" 2>/dev/null || true' EXIT
          echo "memory sampler launched as PID ${SAMPLER_PID} writing ${SAMPLE_FILE}"

          pnpm build

          kill "$SAMPLER_PID" 2>/dev/null || true

      - name: Boot the app and run the dashboard live-verify smoke (memory sampled)
        if: ${{ needs.detect.outputs.run_real == 'true' }}
        id: e2e
        # MEASUREMENT + SMOKE IN ONE STEP (cinatra#3382). The job died three
        # times at each of two candidate heads with "The runner has received a
        # shutdown signal" after a green run of the same head — the demand, not
        # the change, decides, so the VM is sampled every 5s across the boot and
        # the whole suite.
        #
        # The sampler runs INSIDE this step on purpose. Started from a step of
        # its own it wrote exactly ONE line into the job log (mem_used_mb=1623
        # mem_available_mb=14366 at 00:47:19Z on run 34546389270): a background
        # process's stdout belongs to the step that started it and is closed
        # when that step ends, so every later sample went nowhere and the file
        # the always() step would have uploaded died with the VM. Launched here,
        # the loop writes into the log of a step that is still running, so every
        # sample up to the moment of death survives; the loop is killed by pid at
        # the end of this script and by the EXIT trap on any error path. The
        # always() report and the artifact below still serve the runs that
        # complete.
        #
        # The boot is the same one the separate steps ran: next.config sets
        # `output: "standalone"`, so server.js runs exactly like the Dockerfile
        # (static/public copied alongside it), and the readiness poll hits
        # /api/auth/get-session (light; proves the server + Better Auth public
        # schema are alive, and the instrumentation hook provisions the
        # cinatra_e2e_dashboard schema on first query).
        #
        # E2E_REUSE_SERVER=1 → tests/e2e/config/dashboards.config.ts disables its
        # own webServer and reuses that standalone server. The suite is wrapped in
        # `timeout` (SIGTERM at 20m — ABOVE the config's 18m globalTimeout so
        # Playwright writes its report first; SIGKILL 60s later) and the step
        # forces `exit 0` so the report-upload steps below always run; the assert
        # step fails the job on a non-zero Playwright exit.
        env:
          E2E_REUSE_SERVER: "1"
          E2E_BASE_URL: http://localhost:3100
          E2E_PORT: "3100"
        run: |
          set -u
          SAMPLE_FILE="${RUNNER_TEMP}/agents-smoke-memory.txt"
          touch "$SAMPLE_FILE"
          echo "AGENTS_SMOKE_MEMORY_FILE=${SAMPLE_FILE}" >> "$GITHUB_ENV"
          (
            while true; do
              {
                date -u +%T
                free -m | awk '/^Mem:/ { print "  mem_used_mb=" $3 " mem_available_mb=" $7 }'
                ps -eo rss=,comm= --sort=-rss | head -3 | awk '{ print "  rss_kb=" $1 " " $2 }'
              } | stdbuf -oL tee -a "$SAMPLE_FILE"
              sleep 5
            done
          ) &
          SAMPLER_PID=$!
          echo "AGENTS_SMOKE_MEMORY_SAMPLER_PID=${SAMPLER_PID}" >> "$GITHUB_ENV"
          trap 'kill "$SAMPLER_PID" 2>/dev/null || true' EXIT
          echo "memory sampler launched as PID ${SAMPLER_PID} writing ${SAMPLE_FILE}"

          cp -r .next/static .next/standalone/.next/static
          [ -d public ] && cp -r public .next/standalone/public || true
          (cd .next/standalone && PORT=3100 HOSTNAME=0.0.0.0 node server.js > /tmp/dashboard-server.log 2>&1) &
          echo "standalone server launched as PID $!"

          ready=""
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3100/api/auth/get-session --max-time 5 2>/dev/null || echo 000)
            if [ "$code" = "200" ]; then echo "server ready after ${i} × 5s"; ready=1; break; fi
            sleep 5
          done
          if [ -z "$ready" ]; then
            echo "::error::server did not become ready in 5 min"
            tail -200 /tmp/dashboard-server.log
            exit 1
          fi

          timeout --kill-after=60 1200 pnpm test:e2e:dashboards
          code=$?
          echo "code=${code}" >> "$GITHUB_OUTPUT"
          echo "playwright exited with ${code}"
          kill "$SAMPLER_PID" 2>/dev/null || true
          exit 0

      - name: Upload Playwright report
        if: ${{ always() && needs.detect.outputs.run_real == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload standalone server log
        if: ${{ always() && needs.detect.outputs.run_real == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dashboard-server-log
          path: /tmp/dashboard-server.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Assert smoke passed
        # Fail the job on test failure / timeout, AFTER artifacts upload. Reads
        # steps.e2e.outputs.code (set only on the real path) — gated on
        # dashboards==true so the green stub never sees an empty code.
        if: ${{ needs.detect.outputs.run_real == 'true' }}
        run: |
          code="${{ steps.e2e.outputs.code }}"
          if [ "$code" != "0" ]; then
            echo "::error::dashboard live-verify smoke failed or timed out (exit ${code})"
            exit 1
          fi

      - name: Stop the memory sampler and report the readings
        # ALWAYS: the readings matter most on the runs that die. Reads the same
        # AGENTS_SMOKE_MEMORY_SAMPLER_PID the sampler step wrote to $GITHUB_ENV.
        # On the stub path (no sampler) both variables are empty and the step
        # says so and exits 0.
        if: ${{ always() }}
        run: |
          set -u
          pid="${AGENTS_SMOKE_MEMORY_SAMPLER_PID:-}"
          file="${AGENTS_SMOKE_MEMORY_FILE:-}"
          if [ -n "$pid" ]; then
            kill "$pid" 2>/dev/null || true
          fi
          if [ -z "$file" ] || [ ! -s "$file" ]; then
            echo "no memory samples recorded (the real-smoke path did not run)"
            exit 0
          fi
          echo "peak used memory (MB): $(awk -F'mem_used_mb=' '/mem_used_mb=/ { split($2, f, " "); if (f[1] + 0 > p) p = f[1] + 0 } END { print p + 0 }' "$file")"
          echo "minimum available memory (MB): $(awk -F'mem_available_mb=' '/mem_available_mb=/ { split($2, f, " "); v = f[1] + 0; if (m == "" || v < m) m = v } END { print (m == "" ? 0 : m) }' "$file")"
          echo "samples recorded: $(grep -c mem_used_mb "$file")"
          echo "--- last 40 lines of ${file} ---"
          tail -40 "$file"

      - name: Upload the memory samples
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agents-smoke-memory
          # Never an empty path input: on the stub path the sampler step
          # did not run, so the variable is unset — fall back to the name
          # it would have written and let if-no-files-found: ignore pass.
          path: ${{ env.AGENTS_SMOKE_MEMORY_FILE || format('{0}/agents-smoke-memory.txt', runner.temp) }}
          retention-days: 7
          if-no-files-found: ignore
