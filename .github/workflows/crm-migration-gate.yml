name: CRM Migration Gate

# Guards the Twenty CRM migration's retirement of the legacy CRM surfaces.
# Dedicated workflow (not a build-image.yml job) so it can run on OAS-only /
# script-only changes that build-image.yml's paths-ignore would skip, and to
# keep the densely phase-annotated build-image.yml untouched.
#
# Two gates:
#   - crm-pointer-gate (--strict): no retired accounts_*/contacts_*/lists_* MCP
#     primitives, no heavy-field reads off cinatra.objects for CRM types, and no
#     legacy entity typeHints outside the allowlisted facade/stub/substrate
#     surfaces. CRM records live in Twenty; cinatra holds only pointer rows.
#   - oas-banned-primitives-gate: the crm-pointer-gate skips /cinatra/oas.json,
#     so this companion scans the LLM-visible OAS prompt strings of every
#     extensions/**/cinatra/oas.json for the same retired surfaces.

on:
  # No `paths:` filter on either trigger. The `CRM migration gates` job is a
  # branch-protection required-status-check on `main` — if the workflow
  # didn't run (because a docs-only PR's paths fell outside a filter), the
  # required check would stay Pending and block the merge. So this workflow
  # always runs on every push to `main` and every PR to `main`. The gate
  # scripts are fast (a few Node-only static scans + one vitest file).
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # merge_group (engineering#484): `CRM migration gates` is a branch-protection
  # required check, so it must also conclude on GitHub merge-queue candidates
  # or a queue entry hangs forever on the missing check (found by
  # scripts/ci/merge-group-coverage-guard.mjs — this was the one required
  # context outside the 5 org gates without merge_group coverage). The job is
  # event-agnostic (static scans over the checkout). Inert until a merge queue
  # is enabled (engineering#485).
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# cinatra#3355 — the committed worker cap for every vitest invocation in this
# workflow (a workflow-level `env:` is in scope for the steps of every job in
# the file). The value is the INTERIM worker count cinatra#3355 records, now
# given a committed home in the tree; that issue's criterion-3 comparison of
# runner and worker configurations may replace it. It makes no claim about what
# the runner services on the box carry today.
# Enforced by scripts/audit/vitest-worker-cap.mjs.
env:
  VITEST_MAX_WORKERS: "3"

jobs:
  # ---------------------------------------------------------------------------
  # changes — does this pull request touch anything the jobs below read?
  # (cinatra#3508)
  #
  # On `pull_request` dorny/paths-filter reads the PR's changed files from the
  # REST API (needs `pull-requests: read`) — no checkout, ~5s, no services. On
  # every other event (push to main, merge_group, schedule, dispatch) there is
  # no changed-file set to read, so the output is forced true and the jobs below
  # run for real.
  #
  # The guard is JOB-level, never a `paths:` trigger filter: a guarded job that
  # does not run still reports `skipped`, which branch protection counts as
  # passing, while a filtered-out WORKFLOW never reports at all and leaves a
  # required context waiting forever.
  # ---------------------------------------------------------------------------
  changes:
    name: Detect changed paths (crm-migration-gate)
    runs-on: ${{ fromJSON(vars.CI_RUNNER_GATE || '"ubuntu-latest"') }}
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      crm: ${{ github.event_name != 'pull_request' || steps.filter.outputs.crm == 'true' }}
    steps:
      - id: filter
        if: ${{ github.event_name == 'pull_request' }}
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # The scanners below walk the WHOLE tracked tree, so the rule is the
          # tree minus their own skip lists; `every` makes the negations bite (the same quantifier build-image.yml and e2e-app-suites.yml already use for their inverse filters)
          # (the default `some` would let '**' match on its own).
          predicate-quantifier: 'every'
          filters: |
            crm:
              # Derived from the gate's four scan steps: crm-pointer-gate.mjs and
              # oas-banned-primitives-gate.mjs walk REPO_ROOT itself
              # (scripts/audit/crm-pointer-gate.mjs:278 `walk(REPO_ROOT)`), so the
              # honest rule is the WHOLE tree minus the scanners' own SKIP_DIRS
              # (crm-pointer-gate.mjs:147) and SKIP_FILE_EXTS — a four-directory
              # list would have let a banned primitive land in, say,
              # docker-compose.yml with this gate skipped. The two test steps run
              # their suites under scripts/audit/__tests__ and the extension trees
              # the OAS scan reads are materialised by the `Clone companion
              # extension repos` step from the pinned clone-back locks; both are
              # inside the tree below.
              - '**'
              - '!docs/**'
              - '!.planning/**'
              - '!.claude/**'
              - '!README.md'
              - '!**/*.png'
              - '!**/*.jpg'
              - '!**/*.jpeg'
              - '!**/*.gif'
              - '!**/*.webp'
              - '!**/*.svg'
              - '!**/*.ico'
              - '!**/*.woff'
              - '!**/*.woff2'
              - '!**/*.ttf'
              - '!**/*.eot'

  gate:
    name: CRM migration gates
    needs: [changes]
    # A skipped job still reports `CRM migration gates` as skipped, which the
    # branch protection counts as a pass — the required context never hangs.
    if: ${{ needs.changes.outputs.crm == 'true' }}
    runs-on: ${{ fromJSON(vars.CI_RUNNER_HEAVY || '"ubuntu-latest"') }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Clone companion extension repos
        uses: ./.github/actions/clone-extensions

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: CRM pointer-row gate (strict)
        run: node scripts/audit/crm-pointer-gate.mjs --strict

      - name: OAS banned-primitives gate
        run: node scripts/audit/oas-banned-primitives-gate.mjs

      - name: OAS banned-primitives gate tests
        run: pnpm exec vitest run scripts/audit/__tests__/oas-banned-primitives-gate.test.mjs

      - name: CRM pointer-row gate tests
        run: node --test scripts/audit/__tests__/crm-pointer-gate.test.mjs
