name: truthful-attribution-gate

# Thin caller for the org-reusable truthful-attribution-gate (cinatra-ai/ci),
# per the Truthful Attribution protocol; supersedes the earlier paused
# no-AI-attribution gate.
#
# ENFORCE mode (spec §7 step 5): the gate computes presence + anti-fabrication
# findings (a truthful `Assisted-by`; a `Reviewed-by` that matches a real,
# non-self, non-stale PR approval at the reviewed head by a login whose repo
# permission meets the claimed tier; a `Gate-suite` that matches the committed
# `.github/gate-suite.json` and whose required contexts ran green; high-risk
# paths require the human arm at tier=maintainer) and FAILS the check on any
# error-severity finding. The WARN→ENFORCE flip is unblocked because the
# dedicated machine identity for agent-opened PRs is live (spec §5/§8.5) —
# the bot authors agent PRs, @groganz approves,
# so `author != approver` holds mechanically and self-approval never deadlocks.
#
# Double-pinned: the reusable workflow is pinned to an immutable SHA AND carries
# the version comment (the moving ci marker re-pointed to this SHA) on the
# `uses:` line below, exactly like the other cinatra-ai/ci gate callers here.
#
# The named, versioned `.github/gate-suite.json` (required-check set + the
# Accountable engineer) lands in THIS same ENFORCE-bootstrap PR, carrying a
# human-arm tier=maintainer record (the gate cannot bless its own birth — it is
# a high-risk org-governance path). Enforce mode also requires live branch
# protection (strict "require branches up to date" + the required contexts) to
# match the committed suite; that is applied alongside this merge (spec §7
# step 3/5 bootstrap precondition).

on:
  pull_request:
  # merge_group (engineering#484): post this required context on GitHub
  # merge-queue candidates so a queue entry never hangs on "Expected — Waiting"
  # (same forward-safe rationale as build-image.yml). Inert until a merge queue
  # is enabled (engineering#485) — no merge_group event fires without one.
  # HONEST LIMIT at the current pin (ci@0d42bca): the reusable engine workflow
  # has only `pull_request` and `push` arms, so on a merge_group event both
  # gate steps skip and the context concludes green WITHOUT re-verifying the
  # synthetic candidate. The fail-closed post-merge push arm still validates
  # every landed squash record, and the engine's content/diff staleness binding
  # (ci#60) already recognizes merge_group synthetic commits — but BEFORE a
  # Path-A queue enablement the ci engine needs a real merge_group pre-merge
  # arm and this pin must advance to it.
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  checks: read
  # actions:read is required by the reusable engine (since ci@8eede102): it
  # resolves a reusable-workflow check-run to its Actions run (GET
  # /actions/runs/{id}) to verify referenced_workflows[] at the pinned SHA. A
  # called reusable workflow's permissions cannot EXCEED the caller's grant, so
  # the caller must grant actions:read or the run fails to start (startup_failure).
  actions: read

jobs:
  truthful-attribution-gate:
    # Double-pin per the workflow-pinning convention: the workflow ref (@<sha>)
    # and the `ref` engine-checkout input below are pinned to the SAME
    # cinatra-ai/ci commit, so the gate code is never pulled from mutable main.
    # gate-suite.json requiredContexts[].pinned tracks this uses:@ SHA (the gate
    # verifies referenced_workflows[] exactly) — bump them together.
    uses: cinatra-ai/ci/.github/workflows/truthful-attribution-gate.yml@72d0b1caa9b11e33a9ba3e65e55aae46ad844bf1 # v0.1.2-next.0d42bca
    with:
      mode: enforce
      ref: 0d42bca62a57daf2067c19f6fb500583ac3b6acd # same SHA as the workflow @ref
