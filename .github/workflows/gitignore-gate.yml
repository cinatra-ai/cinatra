name: gitignore-gate

on:
  pull_request:
  # The merge queue runs this required check on the candidate commit it built
  # (engineering#658 item 1). Without the trigger the context never reports on a
  # queue entry and the entry waits for it forever.
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitignore-gate:
    uses: cinatra-ai/ci/.github/workflows/gitignore-gate.yml@696c647dbbd8eb605e6e71a2243605b0a50c7dd1 # v0.1.0
    with:
      ref: 4c903fe9ca71ad47752a2bc92b72893e5f7c9814
