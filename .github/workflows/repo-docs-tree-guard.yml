# Repo docs-layout tree-state guard (cinatra#1446 AC8).
#
# Runs `scripts/audit/repo-docs-tree-guard.mjs` on every PR + push to main.
# Asserts against the TRACKED tree: docs/ top-level is exactly
# {README.md, internals/} (README a regular file), no *.json anywhere under
# docs/** (machine config lives in config/), and pr-evidence/** is absent.
#
# A dedicated workflow is used (rather than only the build-image.yml job)
# because docs-only changes are paths-classified skip in build-image.yml —
# a docs-only regression (the guard's principal target) would otherwise
# skip the root test suite entirely. Same topology as
# administration-route-gate.yml, and dependency-free (node + git, no
# pnpm install), so the job stays lean.

name: Repo Docs Tree Guard

on:
  pull_request:
    # Draft PRs skip this gate; it runs on push-to-main and non-draft PRs
    # (ready_for_review re-runs it when a draft is marked ready).
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repo-docs-tree-guard:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Repo docs tree guard
        run: node scripts/audit/repo-docs-tree-guard.mjs
