name: secrets-required-gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secrets-required-gate:
    # In production pin BOTH to the same commit SHA: the workflow ref (`@<sha>`)
    # and the `ref` input below. Pinned here to the cinatra-ai/ci PR head that
    # introduces this gate; the prerelease comment marks it (engineering#315).
    # Re-pin to the ci release SHA + tag once that PR merges and ci is released.
    uses: cinatra-ai/ci/.github/workflows/secrets-required-gate.yml@d786b5311891287c38985236e08f47277bc9d8a3 # v0.1.0-next.d786b53
    with:
      ref: d786b5311891287c38985236e08f47277bc9d8a3
