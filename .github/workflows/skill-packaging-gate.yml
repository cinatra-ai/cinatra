name: skill-packaging-gate

# Enforces the Anthropic-schema skill PACKAGING + STRUCTURE contract
# (cinatra#2089, epic #2086 S2) — one bundle per `kind:"skill"` extension, the
# singular `-skill` package name, an Anthropic-clean SKILL.md router (schema,
# directory-name ≡ frontmatter name, router length, the fail-closed one-hop
# reference lint, the upload size boundary), and the package-wide SKILL.md ban
# for every non-skill kind.
#
# This gate runs THE SAME verdict module the store-install seam
# (src/lib/skill-packaging-install-gate.ts) applies and the extension repos'
# publish gate vendors, so a non-conforming extension gets the SAME verdict text
# at CI, at store install and at publish.
#
# The gate needs the CLONED-BACK extension universe (its ARM B) — the same
# `.github/actions/clone-extensions` hydration the extension-README gate uses —
# so a lock bump moves the universe it validates and is therefore a trigger path.

on:
  push:
    branches: [main]
    # GitHub Actions does not expand YAML anchors — the two path lists are
    # deliberately identical copies.
    paths:
      - 'scripts/audit/skill-packaging-gate.mjs'
      - 'scripts/audit/skill-frontmatter-gate.mjs'
      - 'scripts/audit/_lib/skill-packaging-verdict.*'
      - 'scripts/audit/__tests__/skill-packaging-gate.test.mjs'
      - 'config/skill-fixture-allowlist.json'
      - 'config/skill-packaging-legacy-exceptions.json'
      - '**/SKILL.md'
      - 'src/lib/skill-packaging-install-gate.ts'
      - 'src/lib/skill-bundle-store.ts'
      # Pinned clone-back inputs (the gate scans the cloned-back tree, so a lock
      # bump moves the extension universe it validates):
      - 'cinatra-required-extensions.lock.json'
      - 'cinatra-dev-extensions.lock.json'
      - '.github/actions/clone-extensions/**'
      - 'scripts/ci/sync-dev-extensions.mjs'
      - '.github/workflows/skill-packaging-gate.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/audit/skill-packaging-gate.mjs'
      - 'scripts/audit/skill-frontmatter-gate.mjs'
      - 'scripts/audit/_lib/skill-packaging-verdict.*'
      - 'scripts/audit/__tests__/skill-packaging-gate.test.mjs'
      - 'config/skill-fixture-allowlist.json'
      - 'config/skill-packaging-legacy-exceptions.json'
      - '**/SKILL.md'
      - 'src/lib/skill-packaging-install-gate.ts'
      - 'src/lib/skill-bundle-store.ts'
      # Pinned clone-back inputs (the gate scans the cloned-back tree, so a lock
      # bump moves the extension universe it validates):
      - 'cinatra-required-extensions.lock.json'
      - 'cinatra-dev-extensions.lock.json'
      - '.github/actions/clone-extensions/**'
      - 'scripts/ci/sync-dev-extensions.mjs'
      - '.github/workflows/skill-packaging-gate.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: Skill packaging gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'

      - name: Clone companion extension repos
        uses: ./.github/actions/clone-extensions

      - name: Run packaging gate
        run: node scripts/audit/skill-packaging-gate.mjs

      - name: Run frontmatter gate
        run: node scripts/audit/skill-frontmatter-gate.mjs

  tests:
    name: Skill packaging gate — verdict tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install workspace
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run verdict + agreement-pin tests
        run: pnpm exec vitest run scripts/audit/__tests__/skill-packaging-gate.test.mjs src/lib/__tests__/skill-packaging-install-gate.test.ts
