name: source-leak-gate

# merge_group (engineering#484): the reusable engine's diff-base resolver is
# merge_group-aware as of cinatra-ai/ci@c3bc633 (already inside the pin below,
# which is a descendant commit) — it keys off merge_group.base_sha instead of
# the pull_request/push arms, so a merge-queue candidate still gets a real
# base-relative scan (never a wider or narrower one). Reports this required
# context on merge-queue candidates so a queue entry never hangs waiting for
# it. Inert until a merge queue is enabled (engineering#485).

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

jobs:
  source-leak-gate:
    # Double-pin: uses:@ and the `ref` engine-checkout input pinned to the SAME
    # cinatra-ai/ci commit. gate-suite.json requiredContexts[].pinned tracks this
    # uses:@ SHA (the gate verifies referenced_workflows[] exactly) — bump them
    # together.
    uses: cinatra-ai/ci/.github/workflows/source-leak-gate.yml@45826486a3965bc8ebd6203a26330ad0dc1ae511 # v0.1.2-next.4582648
    with:
      profile: ts-monorepo
      ratchet_mode: line
      # Exempts the repo-local actions-pinned-gate engine source + test by
      # basename: they necessarily contain the version-comment markers they
      # enforce (same exemption cinatra-ai/ci applies to its own copy).
      config: .github/source-leak-gate.config.json
      ref: 45826486a3965bc8ebd6203a26330ad0dc1ae511 # same SHA as the workflow @ref
