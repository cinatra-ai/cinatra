name: source-leak-gate

on:
  pull_request:
  # merge_group (engineering#484): post this required context on GitHub
  # merge-queue candidates so a queue entry never hangs on the missing check.
  # The pinned engine (ci@4582648, a descendant of ci#59 @c3bc633) resolves the
  # incremental diff base from merge_group.base_sha via the shared
  # resolve-diff-base.sh resolver, preserving the ratchet-line semantics a PR
  # gets. Inert until a merge queue is enabled (engineering#485).
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  source-leak-gate:
    # Double-pin: uses:@ and the `ref` engine-checkout input pinned to the SAME
    # cinatra-ai/ci commit. gate-suite.json requiredContexts[].pinned tracks this
    # uses:@ SHA (the gate verifies referenced_workflows[] exactly) — bump them
    # together.
    uses: cinatra-ai/ci/.github/workflows/source-leak-gate.yml@00ac7b92c2ca1ca291a1824d743cbd00c4a3e48e # v0.1.2-next.00ac7b9
    with:
      profile: ts-monorepo
      ratchet_mode: line
      # Exempts the repo-local actions-pinned-gate engine source + test by
      # basename: they necessarily contain the version-comment markers they
      # enforce (same exemption cinatra-ai/ci applies to its own copy).
      config: .github/source-leak-gate.config.json
      ref: 00ac7b92c2ca1ca291a1824d743cbd00c4a3e48e # same SHA as the workflow @ref
