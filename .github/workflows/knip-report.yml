name: knip-report

# REPORT-ONLY dead-code / unused-dependency reporter (closeout W2).
#
# Runs `knip` (config: knip.json) and surfaces unused files / exports /
# dependencies as a job summary. It is DELIBERATELY NON-BLOCKING: the knip step
# uses `--no-exit-code`, so a finding never fails the build. This is the agreed
# ratchet policy for this milestone — REPORT-ONLY now, with the option to flip
# to a gating ratchet (knip exit-on-findings + a baseline of tolerated misses,
# mirroring scripts/audit/*.baseline.json) in a later milestone.
#
# Why it still clones the companion extension tree + installs frozen: knip
# resolves the pnpm workspace graph, and a fresh clone without the source-mirror
# extension packages fails `pnpm install` resolution outright
# (ERR_PNPM_WORKSPACE_PKG_NOT_FOUND). The clone-extensions action runs
# `scripts/ci/sync-dev-extensions.mjs --pinned` so the universe matches the
# committed lockfile. `extensions/**` is ignored by knip.json itself (the trees
# are loaded dynamically via manifest serverEntry / generated registries, not
# statically analyzable, and are never edited from this repo).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # changes — does this pull request touch anything the jobs below read?
  # (cinatra#3508)
  #
  # On `pull_request` dorny/paths-filter reads the PR's changed files from the
  # REST API (needs `pull-requests: read`) — no checkout, ~5s, no services. On
  # every other event (push to main, merge_group, schedule, dispatch) there is
  # no changed-file set to read, so the output is forced true and the jobs below
  # run for real.
  #
  # The guard is JOB-level, never a `paths:` trigger filter: a guarded job that
  # does not run still reports `skipped`, which branch protection counts as
  # passing, while a filtered-out WORKFLOW never reports at all and leaves a
  # required context waiting forever.
  # ---------------------------------------------------------------------------
  changes:
    name: Detect changed paths (knip-report)
    runs-on: ${{ fromJSON(vars.CI_RUNNER_GATE || '"ubuntu-latest"') }}
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ github.event_name != 'pull_request' || steps.filter.outputs.code == 'true' }}
    steps:
      - id: filter
        if: ${{ github.event_name == 'pull_request' }}
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            code:
              # Derived from the `Generate route types (next typegen)` and `knip`
              # steps: knip resolves the workspace graph from the manifests and the
              # knip.json config and reports on the source trees it lists
              # (extensions/** is ignored by knip.json itself), and the pinned
              # clone-back locks decide the extension universe the install resolves.
              - '.github/workflows/**'
              - 'src/**'
              - 'packages/**'
              - 'scripts/**'
              - 'tests/**'
              - 'knip.json'
              - 'next.config.ts'
              - 'tsconfig.json'
              - '**/package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'cinatra-required-extensions.lock.json'
              - 'cinatra-dev-extensions.lock.json'
              # the install hook and the composite action the clone step runs
              - '.pnpmfile.cjs'
              - '.github/actions/**'

  knip-report:
    name: knip dead-code report (non-blocking)
    needs: [changes]
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ${{ fromJSON(vars.CI_RUNNER_HEAVY || '"ubuntu-latest"') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Clone companion extension repos
        uses: ./.github/actions/clone-extensions

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Generate Next's route types so knip resolves the App Router entry graph
      # the same way the typecheck job does (.next/types/*).
      - name: Generate route types (next typegen)
        run: pnpm exec next typegen

      # `--no-exit-code` keeps this report-only: findings are surfaced, never gated.
      - name: knip (report-only)
        run: pnpm exec knip --no-exit-code --reporter markdown | tee "$GITHUB_STEP_SUMMARY"
