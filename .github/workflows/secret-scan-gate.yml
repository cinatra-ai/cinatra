name: secret-scan-gate

on:
  pull_request:
  # The merge queue runs this required check on the candidate commit it built
  # (engineering#658 item 1). Without the trigger the context never reports on a
  # queue entry and the entry waits for it forever.
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan-gate:
    uses: cinatra-ai/ci/.github/workflows/secret-scan-gate.yml@696c647dbbd8eb605e6e71a2243605b0a50c7dd1 # v0.1.0
    with:
      # The range to scan is the EVENT'S OWN range: a queue candidate is not
      # a pull request and carries no pull_request payload, so on merge_group
      # the gate reads the group's base and head instead (engineering#658
      # item 1). Scanning a pull request's range on a queue run would scan
      # the wrong commits, or none at all.
      base_sha: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event.pull_request.base.sha }}
      head_sha: ${{ github.event_name == 'merge_group' && github.event.merge_group.head_sha || github.event.pull_request.head.sha }}
      # The excluded paths are the memory secret-DETECTOR's own fixture files: their
      # fake credential-URL shapes are the detector's test subjects, assembled at
      # runtime since 0fddb220b, but the range scan still sees the pre-defusal
      # diffs at these paths. Path exclusion keeps the history intact and auditable.
      # A path exclusion is permanent and total: from this commit on, this gate
      # never scans the three listed files again, in any future commit. Its green
      # on them is not coverage.
      extra_args: --exclude-paths=.trufflehog-exclude
