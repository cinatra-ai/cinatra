            echo "port ${E2E_DESIGN_PORT} holders after cleanup: $(lsof -ti "tcp:${E2E_DESIGN_PORT}" | tr '\n' ' ' || true)"
          fi
      - name: Record bounded trial outcome and stop owned sampler
        if: ${{ always() && steps.trial_identity.outcome == 'success' }}
        env:
          TRIAL_BUILD_OUTCOME: ${{ steps.trial_build.outcome }}
          TRIAL_SUITE_OUTCOME: ${{ steps.trial_suite.outcome }}
          TRIAL_JOB_STATUS: ${{ job.status }}
        run: node scripts/ci/hosted-build-size-trial.mjs finish

