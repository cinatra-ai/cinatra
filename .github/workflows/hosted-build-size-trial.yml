          set -uo pipefail
          if [ -n "${DESIGN_SERVER_PID:-}" ]; then
            kill "$DESIGN_SERVER_PID" 2>/dev/null || true
            for _ in $(seq 1 10); do
              kill -0 "$DESIGN_SERVER_PID" 2>/dev/null || break
              sleep 1
            done
            kill -9 "$DESIGN_SERVER_PID" 2>/dev/null || true
            echo "stopped standalone server PID ${DESIGN_SERVER_PID}"
          else
            echo "no standalone server pid recorded — nothing to stop"
          fi
