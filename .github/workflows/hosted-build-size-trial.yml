      # ----- real smoke path: everything below is gated on dashboards==true -----
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The real smoke runs untrusted fork-PR code (a fork PR touching a
          # dashboard path takes this branch). Don't leave the ephemeral
          # GITHUB_TOKEN persisted in the git config for that code to reuse —
          # the smoke does no git operations that need it.
          persist-credentials: false

      - name: Verify immutable trial workload and runner
        id: trial_identity
        env:
          TRIAL_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: node scripts/ci/hosted-build-size-trial.mjs begin
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
