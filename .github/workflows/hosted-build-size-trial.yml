    name: trial / dashboard / ${{ inputs.cohort }}
    if: ${{ github.event_name == 'workflow_dispatch' && github.run_attempt == 1 && inputs.workload == 'dashboard' && (inputs.cohort == 'standard' || inputs.cohort == 'large') }}
    runs-on: ${{ inputs.cohort == 'large' && fromJSON('{"group":"ci-build-trial-3316","labels":"ci-build-trial-3316-8core"}') || 'ubuntu-24.04' }}
    # ALWAYS run so the required check always reports a result (never a
    # never-arriving "Expected"). The first step fails the job loudly if
    # `detect` did not succeed — otherwise a broken detector would let the
    # required check pass silently (false green).
    # Opt-in larger-runner lever — same mechanism build-image's build/e2e jobs
    # use. Zero-risk no-op (stays ubuntu-latest) until the org/repo variable
    # CI_BUILD_RUNNER is set to a larger label (e.g. ubuntu-latest-4-cores, 16GB).
    # Job cap 45 (prod build + standalone server boot + suite). The Playwright
    # run is wrapped in a shell `timeout` (below) sized ABOVE the config's
    # globalTimeout, so a hung suite SIGTERMs Playwright after it has written
    # its report, the report uploads, and a final assert step fails the job RED
    # — never a job-level cancel with no diagnostics (the old failure mode).
    timeout-minutes: 45

    services:
      # Conditional service containers: an empty `image` string means the
      # service is NOT started. On non-dashboard PRs (the common case) the
      # stub path needs no Postgres/Redis, so they don't spin up.
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          # Container port only: the runner publishes it on a RANDOM free
          # host port, read back from `job.services.postgres.ports` in this
          # job's first step, so two jobs holding a postgres on ONE
          # self-hosted machine never race for one host port (cinatra#3267).
          - "5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8
        ports:
          # Container port only: the runner publishes it on a RANDOM free
          # host port, read back from `job.services.redis.ports` in this
          # job's first step, so two jobs holding a redis on ONE
          # self-hosted machine never race for 6379 (cinatra#3267).
          - "6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # SUPABASE_DB_URL and REDIS_URL are deliberately NOT here: they name the
      # RANDOM host ports the runner mapped for this job's service containers,
      # which a job-level `env:` cannot read. The real-smoke path's first step
      # exports both to $GITHUB_ENV instead (cinatra#3267).
