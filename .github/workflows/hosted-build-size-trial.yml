        # times at each of two candidate heads with "The runner has received a
        # shutdown signal" after a green run of the same head — the demand, not
        # the change, decides, so the VM is sampled every 5s across the boot and
        # the whole suite.
        #
        # The sampler runs INSIDE this step on purpose. Started from a step of
        # its own it wrote exactly ONE line into the job log (mem_used_mb=1623
        # mem_available_mb=14366 at 00:47:19Z on run 34546389270): a background
        # process's stdout belongs to the step that started it and is closed
        # when that step ends, so every later sample went nowhere and the file
        # the always() step would have uploaded died with the VM. Launched here,
        # the loop writes into the log of a step that is still running, so every
        # sample up to the moment of death survives; the loop is killed by pid at
        # the end of this script and by the EXIT trap on any error path. The
        # always() report and the artifact below still serve the runs that
        # complete.
        #
        # The boot is the same one the separate steps ran: next.config sets
        # `output: "standalone"`, so server.js runs exactly like the Dockerfile
        # (static/public copied alongside it), and the readiness poll hits
        # /api/auth/get-session (light; proves the server + Better Auth public
        # schema are alive, and the instrumentation hook provisions the
        # cinatra_e2e_dashboard schema on first query).
        #
        # E2E_REUSE_SERVER=1 → tests/e2e/config/dashboards.config.ts disables its
        # own webServer and reuses that standalone server. The suite is wrapped in
        # `timeout` (SIGTERM at 20m — ABOVE the config's 18m globalTimeout so
