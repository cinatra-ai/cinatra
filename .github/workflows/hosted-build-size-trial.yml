  image:
    name: trial / image / ${{ inputs.cohort }}
    if: ${{ github.event_name == 'workflow_dispatch' && github.run_attempt == 1 && inputs.workload == 'image' && (inputs.cohort == 'standard' || inputs.cohort == 'large') }}
    runs-on: ${{ inputs.cohort == 'large' && fromJSON('{"group":"ci-build-trial-3316","labels":"ci-build-trial-3316-8core"}') || 'ubuntu-24.04' }}
    # The container build itself, UN-SERIALIZED from the unit tier (critical-path
    # fix): it now starts at `detect` instead of waiting ~5-6 min for `test` +
    # the unit jobs, cutting the workflow's wall clock from ~19 to ~13-14 min.
    # The merge-gate coupling those `needs` used to provide is NOT lost — it
    # moved wholesale into the `build` FAN-IN job below, which keeps the exact
    # required-context name (`build`) and hard-fails unless this job AND the
    # whole unit tier succeeded. Publishing still hangs off `build`, so a red
    # unit job still blocks every image publish including `latest`; the only
    # new cost is a discarded image build on a push whose unit tier fails.
    # HOSTED, not the E2E class: the prod-boot e2e step below RUNS the image this
    # job builds a step earlier. The build step already asks for `load: true`,
    # and on the self-hosted pool's docker-container buildx driver the image
    # still did not arrive in the daemon the e2e then reaches — it answered
    # `Unable to find image 'cinatra-prod-boot-e2e:ci' locally` — while a
    # GitHub-hosted runner's docker driver puts it there every time. This job
    # moves to the E2E class once that hand-off works on the pool; the
    # self-hosted cache arms below are kept ready for exactly that.
    # Bound the worst-case slow-runner hang. Typical wall-clock is ~10-11 min
    # for the image build (next build is the dominant pole) plus ~3-5 min for
    # the prod-boot e2e (image load + fresh-DB setup + boot + probes); we've
    # seen occasional 25-30 min hangs on contended runners, and by 2026-08 a
    # fully green pass crosses the old 30-min line (the prod-boot suite grew;
    # a passing run was cancelled at 30:00 with the suite green at 29:59+).
    # 45 min is generous over normal and still surfaces a real stall as a job
    # failure (artifacts/logs preserved) instead of letting it eat the
    # workflow budget invisibly. Same defensive class as the RBAC globalTimeout.
    timeout-minutes: 45
    steps:
