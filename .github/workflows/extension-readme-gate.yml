name: Extension README Gate

# Validates docs/developer/extension-readme.md contract against every in-scope
# extension under extensions/cinatra-ai/. Dedicated workflow (not a build-image.yml
# job) because build-image.yml's paths-ignore excludes **/*.md.

on:
  push:
    branches: [main]
    paths:
      - 'extensions/**/README.md'
      - 'extensions/**/.readme-pending'
      - 'extensions/**/package.json'
      - 'scripts/audit/extension-readme-gate*.mjs'
      # Pinned clone-back inputs (the gate scans the cloned-back tree, so a
      # lock bump moves the README universe it validates):
      - 'cinatra-required-extensions.lock.json'
      - 'cinatra-dev-extensions.lock.json'
      # Clone-back implementation closure + the config that owns
      # cinatraDevExtensions (a clone-back change moves what materializes):
      - '.github/actions/clone-extensions/**'
      - 'scripts/ci/sync-dev-extensions.mjs'
      - 'packages/cli/src/cinatra-dev-extensions.mjs'
      - 'packages/cli/src/dev-repo-sync.mjs'
      - 'package.json'
      - 'scripts/audit/__tests__/**'
      - 'docs/developer/extension-readme.md'
      - '.github/workflows/extension-readme-gate.yml'
  pull_request:
    branches: [main]
    paths:
      - 'extensions/**/README.md'
      - 'extensions/**/.readme-pending'
      - 'extensions/**/package.json'
      - 'scripts/audit/extension-readme-gate*.mjs'
      # Pinned clone-back inputs (the gate scans the cloned-back tree, so a
      # lock bump moves the README universe it validates):
      - 'cinatra-required-extensions.lock.json'
      - 'cinatra-dev-extensions.lock.json'
      # Clone-back implementation closure + the config that owns
      # cinatraDevExtensions (a clone-back change moves what materializes):
      - '.github/actions/clone-extensions/**'
      - 'scripts/ci/sync-dev-extensions.mjs'
      - 'packages/cli/src/cinatra-dev-extensions.mjs'
      - 'packages/cli/src/dev-repo-sync.mjs'
      - 'package.json'
      - 'scripts/audit/__tests__/**'
      - 'docs/developer/extension-readme.md'
      - '.github/workflows/extension-readme-gate.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Extension README gate
    runs-on: ${{ fromJSON(vars.CI_RUNNER_GATE || '"ubuntu-latest"') }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history (all branches) so the recorded PR base commit is
          # present and the merge base below resolves without any extra fetch.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      # cinatra#2212 — diff against THIS RUN'S OWN merge base, pinned as a SHA.
      # Replaces a `git fetch --no-tags --depth=1 origin
      # <base>:refs/remotes/origin/<base>`: against the complete clone the
      # checkout above produces, that fetch left the ref untouched when the live
      # tip was already present and only wrote .git/shallow at that tip, cutting
      # its ancestry. Any run whose recorded merge commit predated the live tip
      # then had no reachable common ancestor and the gate died with
      # `fatal: origin/<base>...HEAD: no merge base` — a red that mimics a
      # contract violation over a clean contract (run 30448925863, job
      # 90566008119). github.event.pull_request.base.sha is frozen in THIS run's
      # event, so the base derived from it is a property of the snapshot under
      # test and main cannot move out from under it. For a fresh run it is the
      # same commit the old expression resolved to — the no-new-debt result is
      # unchanged (equivalence cases in
      # scripts/audit/__tests__/extension-readme-gate.test.mjs).
      - name: Resolve PR merge base
        id: merge-base
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # fetch-depth: 0 already fetched every branch, so the recorded base
          # commit is normally in hand; this best-effort fetch only covers a
          # base commit since rewritten off every branch tip (GitHub may refuse
          # a fully unreachable one — that is a loud, correct failure). NEVER
          # pass --depth here: the shallow graft is the bug.
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "${BASE_SHA}"
          fi
          # Normally base.sha IS the merge commit's first parent, i.e. the merge
          # base itself; merge-base still resolves correctly if the payload and
          # the merge ref were computed a beat apart, so only note the anomaly.
          git merge-base --is-ancestor "${BASE_SHA}" HEAD \
            || echo "::notice::recorded base ${BASE_SHA} is not an ancestor of HEAD; falling back to their common ancestor"
          # Fail-closed: an unresolvable merge base is a real anomaly and must
          # be a loud red, never a silently skipped no-new-debt check.
          MERGE_BASE="$(git merge-base "${BASE_SHA}" HEAD)"
          echo "sha=${MERGE_BASE}" >> "$GITHUB_OUTPUT"
          echo "no-new-debt base: ${MERGE_BASE} (recorded PR base ${BASE_SHA})"

      - name: Clone companion extension repos
        uses: ./.github/actions/clone-extensions

      - name: Run gate
        env:
          # Empty on push (the step above is skipped) — same as before, so the
          # push arm still skips the no-new-debt check.
          CINATRA_README_GATE_BASE_REF: ${{ steps.merge-base.outputs.sha }}
        run: node scripts/audit/extension-readme-gate.mjs

  tests:
    name: Extension README gate — parser tests
    runs-on: ${{ fromJSON(vars.CI_RUNNER_HEAVY || '"ubuntu-latest"') }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install workspace
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run parser tests
        run: pnpm exec vitest run scripts/audit/__tests__/extension-readme-gate.test.mjs
