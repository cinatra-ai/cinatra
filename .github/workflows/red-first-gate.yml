name: red-first-gate

# The tests a pull request adds or changes must fail on the code before the
# fix, for the right reason, and pass with the fix (cinatra-ai/ci
# red-first-gate). Not a required check. A pull request without a new test, or
# with no change besides tests, shows the red-first job as skipped; only a
# success of that job at the head is the proof. Playwright specs under
# tests/e2e need a running app and *.integration.test.* files need a database,
# so this check cannot prove them: a pull request whose new tests are all of
# those skips the red-first job (EXCLUDED-ONLY); beside other new tests each
# is a notice (EXCLUDED, not proven here) and the other new tests decide.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: red-first-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  red-first-gate:
    if: ${{ !(github.event.pull_request.head.repo.full_name == github.repository && (startsWith(github.head_ref, 'merge-queue/') || startsWith(github.head_ref, 'merge-batch/'))) }}
    uses: cinatra-ai/ci/.github/workflows/red-first-gate.yml@c97ddefbf21a3c94f074b07844163f2159205f35 # v0.1.4-next.c97ddef
    with:
      ref: "c97ddefbf21a3c94f074b07844163f2159205f35" # same SHA as the workflow @ref (quoted: a SHA of digits only is a YAML number)
      setup_pnpm: true
      install: node scripts/ci/sync-dev-extensions.mjs --pinned --shallow && pnpm install --frozen-lockfile
      vitest: pnpm exec vitest run --no-coverage --maxWorkers=3
      exclude: "tests/e2e/**/*.spec.*, **/*.integration.test.*"
      timeout_minutes: 45
