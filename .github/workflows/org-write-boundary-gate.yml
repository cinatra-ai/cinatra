# Org-write kernel boundary + registry gates — cinatra#1938 (archive epic S2).
#
# Four checks on every PR + push to main:
#   1. org-write-boundary-gate.mjs — kernel internals reachable only via the
#      package root (realpath-canonicalized), mintSystemWriteAuthority is
#      dispatcher-only, guardedBatchQueries has one consumer.
#   2. org-write-table-sweep.mjs — no NEW raw org-axis DML outside registered
#      modules (shrink-only baseline).
#   3. system-writer-manifest-gate.mjs — the non-registry system writers (boot
#      phases, backfills, CLI reconcilers) match the committed manifest exactly,
#      two-directional (cinatra#1941). Migrations are excluded by doctrine.
#   4. The kernel + org-write vitest suites (capability table, permits,
#      leases, tickets, resolvers, registry lockstep, gate self-tests) — run
#      here because packages/org-write-kernel/tests are not in the root
#      vitest include set.
#
# A dedicated workflow keeps the enforcement heart's gates independent of the
# build job (mcp-route-gate precedent).

name: Org-Write Boundary Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # changes — does this pull request touch anything the jobs below read?
  # (cinatra#3508)
  #
  # On `pull_request` dorny/paths-filter reads the PR's changed files from the
  # REST API (needs `pull-requests: read`) — no checkout, ~5s, no services. On
  # every other event (push to main, merge_group, schedule, dispatch) there is
  # no changed-file set to read, so the output is forced true and the jobs below
  # run for real.
  #
  # The guard is JOB-level, never a `paths:` trigger filter: a guarded job that
  # does not run still reports `skipped`, which branch protection counts as
  # passing, while a filtered-out WORKFLOW never reports at all and leaves a
  # required context waiting forever.
  # ---------------------------------------------------------------------------
  changes:
    name: Detect changed paths (org-write-boundary-gate)
    runs-on: ${{ fromJSON(vars.CI_RUNNER_GATE || '"ubuntu-latest"') }}
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      org_write: ${{ github.event_name != 'pull_request' || steps.filter.outputs.org_write == 'true' }}
    steps:
      - id: filter
        if: ${{ github.event_name == 'pull_request' }}
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            org_write:
              # Derived from the gate's five steps: org-write-boundary-gate.mjs scans
              # SCAN_ROOTS = src, packages, scripts; org-write-table-sweep.mjs and
              # system-writer-manifest-gate.mjs read the same roots; the last two
              # steps run packages/org-write-kernel's own suite and
              # src/lib/org-write/__tests__ plus the gate self-test — all under those
              # three roots, resolved through the workspace install.
              - '.github/workflows/**'
              - 'src/**'
              - 'packages/**'
              - 'scripts/**'
              # makeTsResolver() reads the repo tsconfig and resolves every
              # prohibited import through its `paths` aliases (fail-closed), so a
              # tsconfig edit alone can change what the gate sees; the two test
              # steps run under the root vitest config.
              - 'tsconfig.json'
              - 'vitest.config.ts'
              - '.pnpmfile.cjs'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'

  org-write-boundary-gate:
    needs: [changes]
    if: ${{ needs.changes.outputs.org_write == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    runs-on: ${{ fromJSON(vars.CI_RUNNER_HEAVY || '"ubuntu-latest"') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Kernel boundary gate
        run: node scripts/audit/org-write-boundary-gate.mjs
      - name: Org-axis raw-SQL sweep
        run: node scripts/audit/org-write-table-sweep.mjs
      - name: Non-registry system writer manifest gate
        run: node scripts/audit/system-writer-manifest-gate.mjs
      - name: Kernel test suite
        run: pnpm --filter @cinatra-ai/org-write-kernel test
      - name: Org-write resolver, registry and gate self-tests
        run: npx vitest run src/lib/org-write/__tests__ scripts/audit/__tests__/org-write-boundary-gate.test.ts
