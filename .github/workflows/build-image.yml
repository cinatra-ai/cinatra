name: Build and publish image

on:
  push:
    branches: [main]
    tags: ['v*']
    # Skip rebuilds for doc-only commits — these never affect the runtime image.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
  # NO PR-side path filter (intentionally). This workflow owns four REQUIRED
  # status checks on `main`. A `paths-ignore`-gated workflow does not trigger on
  # a docs-only PR, so its required checks never report and GitHub blocks the
  # merge forever as "Expected — Waiting for status". The workflow now triggers
  # on EVERY pull request; a `detect` job decides whether the PR is docs-only
  # and the four required jobs report a green stub when it is (see `detect` and
  # the required jobs below). The push-side `paths-ignore` above is deliberately
  # KEPT so a docs-only push to `main` still never rebuilds/republishes the
  # runtime image (image economics, orthogonal to required-check reporting).
  pull_request:
    branches: [main]
    # Draft PRs green-stub the heavy/required jobs (see `detect.skip`); marking a
    # PR ready (ready_for_review) runs them for real, and converting back to
    # draft (converted_to_draft) lets concurrency cancel an in-flight real run.
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  # Run the real required checks on merge-queue candidates too (forward-safe: if
  # a merge queue is enabled later these required checks must still report). The
  # build job never logs in or publishes from a merge-queue run — see its
  # publish allowlist.
  merge_group:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # detect — compute whether this PR needs heavy validation (`skip`).
  #
  # The four required status checks live in THIS workflow. It used to be
  # `paths-ignore`-gated and was therefore absent on docs-only PRs, leaving each
  # required check stuck at "Expected — Waiting" and blocking the merge. The
  # workflow now triggers on every PR; this job emits a single `skip` boolean so
  # the required jobs green-stub when the PR needs no heavy validation and run
  # for real otherwise.
  #
  # skip = docs-only OR draft:
  #  - docs-only: EVERY changed file is a docs path. dorny's
  #    `predicate-quantifier: every` makes the inverse `code` filter match a file
  #    iff it is a NON-docs file; `code == 'true'` ⇔ ≥1 code file ⇔ {code OR
  #    mixed} (real checks). A pure-docs PR matches no code file → `code` is
  #    'false' → docs-only.
  #  - draft: a draft PR is unmergeable by GitHub, so green-stubbing its required
  #    checks is safe; marking it ready (ready_for_review) re-runs them for real.
  #    This keeps noisy draft iteration off the expensive e2e/build path — the
  #    dominant CI cost on this repo.
  # On push/tag/dispatch/merge_group the dorny step is skipped, draft is N/A, and
  # `skip` defaults to false (real run).
  #
  # No checkout: dorny reads the PR's changed files from the REST API (needs
  # `pull-requests: read`). Fast (~5s), no services.
  # ---------------------------------------------------------------------------
  detect:
    name: Detect skip — docs-only or draft (build-image)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # skip the heavy/required jobs when the PR is docs-only OR a draft. Draft
      # is N/A on push/merge_group (github.event.pull_request is null -> false).
      skip: ${{ github.event_name == 'pull_request' && (github.event.pull_request.draft == true || steps.filter.outputs.code != 'true') }}
    steps:
      - id: filter
        if: ${{ github.event_name == 'pull_request' }}
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          predicate-quantifier: 'every'
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!**/*.md'
              - '!AGENTS.md'
              - '!CLAUDE.md'

  # ---------------------------------------------------------------------------
  # actions-pin-gate — supply-chain recurrence guard (FORMAT ONLY).
  #
  # Fails CI if any remote `uses:` ref in `.github/workflows/**` is not pinned
  # to a 40-char commit SHA carrying a `# vX.Y.Z` comment. It does NOT assert
  # SHA<->tag correctness (a local static parser can't resolve a SHA to its
  # upstream tag) — that is verified at authoring time against each upstream
  # repo, and Dependabot's grouped `github-actions` updater keeps the pins
  # fresh. Pure-node + `node:test`, so it needs NO `pnpm install` — a minimal,
  # lean surface, which is the point for a supply-chain job.
  #
  # Non-required, docs-only-skip (mirrors the other non-required jobs). Declares
  # its OWN `contents: read` permissions so it never inherits the workflow's
  # top-level `packages: write`: a write token has no business in a read-only
  # static audit during a supply-chain-hardening change.
  # ---------------------------------------------------------------------------
  actions-pin-gate:
    name: Actions SHA-pin gate
    needs: detect
    if: ${{ needs.detect.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Pin-format gate
        run: node scripts/audit/actions-pinned-gate.mjs

      - name: Parser tests
        run: node --test scripts/audit/__tests__/actions-pinned-gate.test.mjs

  # PR gate for typecheck + unit tests.
  # `pnpm test` excludes integration tests via vitest.config.ts; the
  # packages/agents integration tier runs in the dedicated
  # `agents-integration-db` job below (Postgres + Redis service containers),
  # NOT as a step here — see that job's header for why (cinatra#2226).
  test:
    name: Typecheck and unit tests
    # This job is the SOLE full TypeScript gate now that the CI `next build`s skip
    # their in-build tsc (next.config `ignoreBuildErrors` is CI-only; the
    # `next typegen` step below regenerates .next/types so the typecheck covers
    # generated route/validator types — tsconfig includes .next/types). Enforced
    # STRUCTURALLY, not via branch protection: the `build` job (image build +
    # publish) declares `needs: [detect, test]` AND runs a "Guard prerequisite
    # gates" step that HARD-FAILS (exit 1) the build if `test` did not succeed.
    # (We can't rely on a bare skip — GitHub can count a skipped required check as
    # successful — so the build runs `if: always()` and the guard turns a failed
    # `test` into a definitive RED build, never a passing skip.) A green
    # "Build and publish image" result therefore provably implies a green `test`.
    # The two e2e jobs intentionally run independently (`if: always()`, decoupled
    # from publish cadence); they validate RUNTIME, so a type error there either
    # breaks runtime (e2e fails) or is caught here (and the build guard fails).
    # The merge gate is the build result. `needs: detect` is mandatory — without it
    # the `skip` expression has no value and the gate silently no-ops.
    needs: detect
    if: ${{ needs.detect.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Clone companion extension repos
        uses: ./.github/actions/clone-extensions

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Generate Next's route types (.next/types/routes.d.ts) so the typecheck
      # below covers them. next.config skips the in-build tsc in CI
      # (ignoreBuildErrors), so this REQUIRED job is now the sole gate for
      # generated route types (tsconfig includes .next/types). typegen loads
      # next.config, which requires these placeholder env vars at module-eval.
      - name: Generate route types (next typegen)
        env:
          SUPABASE_DB_URL: postgresql://build:build@127.0.0.1:5432/build
          OPENAI_API_KEY: build-only-placeholder-not-used-at-runtime
        run: pnpm exec next typegen

      - name: Typecheck
        run: pnpm typecheck

      # Default vitest run; vitest.config.ts excludes *.integration.test.ts
      # from this run. The integration tier has its own job below.
      - name: Unit tests (packages/agents)
        run: cd packages/agents && pnpm test

  # Full packages/skills unit suite (#1359). Runs in its OWN top-level job —
  # NOT appended to `test` — for the same reason as rbac-authz-unit / auth-
  # schema-drift: the shared `test` job has a well-known packages/agents
  # baseline that would skip any step added after it. packages/skills is not in
  # the root `src/` vitest include, so before this job only a hand-pinned 2-file
  # slice ran in CI (formerly in the Better Auth schema parity job); the rest of
  # the suite had no runner, so #1174's 15-test repair regressed within 48h
  # (#1306) undetected. This job runs the ENTIRE suite (`pnpm test` = vitest run;
  # the live golden-eval tests self-skip without OPENAI_API_KEY) and is made a
  # REQUIRED gate STRUCTURALLY: the `build` job `needs` it and its "Guard
  # prerequisite gates" step hard-fails the (branch-protection-required) `build`
  # if this job did not succeed — the exact mechanism that makes `test`
  # required, so no branch-protection contexts change is needed. The suite is
  # self-contained (mocks DB/LLM; imports only in-repo workspace source), so no
  # companion-extension clone is required.
  skills-unit:
    name: Skills unit tests
    needs: detect
    if: ${{ needs.detect.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Skills unit tests (full packages/skills suite)
        run: cd packages/skills && pnpm test

  # Full packages/a2a unit suite (cinatra#2226). Byte-for-byte the skills-unit
  # shape above, and for the identical reason: packages/a2a is absent from the
  # root `vitest.config.ts` include set AND from every workflow, so its 28 files
  # / 193 tests passed locally and ran NOWHERE in CI. Anything pinned only there
  # was unpinned as a merge gate — which is why the #2202 fix had to add a
  # duplicate structural pin over in packages/agents just to get CI coverage.
  # This job retires that workaround's reason to exist.
  #
  # REQUIRED STRUCTURALLY, not via branch protection: the `build` job `needs` it
  # and its "Guard prerequisite gates" step hard-fails the
  # (branch-protection-required) `build` if this job did not succeed — the exact
  # mechanism behind `test` / `skills-unit`, so NO branch-protection contexts
  # change is needed and this job's own context stays non-required.
  #
  # Self-contained: packages/a2a/vitest.config.ts stubs @cinatra-ai/agents and
  # @cinatra-ai/llm and resolves @a2a-js/sdk from its own node_modules, so a bare
  # `pnpm install --frozen-lockfile` suffices — no companion-extension clone, no
  # DB, no Redis. Measured suite runtime: ~2s (the job is dominated by
  # checkout+install, ~1-2 min).
  a2a-unit:
    name: A2A protocol unit tests
    needs: detect
    if: ${{ needs.detect.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: A2A unit tests (full packages/a2a suite)
        run: cd packages/a2a && pnpm test

  # Full packages/execution-plane UNIT suite (cinatra#2316). Third instance of
  # the skills-unit / a2a-unit shape, and for the third time the identical
  # reason: the package declares its own runners (`test` and `test:e2e`), the
  # root `vitest.config.ts` enumerates workspace tiers glob-by-glob and has no
  # `packages/execution-plane` entry, and NO workflow invoked either script — so
  # 36 unit files and 5 real-Docker batteries executed on no PR at all. The
  # repo-wide typecheck still covered the sources, so a TYPE error in a plane
  # test reded CI while a FAILING ASSERTION did not; that distinction was the
  # whole gap. Several of those unit files are the sole evidence behind AC
  # verdicts in the #1705 acceptance audit (broker quotas and queue ceilings,
  # voucher boundary, egress clamp, audit spool, lease, mTLS, environment
  # recipe/builder/cache, idle-job reaper).
  #
  # This job owns the UNIT half. The real-Docker half (the batteries) runs in
  # `.github/workflows/execution-plane-e2e.yml` — path-gated on PRs, plus every
  # main push, plus a nightly floor, with EVERY battery on every one of those
  # triggers (measured: the whole tier is ~7 minutes wall clock, so none of it
  # needed a cheaper cadence). See that file's header for the per-battery
  # figures.
  #
  # REQUIRED STRUCTURALLY, not via branch protection: the `build` job `needs` it
  # and its "Guard prerequisite gates" step hard-fails the
  # (branch-protection-required) `build` if this job did not succeed — the exact
  # mechanism behind `test` / `skills-unit` / `a2a-unit`, so NO branch-protection
  # contexts change is needed and this job's own context stays non-required.
  #
  # The tier-coverage guard after the run is not ceremony. The failure this
  # issue fixed is a runner that proves nothing, and a `vitest run` whose
  # include matches nothing exits GREEN. The guard reads Vitest's own JSON
  # report and reds unless every file matching the tier contract actually
  # executed — so this job cannot regress into the silent no-op it replaces.
  #
  # Self-contained: packages/execution-plane depends only on workspace siblings
  # (@cinatra-ai/llm, @cinatra-ai/sdk-extensions), never on an extension, so a
  # bare `pnpm install --frozen-lockfile` suffices — no companion-extension
  # clone, no DB, no Redis, no docker. Measured suite runtime: ~3s (the job is
  # dominated by checkout+install, ~1-2 min).
  execution-plane-unit:
    name: Execution-plane unit tests
    needs: detect
    if: ${{ needs.detect.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The package's own `test` script (vitest.config.ts), which excludes the
      # real-Docker e2e directory — that tier has its own workflow.
      - name: Execution-plane unit tests (full packages/execution-plane suite)
        run: |
          pnpm --filter @cinatra-ai/execution-plane run test \
            --reporter=default --reporter=json \
            --outputFile.json="${{ github.workspace }}/execution-plane-unit-report.json"

      # Runs on a red suite too — the duration table is most useful when
      # something failed, and the coverage verdict must not depend on the run
      # having been green.
      - name: Tier-coverage guard + duration table
        if: ${{ always() }}
        run: |
          node scripts/ci/vitest-tier-coverage.mjs \
            --report "${{ github.workspace }}/execution-plane-unit-report.json" \
            --package-dir packages/execution-plane \
            --expect 'src/**/__tests__/**/*.test.ts' \
            --exclude 'src/__tests__/e2e/**/*.test.ts' \
            --title 'Execution-plane unit tier' \
            --summary "$GITHUB_STEP_SUMMARY"

  # RBAC authz unit tests — runs the whole `src/lib/authz` suite (20 files /
  # 160 tests), including the resolver matrix used by the e2e job as the
  # primary CI proof of resolver correctness. Lives in its own job (not
  # appended to `test`) because that job fails on the current packages/agents
  # baseline, which would skip any step added after it.
  #
  # The root `src/` vitest suite is otherwise not run by `test`, so this is
  # the only CI gate enforcing authz unit correctness today.
  #
  # Excludes `build-actor-context-from-run.test.ts`: it holds 5 placeholder
  # tests deliberately RED until run.orgId is wired to actor.organizationId.
  # Drop the --exclude once those tests should gate CI.
  #
  # REQUIRED status check on `main`. Always runs (`if: always()`) so the check
  # always reports; the `detect` guard fails it RED if detection broke; a
  # docs-only PR green-stubs in seconds.
  rbac-authz-unit:
    name: RBAC authz unit tests
    needs: detect
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Guard — detect must have succeeded
        if: ${{ needs.detect.result != 'success' }}
        run: |
          echo "::error::detect job did not succeed (result=${{ needs.detect.result }}); failing this required check rather than passing it silently."
          exit 1

      - name: Docs-only stub
        if: ${{ needs.detect.outputs.skip == 'true' }}
        run: echo "Docs-only or draft PR — reporting RBAC authz unit tests as a green stub (the real suite runs on code/mixed PRs)."

      - if: ${{ needs.detect.outputs.skip != 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        if: ${{ needs.detect.outputs.skip != 'true' }}
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        if: ${{ needs.detect.outputs.skip != 'true' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Clone companion extension repos
        if: ${{ needs.detect.outputs.skip != 'true' }}
        uses: ./.github/actions/clone-extensions

      - name: Install dependencies
        if: ${{ needs.detect.outputs.skip != 'true' }}
        run: pnpm install --frozen-lockfile

      - name: RBAC authz unit tests (incl. resolver matrix)
        if: ${{ needs.detect.outputs.skip != 'true' }}
        run: pnpm exec vitest run src/lib/authz --exclude '**/build-actor-context-from-run.test.ts'

  # Hotfix recurrence guard. The `context-selection-agent` OAS declares
  # `resolve_context.outputs = {candidates, slotMeta, selectedRefs,
  # selectionMode, resolutionMode}`; the select_mode BranchingNode routes on
  # top-level `selectionMode` and finalize_* DFE-bind both fields. A
  # route-vs-OAS contract drift (the route was returning only the
  # first three) was not caught by the main `test` job because root `src/`
  # vitest is otherwise not gated. This dedicated job pins the route's
  # response contract going forward.
  context-resolve-route-shape:
    name: context-resolve route response shape
    needs: detect
    if: ${{ needs.detect.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Clone companion extension repos
        uses: ./.github/actions/clone-extensions

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: /api/context-resolve response-shape regression
        run: pnpm exec vitest run src/app/api/context-resolve/__tests__/response-shape.test.ts --no-coverage

  # Better Auth schema drift guard. Both `src/lib/auth.ts` (runtime)
  # and `scripts/better-auth-migrate.mts` (bootstrap migration `make setup`
  # runs) consume the same shared plugin factory at
  # `src/lib/better-auth-plugins.ts`. This job gates PRs on:
  #   1. `pnpm typecheck` — pins the precise mutable-tuple annotation on
  #      `authPlugins` inside src/lib/auth.ts so any plugin pushed outside
  #      the shared factory fails typecheck.
  #   2. The root vitest drift test — deep-equals the Better Auth schema
  #      both sides produce (runtime ↔ migration parity).
  #   3. The packages/mcp-server pure builder test — covers the pure
  #      `buildMcpAuthPlugins` module (not gated by any other job).
  #   4. A native Node smoke that imports `scripts/better-auth-migrate.mts`
  #      via plain Node strip-types — catches the resolution failure modes
  #      Vitest's bundler hides (package-exports `.ts` resolution, missing
  #      explicit `.ts` extension on relative imports).
  # Lives in its own top-level job (not appended to `test`) so the gate
  # actually runs on every PR — the shared `test` job has a well-known
  # baseline failure that would skip any subsequent step.
  auth-schema-drift:
    name: Better Auth schema parity
    needs: detect
    if: ${{ needs.detect.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Clone companion extension repos
        uses: ./.github/actions/clone-extensions

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (pins runtime plugin-tuple shape)
        run: pnpm typecheck

      - name: Schema parity test (runtime ↔ migration)
        run: pnpm exec vitest run src/lib/__tests__/better-auth-schema.test.ts

      - name: MCP auth-plugins pure builder test
        run: cd packages/mcp-server && pnpm exec vitest run src/__tests__/auth-plugins.test.ts

      # NOTE: the two pinned packages/skills contract tests that previously ran
      # here (Extension skill resolver + Skills delete-redirect action) are now
      # SUBSUMED by the full packages/skills suite, which runs as its own
      # required `skills-unit` job (gated structurally via the `build`
      # prerequisite guard). Pinning a 2-file slice let the rest of the suite
      # regress uncaught (#1174 repaired 15 tests; #1306 re-broke them within
      # 48h). See #1359.

      - name: Native Node smoke (migration loads via plain Node strip-types)
        run: |
          node -e "import('./scripts/better-auth-migrate.mts').then(m => { const opts = m.buildMigrationAuthOptions(); const ids = opts.plugins.map(p => p.id); const expected = ['username','two-factor','admin','organization','jwt','oauth-provider']; if (JSON.stringify(ids) !== JSON.stringify(expected)) { console.error('migration plugin ids mismatch:', ids, '!=', expected); process.exit(1); } console.log('migration plugins OK:', ids.join(',')); }).catch(e => { console.error('FAIL:', e); process.exit(1); })"

  # Core-store schema migration gate. The first-party core store schema is
  # hand-mirrored DDL (`buildCreateStoreSchemaQueries` + the Drizzle table
  # defs in src/lib/drizzle-store.ts) applied by an idempotent bootstrap — so
  # a DESTRUCTIVE schema change (drop/rename/retype/NOT NULL/unique index on
  # existing tables, data rewrites) silently strands deployed user data unless
  # the PR ships the migration artifact migrations/README.md requires (a
  # runner migration module migrations/core/core__NNNN_*.mjs + its manifest
  # entry `file: "core/core__NNNN_…"`, in the same PR; the legacy loose-SQL
  # form is rejected for new migrations).
  # The gate diffs the PR against its base, classifies in-scope schema changes
  # per that convention, and fails ONLY when a user-land-affecting change
  # ships no artifact. Better Auth schema (guarded by auth-schema-drift above)
  # and extension-owned DDL are out of scope and ignored.
  # The companion test replays the gate over the labelled fixture corpus at
  # scripts/audit/__fixtures__/schema-migration/ — the executable form of the
  # convention — and fails on any misclassification.
  # Pure node + node:test (like actions-pin-gate): no pnpm install needed.
  # fetch-depth 0 so the merge-base diff against the PR base resolves.
  schema-migration-gate:
    name: Core-store schema migration gate
    needs: detect
    # REQUIRED status check on `main`. Run even when `detect` FAILED, so the
    # guard step below reports a definitive job FAILURE instead of a SKIP —
    # GitHub counts a skipped required check as satisfied, so a failed `detect`
    # merely *skipping* this job would NOT block a merge (same hole the `build`
    # job closes with this exact pattern). Docs-only and draft PRs (detect
    # succeeded + skip) still skip this job — the documented skip-as-success
    # path is unchanged.
    if: ${{ always() && (needs.detect.result != 'success' || needs.detect.outputs.skip != 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # Hard-fail (definitive RED, never a non-failing "skip") when detect did
      # not pass. No-ops on the success path; its failure short-circuits every
      # later step, so they need no per-step guards.
      - name: Guard — detect must have succeeded
        if: ${{ needs.detect.result != 'success' }}
        run: |
          echo "::error::detect job did not succeed (result=${{ needs.detect.result }}); failing this required check rather than passing it silently."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the merge-base diff can resolve origin/<pr.base.ref>.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Compute diff base
        id: base
        # PRs → origin/<pr.base.ref>. Pushes → previous-tip (github.event.before)
        # so a push to main still diffs only what the push changed. Same shape as
        # the ratchet gates' base resolution; falls back to HEAD (self-compare,
        # empty diff) when the ref cannot resolve rather than failing closed on
        # infrastructure.
        run: |
          if [ -n "${{ github.event.pull_request.base.ref }}" ]; then
            base="origin/${{ github.event.pull_request.base.ref }}"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            base="${{ github.event.before }}"
          else
            base="origin/main"
          fi
          if [ -n "$base" ] && ! git rev-parse --verify --quiet "${base}^{commit}" >/dev/null 2>&1; then
            head="$(git rev-parse --verify --quiet HEAD || true)"
            if [ -z "$head" ]; then
              echo "::error::diff base '${base}' did not resolve AND HEAD did not resolve — cannot anchor the schema-migration gate."
              exit 1
            fi
            echo "::notice::diff base '${base}' did not resolve — using HEAD so the gate self-compares (empty diff)"
            base="$head"
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: Schema migration gate (destructive DDL needs a migration artifact)
        env:
          SCHEMA_MIGRATION_BASE: ${{ steps.base.outputs.base }}
        run: node scripts/audit/schema-migration-gate.mjs

      - name: Gate classifier tests (labelled fixture corpus + unit edges)
        run: node --test scripts/audit/__tests__/schema-migration-gate.test.mjs

  extension-lifecycle-db-tests:
    name: Extension-anchor lifecycle DB tests
    needs: detect
    if: ${{ needs.detect.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Clone companion extension repos
        uses: ./.github/actions/clone-extensions

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Provision Better Auth tables (public schema)
        # The cinatra-schema DDL the suites apply carries cross-schema FKs to
        # `public.user` (Better-Auth-owned) — same pattern as the e2e jobs.
        run: node scripts/apply-public-schema.mjs

      - name: Lifecycle DB tests (demotion migration + fresh-prod seeding)
        env:
          CINATRA_DB_INTEGRATION_TESTS: '1'
        run: pnpm exec vitest run src/lib/__tests__/integration/demote-optional-extension-anchors.test.ts

      # cinatra#2091 (epic #2086 S4). The injection contract's drop ledger lives
      # entirely in two upserts' ON CONFLICT clauses (a delivery supersedes a
      # drop; a drop never erases a delivery; neither resets invocation_count),
      # so a mock proves nothing — this runs the real SQL against the real store
      # DDL on the service Postgres already provisioned for this job.
      - name: Skill-injection drop-ledger DB test (cinatra#2091)
        env:
          CINATRA_DB_INTEGRATION_TESTS: '1'
        run: pnpm exec vitest run src/lib/__tests__/integration/skill-injection-drop-ledger.integration.test.ts

      # cinatra#2415. The compensation invariant is a claim about WHICH
      # `installed_extension` rows survive a failed batch — the rows the batch
      # created must be gone, and every pre-existing row (the same package in
      # the SAME org, and every OTHER org's row — the #2410 boundary) must be
      # byte-identical. A mock cannot prove that, so this drives the real saga,
      # a real canonical insert per member, the real durable ledger, and the
      # real row-scoped inverse against this job's service Postgres. Own vitest
      # invocation (own process) so its SUPABASE_DB_URL/pool lifecycle never
      # touches the steps above.
      - name: Batch-compensation scope DB test (cinatra#2415)
        env:
          CINATRA_DB_INTEGRATION_TESTS: '1'
        run: pnpm exec vitest run src/lib/__tests__/integration/install-batch-compensation-scope.integration.test.ts

      # cinatra#2536. The instance-level heal is a claim about ROWS: a boot pass
      # against a DB where the blog packages LOADED but their
      # `installed_extension` rows are ABSENT must end with a live install row
      # AND an active `artifact_type_claims` row, the materializer's own
      # resolution seam must then resolve the binding, and a SECOND pass must
      # change nothing (the claim registry's partial-unique one-live-claimant
      # indexes would reject a non-idempotent re-activation). A mock proves none
      # of that, so this drives the real manifest on disk, the real lifecycle
      # primitive, the real claim DDL + activation hook and the real bound-type
      # resolver against this job's service Postgres. Own vitest invocation (own
      # process) so its SUPABASE_DB_URL/pool lifecycle never touches the steps
      # above.
      - name: Blog-pipeline install-record heal DB test (cinatra#2536)
        env:
          CINATRA_DB_INTEGRATION_TESTS: '1'
        run: pnpm exec vitest run src/lib/__tests__/integration/blog-pipeline-install-record-heal.integration.test.ts

      # cinatra#2092 (epic #2086 S5). The upload-on-install CRASH WINDOW is a
      # claim about what survives in Postgres between COMMIT and the worker run,
      # so a mock cannot prove it: this drives the REAL catalog-transaction tail
      # (derived `allowAnthropicUpload` projection + the transactional
      # reconcile-request row), then shows the request is still pending and
      # claimable after a simulated crash, that a ROLLBACK leaves no phantom
      # request, and that the uninstall's delayed GC row is due only at
      # grace-window expiry. Own vitest invocation (own process) so its
      # SUPABASE_DB_URL/pool lifecycle never touches the steps above.
      - name: Upload-on-install outbox + consent projection DB test (cinatra#2092)
        env:
          CINATRA_DB_INTEGRATION_TESTS: '1'
        run: pnpm exec vitest run src/lib/__tests__/integration/anthropic-skill-upload-outbox.integration.test.ts

      # cinatra#1988 — the shared dashboards session→actor builder must thread
      # `teamRoles` end-to-end. Real-store regression: seeds team memberships in
      # a lane-unique DB and drives buildDashboardActorFromSession → the real
      # adapter → the real resolver, proving a team admin reads an owners/private
      # team-owned dashboard and a plain member does not. Own vitest invocation
      # (own process) so its SUPABASE_DB_URL/pool lifecycle never touches the
      # step above.
      - name: Dashboards actor team-roles regression (cinatra#1988)
        env:
          CINATRA_DB_INTEGRATION_TESTS: '1'
        run: pnpm exec vitest run src/lib/dashboards/__tests__/integration/dashboard-actor-team-roles.integration.test.ts

      # cinatra#1943 (archive adversarial acceptance suite, tier A0 / PR
      # #2207). The file's own header comment already claimed it runs in
      # THIS job — it didn't; grep over .github/workflows/ found no step
      # invoking it. That gap silently held back several of #1943's
      # coverage-completeness manifest rows (ticket replay,
      # delete-vs-completion, platform-admin denial, bounded-contention, and
      # the already-landed #1939 two-connection race the manifest points at
      # rather than re-authoring) from ever reaching a green, CI-verified
      # state. This step closes it, using the SAME
      # CINATRA_DB_INTEGRATION_TESTS=1 + SUPABASE_DB_URL (job-level env
      # above) pattern as every other step in this job.
      #
      # Guarded on the file's existence: #2207 (which adds this test file)
      # may not be merged yet. `hashFiles` returns '' when the path matches
      # nothing, so this step — and its stub below — degrade gracefully:
      # green no-op before #2207 merges, the real suite the moment it does,
      # with no follow-up PR required to "turn it on".
      - name: Archive-race adversarial acceptance integration tests (cinatra#1943)
        if: ${{ hashFiles('src/lib/__tests__/integration/org-write-archive-race.integration.test.ts') != '' }}
        env:
          CINATRA_DB_INTEGRATION_TESTS: '1'
        run: pnpm exec vitest run src/lib/__tests__/integration/org-write-archive-race.integration.test.ts

      - name: Archive-race adversarial acceptance tests — not yet landed (cinatra#1943)
        if: ${{ hashFiles('src/lib/__tests__/integration/org-write-archive-race.integration.test.ts') == '' }}
        run: echo "src/lib/__tests__/integration/org-write-archive-race.integration.test.ts not present yet (cinatra#2207 not merged) — reporting this CI-wiring step as a deliberate green no-op stub until it lands; see cinatra#1943."

      # cinatra#1705 AC9. The strongest evidence for the lifecycle AC — that a
      # REQUIRED-pin run mounts its own snapshot's recipe rather than live drift,
      # refuses on a purged snapshot, refuses a cross-template snapshot and stays
      # L0 when the snapshot declares nothing — lives in this real-store suite,
      # and the acceptance audit found it ran in NO CI-invoked pattern: it is an
      # `*.integration.test.ts`, config-excluded from the default vitest run, and
      # no workflow named it. So the pinned-snapshot contract could regress
      # without reddening a single check. This step closes that, using the same
      # CINATRA_DB_INTEGRATION_TESTS=1 + job-level SUPABASE_DB_URL pattern as
      # every other step in this job. Own vitest invocation (own process) so its
      # pool lifecycle never touches the steps above.
      - name: Provision a store schema for the run-seam suite (cinatra#1705 AC9)
        # Its OWN schema, provisioned with the canonical bootstrap DDL. The
        # suite drives the REAL @cinatra-ai/agents version store, so unlike
        # every step above it needs the cinatra store baseline and not just the
        # Better Auth `public` tables — and a dedicated schema keeps its writes
        # away from the suites that share this job's database.
        env:
          SUPABASE_SCHEMA: cinatra_exec_run_seam
        run: node --import tsx scripts/ci/apply-store-schema.mjs

      - name: Execution run-seam declared-environment integration tests (cinatra#1705 AC9)
        env:
          CINATRA_DB_INTEGRATION_TESTS: '1'
          SUPABASE_SCHEMA: cinatra_exec_run_seam
        run: pnpm exec vitest run src/lib/execution/__tests__/run-seam-declared-environment.integration.test.ts

  # packages/agents INTEGRATION tier (cinatra#2226). Replaces the dead step that
  # used to live at the end of the `test` job:
  #
  #     - name: Integration tests (packages/agents)
  #       if: env.CINATRA_TEST_DB_URL != ''
  #       env:
  #         CINATRA_TEST_DB_URL: <the repo secret of the same name>
  #
  # (That last line is PARAPHRASED on purpose. secrets-required-gate scans this
  # file for `secrets.<NAME>` tokens WITHOUT skipping comments, so writing the
  # real `${{ secrets.… }}` expression here — even quoted inside a comment —
  # makes the gate believe the workflow still consumes a secret that
  # .github/secrets-required.txt has retired, and it fails CLOSED. Do not
  # "restore" the literal.)
  #
  # A step-level `if:` is evaluated BEFORE that step's own `env:` block is
  # applied, so `env.CINATRA_TEST_DB_URL` was always the empty string and the
  # tier skipped on EVERY run since the step was written — including any run
  # where the secret WAS populated. The fix is the repo's existing working
  # pattern for a DB-backed suite (`extension-lifecycle-db-tests`, directly
  # above): a dedicated job with SERVICE CONTAINERS and JOB-LEVEL `env`, which
  # every step sees unconditionally, so there is no guard left to misfire.
  #
  # THE GUARD WAS ONLY THE OUTER LAYER. Even with the URL delivered, the tier
  # still self-skipped: `packages/agents/vitest.integration.config.ts` forwards
  # CINATRA_TEST_DB_URL → SUPABASE_DB_URL, but ESM hoists its
  # `import baseConfig from "./vitest.config"` ABOVE that assignment, so the base
  # config captured its `postgres://unused:unused@localhost:5432/unused`
  # placeholder and vitest injected THAT into every worker. Measured on this
  # branch before the config fix: 21 of 277 tests ran (22 of 31 files self-skipped
  # on the placeholder, the rest hit ECONNREFUSED :5432). After the fix, with
  # ONLY CINATRA_TEST_DB_URL set: 0 skipped, all 31 files execute. Both halves
  # were required to make this job non-vacuous.
  #
  # PROVISIONING. The suites expect the baseline a dev checkout gets from
  # `cinatra setup branch`; a bare `vitest run` boots no app, so nothing would
  # create it. Two steps do it explicitly, in production boot order: the Better
  # Auth `public` tables first (the store DDL FKs into them), then the canonical
  # store bootstrap DDL. Both scripts are idempotent and fail closed.
  #
  # NOT a `build` prerequisite — deliberately, and consistent with the sibling
  # `extension-lifecycle-db-tests` job, which is likewise standalone: this is a
  # NEW check context, kept NON-REQUIRED. No branch-protection change is made or
  # implied by this PR.
  #
  # KNOWN-RED CARVE-OUT (`--exclude` below). With a real DB the tier runs 31
  # files / 277 tests and 44 of them fail — pre-existing rot in 8 files that no
  # CI job has ever executed, NOT a consequence of this wiring, and each
  # reproducible in isolation on a clean DB:
  #   * trigger-handlers / trigger-gate / trigger-schedule — the shared
  #     `ensureParentRun` helper inserts an `agent_runs` row whose `templateId`
  #     is a fresh `tmpl-<uuid>` that is never inserted into `agent_templates`,
  #     so every case violates `agent_runs_template_id_fkey` (an FK added after
  #     these suites were written; the sibling trigger-store suite, which DOES
  #     create the template, passes).
  #   * extension-handler — `vi.mock("@cinatra-ai/registries")` factory is
  #     missing `vendorScopeOfPackage`, which the source now imports.
  #   * trigger-gate-integration — `vi.mock("../wayflow-url")` factory is missing
  #     `describeWayflowDispatchError` + `WAYFLOW_UNDICI_TIMEOUT_MS`.
  #   * lifecycle-repair-dispatch (1/7) + lifecycle-repair-successor-batch (5/7)
  #     — assertion drift against the org-write-kernel refusal path.
  #   * store-auth-policy (1/22) — one AuthzError-shape assertion drift.
  # Repairing them is test-health work with per-file causes, out of scope for a
  # CI-wiring PR; carving them out is what lets the OTHER 23 files gate for real
  # instead of the whole tier staying invisible. Same convention as
  # `rbac-authz-unit`'s deliberate `--exclude` and vitest.config.ts's documented
  # carve-outs: every entry names its reason, and shrinking this list is a
  # follow-up, not a silent drift.
  #
  # The carve-out does NOT hide the debt: step (2) below runs the WHOLE tier
  # (all 31 files, no exclude) informationally on every run, so the 8 red files
  # are named in the log each time — a green job here can never mean "the tier
  # is fine", only "the gated set did not regress".
  #
  # RUNTIME ADDED TO CI (measured in CI on this branch, plus locally on a fresh
  # postgres:18 + redis:8): gated step ~52 s, informational whole-tier step ~68 s,
  # two DDL provisioning passes ~2 s each in CI. The whole job measured 3.0 min in
  # CI before the serialisation flag and lands around 4-5 min with it — compare the
  # sibling `extension-lifecycle-db-tests` DB job at 1.8 min. It is a NEW PARALLEL
  # job and deliberately NOT a `build` prerequisite, so it adds nothing to the
  # critical path of the required gate. The sibling `a2a-unit` job measured 0.5 min
  # in CI (its suite is ~2 s; the job is checkout+install-dominated).
  agents-integration-db:
    # The name says GATED SET, not "the integration tier", on purpose: a green
    # result here means "the 23-file gated set did not regress", never "all 31
    # files pass". The full-tier report is the informational step (2).
    name: Agents integration — gated set (+ full-tier report)
    needs: detect
    if: ${{ needs.detect.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    # JOB-LEVEL env — the whole point of this job's shape. Every step sees these
    # unconditionally, so no `if:` can read an unset value. SUPABASE_DB_URL is
    # what the provisioning scripts read; CINATRA_TEST_DB_URL is what
    # vitest.integration.config.ts reads (and hard-throws on if absent, so a
    # broken wiring change here fails loudly instead of skipping quietly).
    env:
      SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      CINATRA_TEST_DB_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      SUPABASE_SCHEMA: cinatra
      REDIS_URL: redis://127.0.0.1:6379
      # cinatra#2675 — the registry half of the AC1 preflight proof (see the
      # "Start a disposable Verdaccio" step below for the container itself and
      # why it is not a native `services:` entry above it). REQUIRED=1 turns a
      # missing prerequisite (this OR the database) into a hard failure instead
      # of the suite's default loud-but-passing skip — standing up this lane is
      # the whole point of giving it something to require (PR #2678's recorded
      # residual).
      CINATRA_TEST_VERDACCIO_URL: http://127.0.0.1:4873
      CINATRA_TEST_VERDACCIO_REQUIRED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # cinatra#2675 AC1 — the one suite that can prove a colliding publish
      # refuses BEFORE it reaches the registry
      # (agent-source-publish-claim-preflight.integration.test.ts) self-skips
      # (loudly) unless CINATRA_TEST_VERDACCIO_URL is set. PR #2678 shipped
      # that suite and recorded standing up this lane as the owed follow-up
      # rather than mix a CI-wiring change into a PR that also changes
      # application code (protected-path hygiene) — this is that follow-up.
      #
      # A plain `docker run`, NOT this job's native `services:` block above:
      # GitHub starts service containers before the job's first STEP (the
      # checkout above), so a `services:`-declared container cannot bind-mount
      # a file this repo ships — it is not yet on disk when that mount would
      # happen. Running the container from a step, after checkout, sidesteps
      # that entirely; scripts/ci/works-after/verdaccio.sh already uses this
      # exact shape for the same reason (see its header comment). Nothing is
      # host- or repo-mounted at /verdaccio/storage, so Docker gives it the
      # image's declared VOLUME as a fresh ANONYMOUS volume scoped to this one
      # container — it starts empty every run, and the "Stop the disposable
      # Verdaccio" cleanup step's `docker rm -v` removes that volume along
      # with the container, so nothing survives past the end of this job.
      #
      # The image ref is SCRAPED from docker-compose.yml's `verdaccio:`
      # service (mirrors works-after-proof.yml's `svc_image_str`) instead of
      # being re-pinned here as a second literal: one source of truth for the
      # digest, so Renovate's docker-compose manager (which already owns that
      # line, e.g. #2622) keeps this lane's version current for free. A
      # digest hand-pinned a second time inside a `run:` shell block would sit
      # outside every automated pin-freshness tool this repo has — Renovate's
      # compose manager only reads compose files, and Dependabot's
      # github-actions manager only reads `uses:` refs — so it would go stale
      # silently instead.
      #
      # docker/verdaccio/config.ci.yaml (mounted read-only below) is a
      # DIFFERENT config from the dev registry's docker/verdaccio/config.yaml:
      # no uplink, ephemeral container-scoped storage, and open (`$all`)
      # publish so the suite's static bearer token — never a real
      # Verdaccio-signed session — is enough to admit a publish. See that
      # file's header for the full reasoning.
      - name: Start a disposable Verdaccio (cinatra#2675 AC1 registry-refusal proof)
        run: |
          set -euo pipefail
          VERDACCIO_IMAGE="$(awk '
            $0 ~ "^  verdaccio:[[:space:]]*$" {found=1; next}
            found && /^  [a-zA-Z0-9_-]+:[[:space:]]*$/ {exit}
            found && $1=="image:" {print $2; exit}' "${GITHUB_WORKSPACE}/docker-compose.yml")"
          [ -n "$VERDACCIO_IMAGE" ] || { echo "::error::could not scrape the verdaccio image from docker-compose.yml"; exit 1; }
          echo "Starting disposable Verdaccio from ${VERDACCIO_IMAGE}"
          # Loopback-only publish (127.0.0.1, not every interface): this
          # registry grants `publish: $all` (see config.ci.yaml), so nothing
          # else should be able to reach it — hardening-only on a
          # single-tenant, ephemeral GitHub-hosted runner, but free and
          # matches scripts/ci/works-after/verdaccio.sh's identical `-p
          # 127.0.0.1::4873`.
          docker run -d --name agents-it-verdaccio -p 127.0.0.1:4873:4873 \
            -v "${GITHUB_WORKSPACE}/docker/verdaccio/config.ci.yaml:/verdaccio/conf/config.yaml:ro" \
            "$VERDACCIO_IMAGE" >/dev/null
          for i in $(seq 1 40); do
            if curl -fsS "${CINATRA_TEST_VERDACCIO_URL}/-/ping" >/dev/null 2>&1; then
              echo "verdaccio is up at ${CINATRA_TEST_VERDACCIO_URL} (attempt ${i}/40)"
              exit 0
            fi
            sleep 3
          done
          echo "::error::disposable verdaccio did not answer /-/ping within 120s"
          docker logs agents-it-verdaccio || true
          exit 1

      - name: Provision Better Auth tables (public schema)
        # FIRST — the store DDL below carries FKs to public."user" /
        # "organization" / "team" / "member". Same step, same reason, as the
        # extension-lifecycle-db-tests and e2e jobs.
        run: node scripts/apply-public-schema.mjs

      - name: Provision the cinatra store schema (bootstrap DDL)
        # The baseline `cinatra setup branch` gives a dev checkout. Needs tsx —
        # the canonical builder is TypeScript and imports `@/…`.
        run: node --import tsx scripts/ci/apply-store-schema.mjs

      - name: Provision a second store schema for the informational whole-tier pass
        # The two suite steps below get their OWN schema each. The suites write
        # real rows and several self-skip when a fixture they expect to create
        # already exists, so re-running the tier against a schema a previous
        # step already populated turns 7 real assertions into silent skips —
        # the exact vacuity class this job exists to remove. One schema per
        # pass keeps BOTH runs pristine and their numbers comparable.
        env:
          SUPABASE_SCHEMA: cinatra_full_tier
        run: node --import tsx scripts/ci/apply-store-schema.mjs

      # (1) THE BLOCKING SIGNAL — the gated set. `--exclude` entries are the
      # documented known-red carve-out in this job's header; do not add one
      # without a reason there. A regression in any of these 23 files reds this
      # job, which is the coverage this issue exists to create.
      #
      # `--no-file-parallelism` IS LOAD-BEARING, not a performance knob. These
      # suites were written for a per-developer schema, and several of them apply
      # the store bootstrap DDL in their own `beforeAll`. Run concurrently against
      # ONE schema, two forks take `AccessExclusiveLock` on the same shared
      # `public` objects and Postgres kills one with `40P01 deadlock detected` —
      # observed exactly once in CI on this branch (run 30507842403,
      # lifecycle-interceptions-s0), which would have made this gate a flaky one.
      # Serialising the FILES removes the concurrency that causes it. Per-file
      # process isolation is UNAFFECTED: the base config's `pool: "forks"` +
      # vitest's default `isolate: true` still give every file a fresh child
      # process (the module-cache pollution that config warns about needs a
      # SHARED fork, which this flag does not create) — verified by three green
      # serialised runs, and by the whole-tier step below reproducing its recorded
      # failure baseline exactly. Cost is small: 52 s serialised, and the CI
      # parallel run measured 52 s too, since the DB is the bottleneck either way.
      - name: Agents integration tests — gated set (packages/agents)
        working-directory: packages/agents
        run: >-
          pnpm exec vitest run
          --config vitest.integration.config.ts
          --no-coverage
          --no-file-parallelism
          --exclude '**/extension-handler.integration.test.ts'
          --exclude '**/lifecycle-repair-dispatch.integration.test.ts'
          --exclude '**/lifecycle-repair-successor-batch.integration.test.ts'
          --exclude '**/store-auth-policy.integration.test.ts'
          --exclude '**/trigger-gate.integration.test.ts'
          --exclude '**/trigger-gate-integration.integration.test.ts'
          --exclude '**/trigger-handlers.integration.test.ts'
          --exclude '**/trigger-schedule.integration.test.ts'

      # (2) THE WHOLE TIER, INFORMATIONAL — every one of the 31 files, including
      # the 8 carved out above, with NO filter and NO exclude. Never fails this
      # job (same convention as the archive-acceptance-gate `--strict` step
      # below). Two reasons it is here rather than omitted:
      #   - a green step (1) alone would advertise "the integration tier runs"
      #     while silently dropping 89 tests — precisely the vacuity class this
      #     issue is about, and the one scripts/audit/ci-pinned-tests-exist.mjs
      #     exists to prevent elsewhere. This step keeps the debt VISIBLE in the
      #     log of every run, with the exact failing files named, so shrinking
      #     the carve-out cannot be quietly forgotten;
      #   - it is the honest artifact for the issue's acceptance criterion "a CI
      #     run's log shows the integration tier executing, not skipping": all
      #     31 files / 277 tests, 0 skipped.
      # Runs against its OWN schema (see the provisioning step above) so step (1)
      # cannot have pre-populated fixtures out from under it. `!cancelled()` (not
      # `always()`) so it still reports after a red step (1) but honours a
      # workflow cancellation.
      #
      # The warning below deliberately does NOT assert a cause: a non-zero exit
      # here can be the known-red assertion failures, but it can equally be a
      # vitest crash, an OOM, a config error, or MORE failures than the recorded
      # baseline. It reports the observed exit code and points at the baseline for
      # comparison rather than explaining the failure away.
      - name: Agents integration tests — WHOLE tier incl. known-red files (informational; never blocking)
        if: ${{ !cancelled() }}
        working-directory: packages/agents
        env:
          SUPABASE_SCHEMA: cinatra_full_tier
        run: |
          set +e
          pnpm exec vitest run --config vitest.integration.config.ts --no-coverage --no-file-parallelism
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::warning::Whole-tier packages/agents integration run exited $status. Recorded baseline for this branch (cinatra#2226): 31 files / 277 tests, 0 skipped, 8 files / 44 tests failing — pre-existing test-health debt named in this job's header. COMPARE the summary above against that baseline: a WORSE result (more failing files/tests, a different file, a crash or timeout rather than assertion failures) is a real finding and should be investigated, not assumed pre-existing. This step never fails the job; the gated step above is the blocking signal."
          fi
          exit 0

      # Always — even when a step above failed or the job was cancelled — so a
      # red run does not leak a running container into the runner's teardown.
      # The VM is ephemeral and this would cost nothing either way, but a
      # named container left running is a confusing thing to find in a
      # "why is docker unhappy" diagnostic on a shared runner image.
      - name: Stop the disposable Verdaccio
        if: ${{ always() }}
        run: docker rm -fv agents-it-verdaccio >/dev/null 2>&1 || true

  # Archive-acceptance coverage-completeness gate (cinatra#1943 Decision 1 /
  # the "P1-CI" wiring PR). Wires scripts/audit/archive-acceptance-gate.mjs
  # (authored in #1943's A0 slice, PR #2207) into CI.
  #
  # WHY THIS LIVES HERE, NOT A SEPARATE WORKFLOW FILE: GitHub Actions
  # `needs:` cannot express a cross-workflow-file edge. Every row in the
  # coverage-completeness manifest that names a CI dependency today points at
  # a job living in THIS file (`test`, `extension-lifecycle-db-tests`,
  # `perpetual-loops-invariants`) — the gate script's own header documents
  # this exact finding from #1943 A0's grounding pass, and also documents
  # that the design's original sketch (a separate `org-write-boundary-
  # gate.yml`) does not exist in this repo. Putting this job in a different
  # workflow file would leave every one of those rows structurally unable to
  # satisfy `--strict` mode's `needs:` check, no matter how green the
  # underlying tests are.
  #
  # DEGRADES GRACEFULLY: #2207 (the manifest + gate script themselves) may
  # not be merged yet. Every step below guards on
  # scripts/audit/archive-acceptance-gate.mjs actually existing in the
  # checked-out tree — a green no-op stub before #2207 merges, the real gate
  # the moment it does, no follow-up PR needed to "turn it on".
  #
  # `needs:` lists every job a manifest row's ciDependency currently names,
  # so this job structurally depends on each of them — the hard CI-graph
  # edge Decision 1's `--strict` mode looks for when it parses this workflow
  # file's own YAML. `always()` below no longer means this job's own result
  # is unhooked from those jobs' pass/fail — see DEPENDENCY-HONEST below for
  # why that used to be true, why it was a bug, and the fix. `always()` now
  # exists only so a FAILED prerequisite produces a definitive job FAILURE
  # here rather than a silent SKIP, the same reason the `build` job uses it.
  #
  # `agents-integration-db` (cinatra#1943 P1-CI follow-up) — added so a row
  # whose ciDependency names that job (the two live-Postgres acceptance rows
  # built in #2250: "Pre-archive parent spawning post-archive child denied"
  # and "Lease expiry mid-completion → cancel-then-settle") is structurally
  # satisfiable under `--strict` mode's own-job `needs:` check, the same way
  # the three jobs above already are. Before this, `strictCheckRow` would
  # report "the coverage-gate's own job does not needs: agents-integration-db
  # yet" for those rows even after their tests pass — a structural gap, not a
  # test-health one. This edit alone does not turn either row green (that is
  # manifest CONTENT, #2250's/a follow-up's call, not this workflow-only
  # change) — it only removes the CI-graph blocker so a future green claim on
  # those rows can actually be verified instead of failing on a missing edge.
  #
  # `e2e-rbac` (cinatra#1943/#1942, the sibling-workflow follow-up to #2703's
  # content PR) joins `needs:` for the identical reason: the manifest's row
  # 15 ("3-role live Playwright proof (owner archives/unarchives;
  # admin/member read-only; non-member 404) on a production-equivalent
  # build") now names `build-image.yml` / `e2e-rbac` as its ciDependency —
  # #2703 pointed it there, replacing an `e2e-app-suites.yml` /
  # `archive-acceptance` pair that never existed and could never have passed
  # strict mode. Without this edge, row 15 stays structurally unable to
  # satisfy `--strict` no matter how green cinatra#1942 eventually makes it.
  #
  # BLOCKING, STAGED ON ROW 15 (cinatra#1943, #2703's "Sibling workflow PR"
  # section, edit 2 of 3): `audit` mode has always been a real, blocking
  # check — the manifest-hygiene check Decision 1 says runs on every PR.
  # `--strict` mode is now ALSO blocking, but only once the manifest's row 15
  # itself reads "green" — see the strict-mode step below for the exact
  # mechanism. Before row 15 lands (cinatra#1942), it is the one row this
  # program has documented will stay honestly red while the other fourteen
  # are already green; making `--strict` unconditionally blocking ahead of
  # that would red every PR in this repo over a KNOWN, by-design gap, not a
  # regression. The step self-arms: the moment a future PR flips row 15 to
  # green, this SAME step starts blocking with no further workflow-only PR
  # needed — the same "no follow-up PR to turn it on" shape as the DEGRADES
  # GRACEFULLY note above.
  #
  # DEPENDENCY-HONEST (cinatra#1943, #2703's "Sibling workflow PR" section,
  # edit 3 of 3 — a codex finding recorded in that PR): this job used to run
  # `if: always()` while checking only `detect`'s own result, and no step
  # ever inspected the OTHER `needs:` jobs' outcomes — so a green
  # `archive-acceptance-gate` never actually implied `test` /
  # `extension-lifecycle-db-tests` / `perpetual-loops-invariants` /
  # `agents-integration-db` / `e2e-rbac` had passed; it could report green
  # while every one of them had failed. Fixed the same way `build` fixes the
  # identical hole (see that job's own comments): the job-level `if:` now
  # runs whenever `detect` did NOT cleanly succeed-and-skip — so a `detect`
  # failure is a definitive job FAILURE, never the silent SKIP that some
  # branch-protection configurations would count as passing — and the new
  # "Guard prerequisite gates" step hard-fails immediately if ANY `needs:`
  # job's result isn't `success`. Docs-only/draft PRs (`detect` succeeds with
  # `skip: true`) still skip this job entirely, exactly as before.
  #
  # RESOLVED (was a KNOWN MISMATCH flagged, not fixed, when this job was
  # first wired in #2209): the gate script's SELF_WORKFLOW/SELF_JOB constants
  # briefly pointed at `org-write-boundary-gate.yml` / `org-write-boundary-
  # gate` (the design's original, since-revised sketch) instead of this job's
  # real location. #2211 already corrected both constants to
  # `build-image.yml` / `archive-acceptance-gate`, matching where this job
  # actually lives — noted here only so a future reader does not go looking
  # for a mismatch that no longer exists.
  archive-acceptance-gate:
    name: Archive acceptance coverage-completeness gate (#1943)
    needs: [detect, test, extension-lifecycle-db-tests, perpetual-loops-invariants, agents-integration-db, e2e-rbac]
    # Run even when a prerequisite FAILED, so the guard step below reports a
    # definitive job FAILURE instead of a SKIP — GitHub can count a skipped
    # required check as successful (the same hole `build`'s own comment
    # names). Docs-only and draft PRs (`detect` succeeds with `skip: true`)
    # still skip this job.
    if: ${{ always() && (needs.detect.result != 'success' || needs.detect.outputs.skip != 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # Hard-fail (definitive RED, never a passing SKIP) the instant any
      # prerequisite gate did not succeed — see DEPENDENCY-HONEST above.
      # No-ops on the success path (zero extra latency there).
      - name: Guard prerequisite gates (detect + test + extension-lifecycle-db-tests + perpetual-loops-invariants + agents-integration-db + e2e-rbac)
        if: ${{ needs.detect.result != 'success' || needs.test.result != 'success' || needs['extension-lifecycle-db-tests'].result != 'success' || needs['perpetual-loops-invariants'].result != 'success' || needs['agents-integration-db'].result != 'success' || needs['e2e-rbac'].result != 'success' }}
        run: |
          echo "::error::Prerequisite gate failed — detect=${{ needs.detect.result }} test=${{ needs.test.result }} extension-lifecycle-db-tests=${{ needs['extension-lifecycle-db-tests'].result }} perpetual-loops-invariants=${{ needs['perpetual-loops-invariants'].result }} agents-integration-db=${{ needs['agents-integration-db'].result }} e2e-rbac=${{ needs['e2e-rbac'].result }}. A green coverage-completeness gate must not be reachable when the CI it depends on failed (cinatra#1943, codex finding recorded in #2703). Refusing to report this gate green."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Coverage-completeness gate — audit mode (manifest hygiene)
        if: ${{ hashFiles('scripts/audit/archive-acceptance-gate.mjs') != '' }}
        run: node scripts/audit/archive-acceptance-gate.mjs

      - name: Coverage-completeness gate — strict mode (blocking once row 15 is green; informational until then)
        if: ${{ hashFiles('scripts/audit/archive-acceptance-gate.mjs') != '' }}
        run: |
          set +e
          node scripts/audit/archive-acceptance-gate.mjs --strict
          strict_status=$?

          # Row 15 ("3-role live Playwright proof...") is the one criterion
          # #2703 documented will stay honestly red until cinatra#1942 lands
          # the Danger-zone Archive/Unarchive affordance the Playwright spec
          # needs to drive. Matched by its exact criterion text, not array
          # position — the same way archive-acceptance-gate.mjs itself
          # singles out its one special row (REQUIRES_BOTH_PROOF_KINDS) — so
          # a manifest re-ordering can't silently point this check at the
          # wrong row.
          row15_green=$(node -e '
            const fs = require("fs");
            const CRITERION = "3-role live Playwright proof (owner archives/unarchives; admin/member read-only; non-member 404) on a production-equivalent build";
            try {
              const manifest = JSON.parse(fs.readFileSync("scripts/audit/archive-acceptance-manifest.json", "utf8"));
              const row = (manifest.rows || []).find((r) => r && r.criterion === CRITERION);
              process.stdout.write(row && row.status === "green" ? "true" : "false");
            } catch {
              process.stdout.write("false");
            }
          ')

          if [ "$strict_status" -eq 0 ]; then
            exit 0
          fi

          if [ "$row15_green" = "true" ]; then
            echo "::error::--strict reports NOT READY while row 15 (the 3-role live Playwright proof, cinatra#1942) is green — cinatra#1943's V6 precondition has regressed. See the log above for which row(s) failed. Failing this job."
            exit 1
          fi

          echo "::notice::--strict reports NOT READY — row 15 (the 3-role live Playwright proof) is still red, expected until cinatra#1942's Danger-zone Archive/Unarchive affordance lands (see cinatra#1943 for the current tier); not a failure of this wiring job. This step starts blocking automatically the moment row 15 turns green — no follow-up workflow PR needed."

      - name: Coverage-completeness gate — not yet landed (cinatra#2207 not merged)
        if: ${{ hashFiles('scripts/audit/archive-acceptance-gate.mjs') == '' }}
        run: echo "scripts/audit/archive-acceptance-gate.mjs not present yet (cinatra#2207 not merged) — reporting this CI-wiring job as a deliberate green no-op stub until it lands; see cinatra#1943."

  # Gate the canonical-extension invariants as an independent job so the gate
  # is visible regardless of the agents-suite baseline.
  #
  # cinatra#2439: this job used to run `pnpm test:invariants`, a HAND-MAINTAINED
  # list of 40 test files out of the 113 packages/extensions ships. The other 73
  # ran in no workflow at all — and joined that hole BY DEFAULT, because joining
  # the gate required somebody to remember to append a path to a package.json
  # script. That is the same failure shape cinatra#2288 documents for the
  # extension fleet and cinatra#2316 for packages/execution-plane.
  #
  # The step now runs the WHOLE package (`pnpm test` = `vitest run` over the
  # package's own config), the `test:invariants` script is deleted so it cannot
  # come back, and every carve-out is an explicit `exclude` entry in
  # packages/extensions/vitest.config.ts with a written reason and a filed
  # follow-up issue (mirrored in
  # scripts/audit/package-suite-runner-exceptions.json). Measured: 110 files /
  # 2,165 tests, 6s of vitest locally, against 40 files before — the whole-suite
  # run costs seconds, not minutes, so no tier split was needed.
  v64-invariants:
    name: Canonical extension invariants
    needs: detect
    if: ${{ needs.detect.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Clone companion extension repos
        uses: ./.github/actions/clone-extensions

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # WHOLE package, from the package dir, under its own config — not a file
      # list. A new test file under `src/**/__tests__/` is gated by default.
      - name: Extension invariants (packages/extensions — whole suite)
        run: cd packages/extensions && pnpm test

  # ── Workspace package unit suites (cinatra#2439) ────────────────────────────
  #
  # WHAT WAS BROKEN. The sweep in cinatra#2434 inventoried every test file in
  # the tree against every workflow runner and found ~209 plain package unit
  # suites that NO workflow invoked at all — the whole of packages/llm (56
  # files), packages/chat (40), packages/agent-ui-protocol (13), most of
  # packages/objects and packages/registries (which had 5 and 3 hand-pinned
  # files respectively), and a dozen small packages with one to seven files
  # each. Not carved out, not quarantined: never wired, because a package's
  # tests join CI only when somebody adds a step and nothing said when nobody
  # did. The repo-wide `tsc` still compiled those files, so a TYPE error reded
  # CI while a FAILING ASSERTION did not — the identical gap cinatra#2316
  # closed for packages/execution-plane and cinatra#2288 for the extension
  # fleet.
  #
  # It was not theoretical. First-running these suites for this change found
  # real defects that had been invisible: a stale two-argument assertion in
  # packages/objects' read-path suite that missed the cinatra#1428 ownership
  # filter, a missing sandbox alias that had eight packages/objects handler
  # suites failing at assertion time with ERR_MODULE_NOT_FOUND, and four
  # genuinely red fleet-drift suites now quarantined against filed issues
  # (cinatra#2454, cinatra#2455).
  #
  # WHY ONE JOB AND NOT STEPS ON AN EXISTING ONE. The whole set is 219 files /
  # 2,493 tests and 17.4s of vitest SEQUENTIALLY (measured locally, per-package
  # figures beside each step below) — nowhere near the ~5-minute per-PR budget
  # cinatra#2439 sets as the main-only threshold, so every package here runs on
  # the per-PR path and none needed a main-only tier. But the job still pays a
  # checkout + companion clone + `pnpm install`, so folding it into
  # `perpetual-loops-invariants` would have spent that job's remaining margin
  # (10-11 min against an 18-minute cap, reasoned in its own header) on suites
  # that do not need anything that job has. A sibling job runs in PARALLEL, so
  # the workflow's critical path — the ~30-minute `build` job — is unchanged.
  #
  # WHY HAND-LISTED STEPS ARE SAFE HERE, when hand-listing is exactly what let
  # this hole grow. Because the default is now inverted somewhere else: the
  # `Pinned-test existence gate` step in perpetual-loops-invariants
  # (scripts/audit/ci-pinned-tests-exist.mjs, direction 3) reads THIS file and
  # fails closed on any packages/** unit test with no statically detected
  # runner and no written exception. Adding a package with tests and forgetting
  # this job turns that gate RED with the file named. Every step below is
  # WHOLE-PACKAGE (`pnpm test` from the package dir, under the package's own
  # config), never a file list, so a new test file inside an already-wired
  # package is gated by default with no edit here at all.
  #
  # REQUIRED STRUCTURALLY, not via branch protection: the `build` job `needs`
  # this job and its "Guard prerequisite gates" step hard-fails the
  # (branch-protection-required) `build` if it did not succeed — the exact
  # mechanism behind `test` / `skills-unit` / `a2a-unit` /
  # `execution-plane-unit`, so NO branch-protection contexts change is needed
  # and this job's own context stays non-required.
  #
  # The companion clone is needed: several packages/objects suites
  # (register-types-*, semantic-manifest*, the seed-pack parity tier) read the
  # MATERIALIZED extension tree off disk, exactly as the seed-pack tier in
  # perpetual-loops-invariants does.
  package-unit-suites:
    name: Workspace package unit suites
    needs: detect
    if: ${{ needs.detect.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Setup (checkout + clone-extensions + install) is the whole cost here;
    # 17.4s of measured vitest sits on top of it. 12 leaves room for runner
    # variance and fleet growth without hiding a genuine stall.
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Clone companion extension repos
        uses: ./.github/actions/clone-extensions

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Each step is the WHOLE package under its own vitest config. The figure
      # is the locally measured wall time of that one invocation (files/tests
      # as of this change); the sum is 17.4s.
      - name: llm unit suite (56 files / 656 tests, 1.4s)
        run: cd packages/llm && pnpm test

      - name: objects unit suite (59 files / 692 tests, 1.5s)
        run: cd packages/objects && pnpm test

      - name: chat unit suite (40 files / 412 tests, 3.0s)
        run: cd packages/chat && pnpm test

      - name: agent-ui-protocol unit suite (13 files / 153 tests, 0.7s)
        run: cd packages/agent-ui-protocol && pnpm test

      - name: registries unit suite (16 files / 142 tests, 1.4s)
        run: cd packages/registries && pnpm test

      - name: metric-cost-api unit suite (7 files / 30 tests, 0.7s)
        run: cd packages/metric-cost-api && pnpm test

      - name: memory unit suite (7 files / 61 tests, 1.9s)
        run: cd packages/memory && pnpm test

      - name: marketplace-mcp-client unit suite (5 files / 79 tests, 0.6s)
        run: cd packages/marketplace-mcp-client && pnpm test

      - name: webhooks unit suite (4 files / 138 tests, 0.6s)
        run: cd packages/webhooks && pnpm test

      - name: streams unit suite (4 files / 49 tests, 1.0s)
        run: cd packages/streams && pnpm test

      - name: extension-types unit suite (2 files / 19 tests, 0.6s)
        run: cd packages/extension-types && pnpm test

      - name: artifacts unit suite (1 file / 3 tests, 0.5s)
        run: cd packages/artifacts && pnpm test

      - name: connectors-catalog unit suite (1 file / 6 tests, 0.5s)
        run: cd packages/connectors-catalog && pnpm test

      - name: marketplace-application-reconcile unit suite (1 file / 8 tests, 0.6s)
        run: cd packages/marketplace-application-reconcile && pnpm test

      - name: marketplace-sync unit suite (1 file / 20 tests, 0.5s)
        run: cd packages/marketplace-sync && pnpm test

      - name: metric-contracts unit suite (1 file / 4 tests, 0.5s)
        run: cd packages/metric-contracts && pnpm test

      - name: pm-schedule-reconcile unit suite (1 file / 12 tests, 0.6s)
        run: cd packages/pm-schedule-reconcile && pnpm test

      - name: projects unit suite (1 file / 24 tests, 0.8s)
        run: cd packages/projects && pnpm test

  # THE HOSTED-MCP WIRE GATE (cinatra#2776). The composed, end-to-end assertion
  # that the Cinatra self-MCP catalog reaches EVERY provider as ONE hosted MCP
  # reference and never as inline function schemas — driven through the real
  # chat/widget runtime, the real connector adapters (resolved through the
  # `llm-provider-adapter` capability registry), the real provider SDKs, and
  # captured at `globalThis.fetch`, the SDKs' own serialization boundary.
  #
  # Why it needs a job of its own. The gate lives under `src/lib/assistant-runtime/
  # __tests__/`, which the ROOT vitest config includes — and no workflow runs the
  # root suite wholesale; CI pins root files step by step (see rbac-authz-unit,
  # auth-schema-drift). Without this step the gate would exist and execute
  # nowhere, which is precisely the failure #2776 was opened about.
  #
  # It DOES need the companion-extension clone, unlike skills-unit / a2a-unit:
  # the whole point is to run the CONNECTORS' real adapter code at the pins this
  # tree commits (cinatra-required-extensions.lock.json for OpenAI + Anthropic,
  # cinatra-dev-extensions.lock.json for Gemini). `clone-extensions` materializes
  # them at exactly those shas, so this job measures the pinned tree — the same
  # tree the image is built from — never a main-tip drift.
  #
  # REQUIRED STRUCTURALLY, not via branch protection: the `build` job `needs` it
  # and its "Guard prerequisite gates" step hard-fails the
  # (branch-protection-required) `build` if this job did not succeed — the exact
  # mechanism behind `test` / `skills-unit` / `a2a-unit` / `execution-plane-unit`,
  # so NO branch-protection contexts change is needed and this job's own context
  # stays non-required. Docs-only / draft PRs skip it through `detect`, which is
  # the repository's definition of participation in the required set.
  #
  # Measured: ~3s of vitest (17 tests) on top of checkout + clone + install.
  hosted-mcp-wire-gate:
    name: Hosted-MCP wire gate
    needs: detect
    if: ${{ needs.detect.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'pnpm'

      # The PINNED companion trees — the connectors whose serialization this
      # gate measures. Materialized BEFORE install so the workspace links
      # resolve to the pinned adapter source.
      - name: Clone companion extension repos
        uses: ./.github/actions/clone-extensions

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Hosted-MCP wire gate (chat + both widget kinds, all providers)
        run: pnpm exec vitest run src/lib/assistant-runtime/__tests__/hosted-mcp-wire-gate.test.ts --no-coverage

      # The runtime-side companions of the same invariant: the `native_mcp` pin
      # on the stream input, the refusal copy, and the tool-array parity the
      # gate's wire assertions rest on.
      - name: Assistant-runtime suite (the gate's runtime-side companions)
        run: pnpm exec vitest run src/lib/assistant-runtime --no-coverage

  # Dev-mode build performance invariants — gates the locked measurement
  # contract + the chokepoint-narrowing invariants. Runs the 4 test files under
  # scripts/__tests__/ that are the structural gates: (1) route-graph
  # determinism + type-only erasure + tryFile() containment guard, (2) bench
  # compile-path floor-scoping, (3) the vitest alias-order trap (subpath alias
  # before bare in every config that maps the bare alias to a FILE/stub),
  # (4) dev-stop PORT-3000 refusal + ownership verification.
  devperf-invariants:
    name: devperf invariants
    needs: detect
    if: ${{ needs.detect.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Clone companion extension repos
        uses: ./.github/actions/clone-extensions

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: devperf invariants (scripts/__tests__/)
        run: npx vitest run scripts/__tests__/route-graph.test.mjs scripts/__tests__/bench-cold-start.test.mjs scripts/__tests__/devperf-invariants.test.mjs scripts/__tests__/dev-stop.test.mjs --no-coverage

      - name: Docker host-port drift guard (scripts/lib/)
        run: node --test scripts/lib/__tests__/docker-port-drift.test.mjs

  # Perpetual system loops invariants — static-analysis gate that enforces the
  # canonical "BullMQ perpetual system loops" pattern documented in root
  # AGENTS.md. The same antipattern (handler self-rescheduling via
  # `enqueueBackgroundJob` with the same job name) has recurred four times in
  # production (graphiti-projection-repair / artifact-provider-cache-evict /
  # audit-retention-enforce / litellm-pricing-sync); this gate fails the build
  # before a fifth recurrence lands. Runs the gate script PLUS its companion
  # parser tests so a regression in either the source pattern or the gate
  # itself is caught.
  perpetual-loops-invariants:
    name: Perpetual system loops invariants
    needs: detect
    # REQUIRED status check on `main`. Run even when `detect` FAILED, so the
    # guard step below reports a definitive job FAILURE instead of a SKIP —
    # GitHub counts a skipped required check as satisfied, so a failed `detect`
    # merely *skipping* this job would NOT block a merge (same hole the `build`
    # job closes with this exact pattern). Docs-only and draft PRs (detect
    # succeeded + skip) still skip this job — the documented skip-as-success
    # path is unchanged.
    if: ${{ always() && (needs.detect.result != 'success' || needs.detect.outputs.skip != 'true') }}
    runs-on: ubuntu-latest
    # Least privilege, tightened with cinatra#2288 slice 2 and matching what
    # actions-pin-gate / schema-migration-gate / archive-acceptance-gate in this
    # same file already declare. Without it this job inherits the WORKFLOW-level
    # `packages: write` (needed only by the image-publishing jobs). That matters
    # more now than it did: the extension suite gate below executes the test
    # code of every materialized companion repo — 44 independently maintained
    # codebases, up from the 8 the hand-listed steps ran — and none of it has
    # any business holding a package-write token. The checkout below drops the
    # persisted credential for the same reason.
    permissions:
      contents: read
    # 15 → 18 with cinatra#2288 slice 2, because this job was ALREADY riding its
    # cap before the gate below existed: 10m17s wall on the last green main run
    # (30650103197, 2026-07-31), 10m01s and 9m28s on the two before it, against
    # a 15-minute limit.
    #
    # MEASURED ON THE HOSTED RUNNER, not estimated: the extension suite
    # discovery gate below costs 58s (2,149 tests across 44 suites, 214.7s of
    # vitest at the 4-way concurrency it pins), taking this job to 11m04s. So
    # the gate is cheap and the margin is the real subject: 18 leaves ~7 minutes
    # for fleet growth and runner variance on a REQUIRED check, where 15 would
    # have left four. Sequential would not have fit that judgement — ~215s of
    # vitest one suite after another is most of the remaining margin by itself,
    # which is why the concurrency below is pinned rather than optional.
    timeout-minutes: 18
    steps:
      # Hard-fail (definitive RED, never a non-failing "skip") when detect did
      # not pass. No-ops on the success path; its failure short-circuits every
      # later step, so they need no per-step guards.
      - name: Guard — detect must have succeeded
        if: ${{ needs.detect.result != 'success' }}
        run: |
          echo "::error::detect job did not succeed (result=${{ needs.detect.result }}); failing this required check rather than passing it silently."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the touch-ratchet diff in admin-route + other
          # gates run from this job can resolve origin/<pr.base.ref>.
          fetch-depth: 0
          # No git credential left on disk for companion test code to find
          # (cinatra#2288 slice 2). Safe here and verified: after this checkout
          # the job runs NO authenticated git — the only git in it is
          # `git rev-parse` over refs this checkout already fetched, and
          # clone-extensions clones the companion repos over public https with
          # no token (its own action.yml records that).
          persist-credentials: false

      - name: Compute diff base
        id: base
        # PRs → origin/<pr.base.ref>. Pushes → previous-tip
        # (github.event.before) so a push to main still has a meaningful
        # touch-ratchet anchor.
        run: |
          if [ -n "${{ github.event.pull_request.base.ref }}" ]; then
            base="origin/${{ github.event.pull_request.base.ref }}"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            base="${{ github.event.before }}"
          else
            base="origin/main"
          fi
          # Validate the base resolves to a commit. When `github.event.before`
          # points at a commit not present in the fetched history, the diff base
          # has no shared anchor.
          # Fall back to HEAD (this commit) so every ratchet gate self-compares: the
          # baseline-growth guards see no growth (HEAD vs HEAD is an empty diff) and the
          # touch-ratchet gates see no added lines — both pass their absolute baseline
          # check instead of failing closed on an unresolvable ref. An empty base is
          # deliberately NOT used: the touch-ratchet gates treat "" as absent and
          # silently re-resolve origin/main, diffing the whole tree against pre-existing
          # legacy references and failing. If HEAD itself cannot resolve (should never
          # happen in a real checkout), hard-fail rather than silently drop the guards.
          if [ -n "$base" ] && ! git rev-parse --verify --quiet "${base}^{commit}" >/dev/null 2>&1; then
            head="$(git rev-parse --verify --quiet HEAD || true)"
            if [ -z "$head" ]; then
              echo "::error::diff base '${base}' did not resolve AND HEAD did not resolve — cannot anchor the ratchet gates; failing the build rather than dropping the guards."
              exit 1
            fi
            echo "::notice::diff base '${base}' did not resolve — using HEAD so all ratchet gates self-compare"
            base="$head"
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Clone companion extension repos
        uses: ./.github/actions/clone-extensions

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Perpetual system loops gate (static analysis)
        run: node scripts/audit/perpetual-system-loops-gate.mjs

      - name: Perpetual system loops gate tests
        run: pnpm exec vitest run scripts/audit/__tests__/perpetual-system-loops-gate.test.mjs

      - name: Identity copy gate (no GTM-only platform framing)
        run: node scripts/audit/identity-copy-gate.mjs

      # Every extension manifest must carry the policy license field (Apache-2.0
      # for cinatra-ai extensions; GPL-2.0-or-later for any GPL-derived
      # extension). Fixed by `node scripts/extensions/apply-license-cleanup.mjs`.
      - name: Extension license-field gate
        run: node scripts/audit/extension-license-gate.mjs

      - name: Extension license-field gate tests
        run: pnpm exec vitest run scripts/extensions/__tests__/license-cleanup.test.mjs

      # WP MCP gateway pinned-fixture pin-integrity gate (#2016 S1). Pure static
      # consistency check (no download): the pinned version/URL/sha256/digest
      # literals in docker/wordpress/Dockerfile + docker-compose.yml +
      # scripts/wordpress-entrypoint.sh MUST agree with docker/wordpress/pins.lock,
      # no pin may be a placeholder, and the mcp-adapter bundlesVendor path must
      # match the Dockerfile. The REMOTE-artifact hashes are actually verified at
      # image-build time on runners (the Dockerfile sha256sum -c + digest pull);
      # this closes the pin-DRIFT gap. It rides this already-required job so it
      # inherits required-ness with no branch-protection change, and no-ops
      # cleanly (exit 0) when docker/wordpress/pins.lock is absent, so unrelated
      # PRs are unaffected. Pure node (no pnpm) — like actions-pinned-gate.
      - name: WP MCP gateway fixture pin-integrity gate
        run: node scripts/audit/wordpress-fixture-pins-gate.mjs

      - name: WP MCP gateway fixture pin-integrity gate tests
        run: node --test scripts/audit/__tests__/wordpress-fixture-pins-gate.test.mjs

      # WP MCP gateway capture-freshness gate (#2016 S1). Offline anti-staleness
      # check: for every committed capture under tests/e2e/wp-mcp-gateway/captures/
      # that carries a `provenance` block, it recomputes the recorded hashes from
      # the CURRENT tree (pins.lock, the fixture-plugin tree, the capture
      # producer, the api-map) and FAILS if any drifts — so a pins/plugin/producer
      # change committed WITHOUT re-capturing can no longer keep PR CI green. Shares
      # its hashing verbatim with the producer (tests/e2e/wp-mcp-gateway/
      # provenance.mjs). Rides this already-required job so it inherits
      # required-ness with no branch-protection change, and no-ops cleanly (exit 0)
      # when there are no provenanced captures yet. Pure node (no pnpm).
      - name: WP MCP gateway capture-freshness gate
        run: node scripts/audit/wp-gateway-capture-freshness.mjs

      - name: WP MCP gateway capture-freshness gate tests
        run: node --test scripts/audit/__tests__/wp-gateway-capture-freshness.test.mjs

      # Every extension must declare its cross-kind dependency edges in
      # cinatra.dependencies, kept in sync with the confident graph re-derived
      # from source (so the marketplace can dependency-order extraction). STRICT
      # (not a ratchet) — undeclared structural edge / malformed entry fails CI.
      - name: Extension dependency-manifest drift gate
        run: node scripts/audit/extension-deps-gate.mjs

      # Produced-artifact dependency gate (cinatra#2537, no-new-rot ratchet).
      # A `cinatra.produces` entry (package.json and/or cinatra/oas.json) is NOT
      # an install edge: unless the same manifest also declares the produced
      # artifact as a REQUIRED artifact-kind `cinatra.dependencies` entry,
      # installing the agent never installs the artifact, its object type is
      # never claimed, and every run fails materialization. This is the
      # catalog-wide static mirror of the publish/install typed-production
      # contract (ARTIFACT-CONTRACT-PRODUCES-UNCLAIMED), which cannot see an
      # already-published offender sitting in a source repo. Baseline
      # grandfathers the five #2537 offenders (fixed in their own repos; they
      # drop out when their pins are bumped); the gate fails on NEW ones.
      - name: Produced-artifact dependency gate
        env:
          # Also fail if the committed baseline GREW vs the base branch (blocks
          # the regenerate-to-pass bypass). Same base ref the other no-new-rot
          # gates use.
          EXTENSION_PRODUCES_DEPS_BASE: ${{ steps.base.outputs.base }}
        run: node scripts/audit/extension-produces-deps-gate.mjs

      - name: Produced-artifact dependency gate tests
        run: node --test scripts/audit/__tests__/extension-produces-deps-gate.test.mjs

      # The `@/` import-ban for extensions. PINNED EMPTY (cinatra#172 — the
      # zero-floor flip for the extension→host direction, on the
      # core-extension-import-ban precedent): ANY current hostInternal/
      # crossExtension/sdkOnly edge fails immediately, a non-empty committed
      # baseline is itself a failure, --write-baseline refuses non-empty
      # output. No whole-extension exemptions; the only carve-out mechanism is
      # the owner-ruled sdkOnly STRICT_SDK_ONLY_ALLOWLIST (EMPTY,
      # self-policing).
      - name: Extension @/ import-ban + SDK-only gate (strict sdkOnly)
        env:
          # Retained purely as a fail-closed TAMPER CHECK since the flip: the
          # committed baseline must be a subset of the base-branch baseline
          # (trivially holds while both stay pinned empty; flag-like or
          # unresolvable refs fail closed). Same base ref the
          # administration-route gate uses.
          IMPORT_BAN_BASE: ${{ steps.base.outputs.base }}
        # --strict-sdk-only is retained as an accepted NO-OP for CLI
        # compatibility — the sdkOnly dimension is UNCONDITIONALLY
        # zero-tolerance since the flip (neither passing nor omitting the flag
        # can weaken enforcement; pinned by the gate's unit tests).
        run: node scripts/audit/extension-import-ban.mjs --strict-sdk-only

      - name: Extension import-ban gate tests
        run: pnpm exec vitest run scripts/audit/__tests__/extension-import-ban.test.mjs

      # DENY-by-default node:fs/node:fs/promises in extension source (cinatra#979
      # checker home, landed with #981's host-owned ctx.logger.capture port). A
      # connector reaching for node:fs directly to write its own logs bypasses the
      # host-managed data root + rotation/retention + telemetry-page listing/
      # clearing #981 centralized. Two carve-outs: the PERMANENT owner-ruled,
      # self-policing FS_IMPORT_ALLOWLIST (currently one entry: openai's
      # non-logging skill-mount existsSync check), and a TEMPORARY shrink-only
      # ratchet baseline tolerating the three cinatra#981-migrated connectors'
      # pre-migration source until their lock-pins bump (their own repos are
      # already clean — gemini-connector#42, openai-connector#56,
      # apollo-connector#45).
      - name: Extension node:fs import-ban gate
        run: node scripts/audit/extension-fs-import-ban.mjs

      - name: Extension node:fs import-ban gate tests
        run: pnpm exec vitest run scripts/audit/__tests__/extension-fs-import-ban.test.mjs

      # Host-peer VALUE-import ban. A runtime-loaded
      # extension's cinatra.serverEntry import graph must keep the host-internal
      # SDK peers (@cinatra-ai/sdk-extensions / sdk-ui / mcp-client) type-only
      # (erased at compile) or take the value via the injected ctx; a runtime
      # VALUE import is the model-B hazard the prod file:// loader cannot resolve.
      # No-new-rot ratchet (the committed baseline is EMPTY today).
      - name: Host-peer value-import ban gate (no-new-rot)
        env:
          # Monotonic ratchet: the committed baseline must be a subset of the
          # base-branch baseline (it may only shrink). Same base ref the
          # extension-import-ban + administration-route gates use.
          HOST_PEER_BAN_BASE: ${{ steps.base.outputs.base }}
        run: node scripts/audit/host-peer-value-import-ban.mjs

      - name: Host-peer value-import ban gate tests
        run: pnpm exec vitest run scripts/audit/__tests__/host-peer-value-import-ban.test.mjs

      # The MIRROR gate: core(src/) -> extension import ban.
      # PINNED EMPTY (cinatra#151 Stage 3 — the honest-zero flip on the
      # shared lexer): any core->extension import edge fails immediately, a
      # non-empty committed baseline is itself a failure, --write-baseline
      # refuses non-empty output. Exempts ONLY the explicit generator-emitted
      # file list and tests; the base ref survives as a tamper check.
      - name: Core -> extension import-ban gate (zero-tolerance)
        env:
          # Monotonic guard: the committed baseline must be a subset of the
          # base-branch baseline (it may only shrink). Same base ref the
          # extension-import-ban + administration-route gates use.
          CORE_EXT_BAN_BASE: ${{ steps.base.outputs.base }}
        run: node scripts/audit/core-extension-import-ban.mjs

      - name: Core -> extension import-ban gate tests
        run: pnpm exec vitest run scripts/audit/__tests__/core-extension-import-ban.test.mjs

      # G1 — artifact-UI type-identity boundary gate (epic #1620 / #1624 S6).
      # AST/type-aware: core must treat an artifact/object type id, representation
      # form, HITL binding id, or chat viewType as an OPAQUE input to generic
      # dispatch. Every current keying arm is enumerated in the shrink-only
      # baseline with a disposition (MIGRATE/DEFER/STAY); live findings must equal
      # it exactly and the committed set may only shrink vs the base branch.
      - name: Artifact-UI type-identity boundary gate (G1, shrink-only)
        env:
          # Shrink-only monotonic guard: the committed baseline must be a subset
          # of the base-branch baseline. Same base ref the other ratchet gates use.
          ARTIFACT_UI_BOUNDARY_BASE: ${{ steps.base.outputs.base }}
        run: node scripts/audit/artifact-ui-boundary-gate.mjs

      - name: Artifact-UI type-identity boundary gate tests
        run: pnpm exec vitest run scripts/audit/__tests__/artifact-ui-boundary-gate.test.mjs

      # G4 addendum — variable-URL dynamic-import ratchet (epic #1620 M1 Slice A,
      # cinatra#1630). The main-realm dynamic renderer loader is the ONE
      # sanctioned CLIENT variable-URL `import(runtimeURL)` seam (alongside the
      # pre-existing server runtime-store loaders); this AST gate forbids a
      # variable-URL import() anywhere else in src/**, keeping the generated-map
      # static-import carve-out (G4) structurally intact. Zero-tolerance, no
      # baseline — a new computed dynamic import anywhere else fails CI.
      - name: Variable-URL dynamic-import ratchet (G4)
        run: node scripts/audit/no-variable-url-dynamic-import.mjs

      - name: Variable-URL dynamic-import ratchet tests
        run: pnpm exec vitest run scripts/audit/__tests__/no-variable-url-dynamic-import.test.mjs

      # No NEW bare fs.rename / renameSync on the extension install / materialize
      # / publish / store / boot surface (cinatra#874). A staged tmp tree promoted
      # to a persistent mount with a bare `rename` throws EXDEV cross-device and
      # crash-loops install/boot (cinatra#158, #846, #873); route the promote
      # through a shared EXDEV-safe move (src/lib/fs-safety.ts `atomicReplaceDir`
      # or packages/{agents,skills}/src/exdev-safe-move.ts `moveDirExdevSafe`)
      # instead. No-new-rot ratchet: a committed baseline enumerates the current
      # tolerated (same-fs / legacy) sites; a NEW surface rename fails CI.
      - name: EXDEV-safe rename gate (no-new-rot)
        env:
          # Monotonic guard: the committed baseline must be a subset of the
          # base-branch baseline (it may only shrink). Same base ref the other
          # ratchet gates use.
          EXDEV_RENAME_BASE: ${{ steps.base.outputs.base }}
        run: node scripts/audit/exdev-rename-gate.mjs

      - name: EXDEV-safe rename gate tests
        run: pnpm exec vitest run scripts/audit/__tests__/exdev-rename-gate.test.mjs

      # Discovery-dispatcher bypass gate. The runtime-discovery
      # dispatcher (discoverActiveExtensionCapabilities) is the ONE sanctioned way
      # a surface discovers active extension capabilities. ZERO-TOLERANCE
      # (cinatra#36): the tolerated-bypass baseline is PINNED EMPTY — any
      # direct native-reader reference outside the gate's documented, justified
      # SANCTIONED_READERS allowlist fails CI immediately (a non-empty committed
      # baseline is itself a failure; --write-baseline refuses to produce one).
      - name: Discovery-dispatcher bypass gate (zero-tolerance)
        env:
          # Monotonic guard: the committed baseline must be a subset of the
          # base-branch baseline (it stays empty). Same base ref the other
          # gates use.
          DISCOVERY_BYPASS_BASE: ${{ steps.base.outputs.base }}
        run: node scripts/audit/discovery-dispatcher-bypass-ban.mjs

      - name: Discovery-dispatcher bypass gate tests
        run: pnpm exec vitest run scripts/audit/__tests__/discovery-dispatcher-bypass-ban.test.mjs

      # Hardcoded extension-INSTANCE coupling gate. Catches the
      # OTHER way core hardcodes a specific extension (the way blog/openai.ts
      # slipped past the import-ban): string-literal / path references to an exact
      # extension package name or `extensions/<scope>/<name>/` path.
      # PINNED EMPTY (cinatra#151 Stage 7 — the zero-floor flip): any current
      # occurrence fails immediately, a non-empty committed baseline is itself
      # a failure, --write-baseline refuses non-empty output (the frozen
      # SCANNER_EPOCH and the base ref survive as tamper checks). The only
      # sanctioned named-extension references are the generated manifest tree +
      # the documented data-contract-ID allowlist (empty, owner-ruled only).
      # End-state record: scripts/audit/extension-coupling-gates.md.
      - name: Core -> extension instance-coupling gate (zero-tolerance)
        env:
          # Monotonic guard: committed baseline counts must not exceed the base
          # ref's. Same base ref the other gates use.
          CORE_EXT_INSTANCE_BAN_BASE: ${{ steps.base.outputs.base }}
        run: node scripts/audit/core-extension-instance-coupling-ban.mjs

      - name: Core -> extension instance-coupling gate tests
        run: pnpm exec vitest run scripts/audit/__tests__/core-extension-instance-coupling-ban.test.mjs scripts/audit/__tests__/strip-comments.test.mjs scripts/audit/__tests__/extension-reference-classification.test.mjs

      # Vendor-token core gate (cinatra#973 — epic #978: core owns integration
      # MECHANISM, never vendor CODE). The lexeme gates above pin extension
      # PACKAGE references; this one catches core code that names the VENDOR
      # directly (the PR #969 gap): a vendor-named file, directory/route
      # segment, or import specifier under src/ + packages/, outside the
      # sanctioned surfaces enumerated in scripts/audit/extension-coupling-gates.md.
      # SHRINK-ONLY ratchet: the committed baseline is today's residual floor;
      # a NEW occurrence fails immediately, a removed one must ratchet the
      # baseline down (stale entries fail), --write-baseline refuses growth.
      - name: Vendor-token core gate (shrink-only ratchet)
        env:
          # Monotonic guard: the committed baseline must be a subset of the
          # base-branch baseline (it may only shrink). Same base ref the other
          # ratchet gates use.
          VENDOR_TOKEN_BASE: ${{ steps.base.outputs.base }}
        run: node scripts/audit/vendor-token-core-gate.mjs

      - name: Vendor-token core gate tests
        run: pnpm exec vitest run scripts/audit/__tests__/vendor-token-core-gate.test.mjs

      # Identity-surface coupling gate (identity-surface ruling).
      # The pinned-empty coupling gates pin a LEXEME (package name / path), not
      # extension IDENTITY. This stateless gate blocks the two DANGEROUS
      # identity-coupling subsets the owner ruling singled out to FIX so they
      # cannot creep back: (A) an auth-route-guard public-route exemption naming
      # a concrete extension, and (B) a host src/ file RE-DECLARING an SDK-owned
      # capability id literal instead of importing the *_CAPABILITY /
      # *_CAPABILITY_ID constant. Requires the cloned-back extension tree (this
      # job clones it above) to derive the real-extension identity set.
      - name: Identity-surface coupling gate (dangerous-class, stateless)
        run: node scripts/audit/identity-coupling-gate.mjs

      - name: Identity-surface coupling gate tests
        run: pnpm exec vitest run scripts/audit/__tests__/identity-coupling-gate.test.mjs

      # Generated-manifest integrity gate (cinatra#36). The generated
      # src/lib/generated/** tree is the coupling gates' ONE permanent-exempt
      # class, so its integrity is load-bearing: this step fails CI when any
      # generated file drifts from the generator's byte-exact output (hand-edit
      # or stale regeneration) or the catalog parity check breaks. Requires the
      # cloned-back extension tree (this job clones it above).
      - name: Generated extension-manifest drift + parity gate (fail-closed)
        run: node scripts/extensions/generate-extension-manifest.mjs --check

      # Build-config consistency check. config/build-config.manifest.json
      # is the single source of truth for the tsconfig.json @cinatra-ai/* path
      # aliases AND the next.config.ts serverExternalPackages + transpilePackages
      # lists. This fails CI when those generated regions no longer match the
      # manifest (a hand-edit, a stale regeneration, or a manifest change that
      # was not re-rendered). Manifest-only inputs — does NOT need the cloned-back
      # extension tree. Regenerate with `node scripts/config/generate-build-config.mjs`.
      - name: Build-config consistency check (tsconfig + next.config vs manifest, fail-closed)
        run: node scripts/config/generate-build-config.mjs --check

      # Required-extensions coverage gate. The prod base image acquires the
      # bootable set from cinatra-required-extensions.lock.json; this fails CI
      # when a host-imported extension package is missing from
      # cinatra.requiredExtensions or from that lock (the image would build a
      # tree that cannot resolve the import), when lock and declaration
      # drift apart (forgotten regeneration), or when requiredExtensions !=
      # systemExtensions (the declaration equality guard — cinatra#151
      # Stage 7: the bootable declaration may not grow beyond the system set
      # without an owner ruling).
      - name: Required-extensions cover host imports gate
        run: node scripts/audit/required-extensions-cover-host-imports.mjs

      - name: Required-extensions cover host imports gate tests
        run: pnpm exec vitest run scripts/audit/__tests__/required-extensions-cover-host-imports.test.mjs

      # Skill-store canonicality gate. No NEW canonical writes
      # to the legacy `data/skills` tree (now compat-only),
      # no NEW direct reads of `skill.sourcePath` bypassing the resolver.
      # Same no-new-rot ratchet shape as extension-import-ban: a committed
      # baseline records the current legacy carve-outs (github clone path,
      # verdaccio install dir, relocate worker); CI fails on any new finding.
      - name: Skill-store canonicality gate (no-new-rot)
        env:
          # Monotonic ratchet: the committed baseline must be a subset of the
          # base-branch baseline (it may only shrink). Same base ref the
          # extension-import-ban + administration-route gates use.
          SKILL_CANONICALITY_BASE: ${{ steps.base.outputs.base }}
        run: node scripts/audit/skill-canonicality-gate.mjs

      - name: Skill-store canonicality gate tests
        run: pnpm exec vitest run scripts/audit/__tests__/skill-canonicality-gate.test.mjs

      # Route-graph ratchet gate (no-new-rot, cinatra#732). The locked
      # FIXED_ROUTES (dev-perf route set) each carry a committed
      # reachable-first-party-module-count ceiling in
      # scripts/audit/route-graph-ratchet.baseline.json; this fails CI when a
      # tracked route's first-party graph grows BEYOND its ceiling, when a
      # tracked route has unresolved first-party imports (missingCount > 0 —
      # fails closed, which is why it runs AFTER clone-extensions so the
      # companion graph resolves and reproduces the committed counts), and
      # (via the base-ref ratchet) when the committed baseline RAISES any
      # ceiling vs the base branch (blocks the regenerate-to-pass bypass).
      # Same base ref + no-new-rot shape as skill-canonicality / the
      # extension-import-ban gates above. The bare invocation (no flag) is the
      # enforce path; --report / --write-baseline are operator-only.
      - name: Route-graph ratchet gate (no-new-rot)
        env:
          # Monotonic ratchet: the committed baseline must not raise any ceiling
          # vs the base branch. Same base ref the sibling no-new-rot gates use.
          ROUTE_GRAPH_RATCHET_BASE: ${{ steps.base.outputs.base }}
        run: node scripts/audit/route-graph-ratchet.mjs

      - name: Route-graph ratchet gate tests
        run: node --test scripts/audit/__tests__/route-graph-ratchet.test.mjs

      # SKILL.md frontmatter validation (cinatra#494) + committed-mirror ban
      # (cinatra#495). Every host-committed SKILL.md under packages/ + src/ must
      # pass upstream-standard frontmatter validation (allowed top-level keys:
      # name, description, license, allowed-tools, metadata, compatibility —
      # Cinatra-specific keys like match_when live under metadata.*, read by the
      # Wave-0 dual-read in packages/skills/src/frontmatter.ts). It also fails if
      # any SKILL.md is committed under data/skill-store/ or extensions/ (both
      # gitignored, hydrated from canonical source) so a drift-prone runtime
      # mirror cannot be reintroduced. Dependency-free pure-node so it does not
      # need the package install.
      - name: Skill frontmatter + mirror-ban gate
        run: node scripts/audit/skill-frontmatter-gate.mjs

      - name: Skill frontmatter + mirror-ban gate tests
        run: node --test scripts/audit/__tests__/skill-frontmatter-gate.test.mjs

      # Extension dev-fixtures: every extension declaring `cinatra.devFixtures`
      # must ship a well-formed, declarative fixture file. The dev seeder is
      # fire-and-forget, so this static gate is the hard fail on a malformed file.
      - name: Extension dev-fixtures gate
        run: node scripts/audit/dev-fixtures-gate.mjs

      - name: Extension dev-fixtures gate tests
        run: pnpm exec vitest run scripts/audit/__tests__/dev-fixtures-gate.test.mjs

      # Connector access-config + packlist gate (cinatra#951): a PRESENT
      # cinatra/config.json must validate fail-closed (mirrors the SDK
      # access-config validator; the test below pins the two in agreement)
      # and must be packaged (package.json#files includes "cinatra");
      # absence WARNs until the W4 fleet configs land (then the closing
      # wave flips --require-present).
      - name: Connector access-config gate
        run: node scripts/audit/connector-access-config-gate.mjs

      - name: Connector access-config gate tests
        run: pnpm exec vitest run scripts/audit/__tests__/connector-access-config-gate.test.mjs

      # Verdaccio / registry.cinatra publish-EXECUTION ban gate.
      # Extensions publish ONLY through the marketplace proxy; the registry is
      # the install-backend behind a listing, never a publish target a workflow
      # drives. This standing gate fails CI if ANY workflow `run:` step EXECUTES
      # `npm/pnpm/yarn publish` (an ECHOED instruction string is allowed).
      # It ships exactly ONE ratified carve-out (ops#512 option A, owner decision
      # 2026-07-16): the hub registry-token-refresh CONSUMER PROOF
      # (verdaccio-publish-proof.yml). That carve-out is NOT a filename exemption
      # — the gate pins it to the EXACT canonical content of that workflow, so any
      # executable change (a second publish, a mutated package name, a redirected
      # registry, an added trigger) re-arms the ban. The workflow and the gate
      # move together. Companion tests guard the content-aware parser AND the
      # exception (real file exempt; every mutation re-armed).
      - name: Verdaccio publish-execution ban gate
        run: node scripts/audit/verdaccio-publish-ban.mjs

      - name: Verdaccio publish-execution ban gate tests
        run: pnpm exec vitest run scripts/audit/__tests__/verdaccio-publish-ban.test.mjs

      # Workspace phantom-dependency gate (no-new-rot ratchet). Flags a source
      # import of a first-party workspace package that the importing package's
      # package.json does not declare in any dependency bucket — it resolves only
      # via pnpm's hoisted node_modules + tsconfig paths, so tsgo/next build pass
      # while a clean `pnpm install --frozen-lockfile` (CI default) or extraction
      # to a standalone repo breaks. Baseline records current debt; fails on NEW.
      - name: Workspace phantom-dependency gate
        env:
          # Also fail if the committed baseline GREW vs the base branch (blocks
          # the regenerate-to-pass bypass). Same base ref the other no-new-rot
          # gates use.
          WORKSPACE_PHANTOM_DEPS_BASE: ${{ steps.base.outputs.base }}
        run: node scripts/audit/workspace-phantom-deps.mjs

      - name: Workspace phantom-dependency gate tests
        run: node --test scripts/audit/__tests__/workspace-phantom-deps.test.mjs

      # Workspace dependency-cycle gate (no-new-rot ratchet). Builds the directed
      # first-party dependency graph from each workspace member's package.json
      # deps, finds every strongly-connected component (Tarjan), and fails on any
      # cycle whose member-set is not in the committed baseline. The known cycles
      # are baselined (WARN/ratchet toward zero via one-directional `*-contracts`
      # extraction); a genuinely NEW cycle fails closed. Cycles force lazy
      # imports and block clean one-directional build/test ownership.
      - name: Workspace dependency-cycle gate
        env:
          # Also fail if the committed baseline GREW vs the base branch (blocks
          # the regenerate-to-pass bypass). Same base ref the other no-new-rot
          # gates use.
          WORKSPACE_DEP_CYCLES_BASE: ${{ steps.base.outputs.base }}
        run: node scripts/audit/workspace-dep-cycles.mjs

      - name: Workspace dependency-cycle gate tests
        run: node --test scripts/audit/__tests__/workspace-dep-cycles.test.mjs

      # File-size ratchet gate (no-new-rot ratchet). Pins the current
      # line count of each tracked architecture-bottleneck file (handlers,
      # drizzle-store, agents store, chat page, skills store, mcp-server entry,
      # background-jobs, database, extension-install pipeline, boot
      # instrumentation) as a per-file ceiling and fails CI when a tracked file
      # grows BEYOND its ceiling. It forces NO refactor (baselines are the
      # current sizes); it only prevents the listed hubs from growing further.
      # The baseline ratchets DOWN as extractions land (thin facades + vertical
      # slices). File-level sibling of the package-level dependency-cycle ratchet.
      - name: File-size ratchet gate
        env:
          # Also fail if the committed baseline RAISED any ceiling vs the base
          # branch (blocks the regenerate-to-pass bypass). Same base ref the
          # other no-new-rot gates use.
          WORKSPACE_FILE_SIZE_RATCHET_BASE: ${{ steps.base.outputs.base }}
        run: node scripts/audit/file-size-ratchet.mjs

      - name: File-size ratchet gate tests
        run: node --test scripts/audit/__tests__/file-size-ratchet.test.mjs

      # Execution-plane compose SCOPING gate. Asserts the two structural claims
      # the exec plane's containment argument rests on, against
      # docker-compose.exec.yml: every exec service is configured from its own
      # scoped env file (no app secret surface — a broker that can read the app
      # DB URL makes a broker compromise a database compromise), and the docker
      # socket (root on the host) is mounted on the worker and nowhere else.
      # Dependency-free `node --test`, same convention as the ratchet gates
      # above. Wired here because it previously ran in NO job: the suite is
      # carved out of the root vitest include (node:test files report "No test
      # suite found" under vitest) and no workflow pinned it, so the gate and
      # its 18 fixtures executed nowhere. The ci-pinned-tests-exist gate below
      # now fails closed on that combination.
      - name: Execution-plane compose scoping gate
        run: node scripts/audit/exec-compose-scoping-check.mjs

      - name: Execution-plane compose scoping gate tests
        run: node --test scripts/audit/__tests__/exec-compose-scoping-check.test.mjs

      # Pinned-test existence gate, both directions.
      #
      # PIN → FILE: `vitest run a b c` treats positionals as FILTERS — a
      # positional that matches zero files is SILENTLY ignored as long as the
      # others match, so a renamed/lost test leaves its pin behind and CI stays
      # green while advertising coverage it no longer has (this is exactly how
      # `extension-install-e2e.test.ts` went missing yet green). This gate fails
      # CI when a workflow pins a test file whose basename exists nowhere in the
      # tree.
      #
      # AUDIT SUITE → RUNNER: the inverse. Every scripts/audit/__tests__ suite
      # must be executed by something — the wholesale `pnpm test:root` include
      # or an explicit workflow runner pin. A suite that is excluded from the
      # root config AND pinned nowhere runs in no job at all, which is how the
      # exec-compose scoping suite above sat dark. The gate also flags a
      # literal-path exclusion in vitest.config.ts whose file no longer exists.
      - name: Pinned-test existence gate
        run: node scripts/audit/ci-pinned-tests-exist.mjs

      - name: Pinned-test existence gate tests
        run: pnpm exec vitest run scripts/audit/__tests__/ci-pinned-tests-exist.test.mjs --no-coverage

      # Cinatra design-system shadcn registry (`@cinatra-ai`),
      # generated from src/components/ui + cn (the single source of truth).
      # These gates keep the committed public/r and the vendored extension
      # primitives from drifting from that source, and prove a clean standalone
      # consumer can resolve + copy + import-rewrite + install registry items.
      # PINNED shadcn CLI (never @latest).
      - name: Design-system registry drift gate (public/r == fresh build)
        run: node scripts/extensions/build-design-registry.mjs --check

      - name: Vendored extension-primitive provenance gate
        run: node scripts/extensions/vendor-extension-primitives.mjs --check

      # --full also installs the copied source's declared deps + `tsc --noEmit`s
      # it (proves "the copied source typechecks", not merely "files copied"), and
      # asserts the explicit-add constraint negatively (`add field` alone must NOT
      # pull radix-ui). Needs python3 (present on ubuntu-latest) + npm egress.
      - name: Design-system registry clean-consumer smoke (explicit items + install + tsc)
        run: node scripts/extensions/registry-consumer-smoke.mjs --full

      # SDK ABI + tooling unit suites. These live in vitest.config.ts's
      # include globs but were NOT invoked by any CI step (the packages/agents
      # unit job only runs that package; the root src/ suite is otherwise ungated),
      # so these cases ran locally but never in CI. Run them explicitly here.
      # (license-cleanup + import-ban have their own gate-adjacent steps above.)
      - name: SDK ABI + CLI + inventory/manifest unit tests
        run: >-
          pnpm exec vitest run
          packages/sdk-extensions/src
          scripts/extensions/__tests__/inventory.test.mjs
          scripts/extensions/__tests__/generate-extension-manifest.test.mjs
          scripts/config/__tests__/generate-build-config.test.mjs
          scripts/extensions/__tests__/build-server-entry.test.ts
          scripts/extensions/__tests__/update-dev-extension-lock.test.mjs
          scripts/ci/__tests__/extension-pin-divergence-report.test.mjs
          scripts/ci/__tests__/resolve-prev-release-images.test.mjs
          scripts/extensions/__tests__/strip-comments.test.mjs
          scripts/extensions/__tests__/vendor-extension-primitives.test.mjs
          packages/cli/src/__tests__
          packages/migrations/src
          src/lib/__tests__/extension-host-context.test.ts
          src/lib/__tests__/extension-mcp-registry.test.ts
          src/app/campaigns/__tests__/linkedin-actions-extension-gate.test.ts
          src/app/campaigns/__tests__/apollo-actions-extension-gate.test.ts
          src/app/campaigns/__tests__/gmail-gcal-actions-extension-gate.test.ts
          src/app/campaigns/__tests__/wordpress-delete-action-extension-gate.test.ts
          src/app/campaigns/__tests__/nango-actions-extension-gate.test.ts
          src/app/campaigns/__tests__/github-actions-extension-gate.test.ts
          src/app/campaigns/__tests__/openai-skills-action-extension-gate.test.ts
          src/app/campaigns/__tests__/a2a-actions-extension-gate.test.ts
          src/app/campaigns/__tests__/google-oauth-action-extension-gate.test.ts
          src/app/campaigns/__tests__/anthropic-actions-extension-gate.test.ts
          src/lib/__tests__/connector-policy-infra-action.test.ts
          src/lib/__tests__/register-objects-provider.test.ts
          --no-coverage

      # Wholesale root Vitest suite — the gate of record for the root
      # `vitest.config.ts` include (src/**/__tests__, scripts/**/__tests__,
      # packages/cli, packages/sdk-extensions). Runs the
      # STABILIZED set: every file is fixed or carved out in vitest.config.ts
      # `test.exclude` (node:test files, the DB-integration tier, and the
      # documented quarantines). This closes the
      # ungated-root-suite gap below: a NEW src/**/__tests__ file is now
      # exercised by default — no per-file pin needed — and a new failure
      # turns this job red.
      - name: Root Vitest suite (wholesale — gate of record)
        run: pnpm test:root

      # Live Runtime Extension Installer. The per-file pins below are now
      # REDUNDANT belt-and-suspenders: the wholesale `test:root` step above runs
      # the full root include, so new src/lib tests are gated by default. The
      # explicit pins are retained as a defense-in-depth signal
      # (and to keep a fast, named failure surface for these critical files).
      - name: Runtime installer unit tests
        run: >-
          pnpm exec vitest run
          src/lib/__tests__/extension-package-store-core.test.ts
          src/lib/__tests__/extension-trust.test.ts
          src/lib/__tests__/extension-trust-config.test.ts
          src/lib/__tests__/extension-trust-caller-parity.test.ts
          src/lib/__tests__/runtime-package-loader-parity.test.ts
          src/lib/__tests__/extension-lifecycle-teardown-invariant.test.ts
          src/lib/__tests__/extension-host-port-grants.test.ts
          src/lib/__tests__/extension-action-dispatch.test.ts
          src/lib/__tests__/extension-install-pipeline.test.ts
          src/lib/__tests__/extension-install-pipeline-gatekept.test.ts
          src/lib/__tests__/extension-hot-install-activate.test.ts
          src/lib/__tests__/extension-dispatch-public-path.test.ts
          src/lib/__tests__/extension-store-gc.test.ts
          src/lib/__tests__/extension-snapshot-lease.test.ts
          src/lib/__tests__/extension-activation-routing.test.ts
          src/lib/__tests__/extension-schema-config.test.ts
          src/components/__tests__/schema-config-connector-form.test.tsx
          src/lib/__tests__/extension-install-ops.test.ts
          src/lib/__tests__/extension-install-resolution.test.ts
          src/lib/__tests__/connector-runtime-ui-resolve.test.ts
          src/lib/__tests__/connector-setup-pages-parity.test.ts
          src/lib/__tests__/connector-ui-render.test.ts
          src/lib/__tests__/connectors-registry-schema-config.test.ts
          src/lib/__tests__/schema-config-fixture.test.ts
          src/lib/__tests__/extension-migration-activation.test.ts
          src/lib/__tests__/extension-signature-backfill.test.ts
          src/lib/__tests__/cli-rich-schema-drift.test.ts
          src/lib/__tests__/extension-install-e2e.test.ts
          src/lib/__tests__/extension-install-first-party-e2e.test.ts
          src/lib/__tests__/extension-signature.test.ts
          src/lib/__tests__/extension-install-signed-e2e.test.ts
          scripts/extensions/__tests__/schema-config-validator-parity.test.ts
          --no-coverage

      # These four lines used to read
      #   cd packages/<x> && pnpm exec vitest run <file> --no-coverage && cd ../..
      # and NONE of them could turn this step red. GitHub runs a `run:` block
      # under `bash -e`, and errexit does NOT fire for a command inside an
      # `&&`-list: the list's own non-zero status is then discarded by the next
      # line, and the final line ends on a SUCCEEDING `cd ../..`, so its status
      # is 0 too. Measured, not inferred:
      #   bash -e -c 'cd /tmp && false && cd /'              → 1
      #   bash -e -c $'cd /tmp && false && cd /\ncd /tmp'    → 0
      # Four advertised pins that could not fail — found by cinatra#2439 while
      # building the packages/** SUITE → RUNNER guard, which has to model
      # exactly this to avoid crediting a runner that cannot red a check.
      #
      # `pnpm -C <dir>` runs each invocation in the package directory without a
      # `cd`, so every line is a SIMPLE command and errexit fires on it. All
      # four files are also covered wholesale now (packages/objects,
      # packages/registries by the `package-unit-suites` job; packages/dashboards
      # by dashboards-suite-gate.yml; packages/sdk-extensions by the root
      # include), so these pins are belt-and-suspenders — but a pin that cannot
      # fail is worse than no pin, because it reads as coverage.
      - name: Runtime installer package-scoped unit tests
        run: |
          pnpm -C packages/objects exec vitest run src/__tests__/registry-package-provenance.test.ts --no-coverage
          pnpm -C packages/dashboards exec vitest run src/extension/__tests__/cube-guard.test.ts --no-coverage
          pnpm -C packages/registries exec vitest run tests/resolve-dist-integrity.test.ts tests/registry-auth-options.test.ts tests/registry-auth.integration.test.ts --no-coverage
          pnpm -C packages/sdk-extensions exec vitest run src/__tests__/runtime-loader.test.ts --no-coverage

      # Seed-pack manifest parity tier (packages/objects). These four suites are
      # the ONLY host-side assertion that each seeded artifact extension's typed
      # manifest export still equals the `cinatra.artifact` block in its own
      # package.json — the manifest OF RECORD that the object-registry bridge
      # reads at boot — plus the matcher catalog-id shape, the exact
      # representation forms, and the LLM capability-registry guard on every
      # declared MIME. Host CI ran exactly ONE packages/objects file
      # (registry-package-provenance, pinned in the step above), so this tier had
      # no runner at all and could sit silently diverged from the extension
      # fleet; it only surfaced when a fleet-wide pin move made it green again.
      #
      # It rides THIS job rather than a job of its own deliberately. The tier is
      # sub-second of vitest (120 assertions over 4 files, ~0.7s; ~2s wall
      # including process start). A dedicated job would pay a fresh checkout, a
      # companion-extension clone and a full `pnpm install` — minutes of setup —
      # to run it, which is out of all proportion. This job already has the
      # PINNED extension tree on disk (clone-extensions, above) and node_modules
      # installed, so the marginal cost is one vitest process.
      #
      # NOT vacuous: this job carries no path filter and runs on every
      # non-docs-only, non-draft PR (the `detect` guard at the top of the job),
      # so every PR that can move an input runs the tier for real. The GROUNDED
      # input set is: packages/objects/** (the suites plus the manifest parser
      # and claim schema they call), packages/llm/**'s attachment capability
      # registry (what the per-MIME provider guard probes), and the dev/required
      # extension lock pins, which decide WHICH extension sources
      # clone-extensions puts on disk. The generated host maps
      # (src/lib/generated/extensions.server.ts and siblings) are deliberately
      # NOT in that set: these suites read each extension's package.json and its
      # typed export straight off the cloned tree, never through a generated
      # map. So a PR that moves ONLY a lock pin — touching no host source at
      # all — is enough to turn this step red, which is exactly the case the
      # tier existed for and never caught.
      #
      # Why four PINNED files and not `cd packages/objects && pnpm test`: the
      # rest of that package carries a pre-existing red baseline (the objects
      # MCP handler / bridge suites), so a whole-package invocation could not be
      # made required today. Pinning the parity tier gates what is green and
      # keeps the named failure surface tight; the pinned-test existence gate
      # (above) is what stops a pin from silently going stale.
      - name: Seed-pack manifest parity tier (packages/objects)
        working-directory: packages/objects
        run: >-
          pnpm exec vitest run
          src/__tests__/seed-pack-gtm-manifest.test.ts
          src/__tests__/seed-pack-content-manifest.test.ts
          src/__tests__/seed-pack-email-legal-manifest.test.ts
          src/__tests__/blog-image-artifact-manifest.test.ts
          --no-coverage

      # ── Extension suite discovery gate (cinatra#2288 slice 2) ──────────────
      #
      # REPLACES eight hand-listed per-package steps: apollo / nango / crm /
      # twenty (which were, until #2295, the ONLY extension suites any workflow
      # ran) plus openai / pdf / image / dashboard from #2295 itself.
      #
      # Hand-listing is what let the hole grow: a newly cloned extension, or a
      # new test file in an existing one, joined it BY DEFAULT because nobody
      # edited this file. cinatra#2288 measured the result — ~1,600 tests across
      # 30+ suites running in no gate anywhere, while every companion repo's own
      # ci.yml SKIPPED its tests on the written grounds that "the cinatra
      # monorepo runs these". The host `tsc` pass was the only thing that saw
      # those files, so it caught TYPE defects and nothing else
      # (openai-connector#75 → #76 is the concrete miss).
      #
      # The gate discovers every materialized package under extensions/, runs
      # each vitest suite from its own package dir under its OWN config — the
      # #2249 remedy (folding a tier into the root vitest include) does not
      # transfer here, because the root config would have to absorb 30+
      # divergent alias sets — and PRINTS A MANIFEST of every package with what
      # ran, so a truncated run cannot pass for a clean one. It fails on: a red
      # suite; an on-disk test file vitest never executed (a GREEN run can hide
      # this — wordpress-assistant-connector reported "2 passed" while a whole
      # wire-contract conformance suite went uncollected, found by this gate on
      # its first run); a companion repo that skips its tests while this gate
      # does not run them (cinatra#2288 AC6, enforced in the only place that can
      # prove it); and zero discovered packages — the clone-back-failed case,
      # the same fail-closed shape extension-conformance-gate.yml already uses.
      # Its carve-out ledger is named, PINNED and SHAPE-BOUND: an entry
      # tolerates ONE documented failure at ONE committed sha, the suite is
      # still run, and any drift from the recorded shape — worse, different, or
      # newly green — fails. Once the pin moves the entry stops applying at all
      # and the package is enforced like any other, so an exemption can neither
      # absorb a regression it was not written for nor outlive its defect. The
      # rules are unit-tested in
      # scripts/ci/__tests__/extension-suite-gate.test.mjs (57 cases, part of
      # the root suite), so they are gated independently of the fleet's state.
      #
      # RUNTIME — why EXTENSION_SUITE_JOBS. The 44 discovered suites are 2,149
      # tests. On the hosted runner this step measures 58s wall / 214.7s of
      # vitest at the 4-way concurrency pinned below, with ONE inner vitest
      # worker per package so the outer budget IS the budget; run one suite
      # after another the same work is ~215s, which against a job that already
      # took 10m17s of a 15-minute cap is most of the remaining margin. Hence
      # the concurrency, and hence `timeout-minutes` 15 → 18, reasoned above.
      # Concurrency is PINNED rather than derived from the runner's core count
      # so it cannot silently move when the runner label does. The gate prints
      # its own suite count and wall total every run, so this claim is checkable
      # against the log rather than trusted from here.
      #
      # Rides THIS job for the reason already recorded above for the seed-pack
      # tier: it already has the PINNED extension tree on disk
      # (clone-extensions) and node_modules installed, and it is a REQUIRED
      # status check whose `always()` + hard-fail guard shape means this gate
      # inherits "definitive, never a silent skip" rather than needing a new
      # required context.
      - name: Extension suites — discovery gate (every materialized suite)
        env:
          EXTENSION_SUITE_JOBS: '4'
        run: node scripts/ci/extension-suite-gate.mjs

      # ── The two remaining LLM provider connectors (cinatra#1705 AC4) ──────
      #
      # Both were dev-lock members when this block was written, so it left them
      # to slice 2 of cinatra#2288 (which names "anthropic 101" among the ~25
      # unwired suites). anthropic-connector has since been PROMOTED to the
      # required/system set (cinatra#2332 — the /setup/ai provider choice must be
      # selectable on a production image), so it is pinned by
      # cinatra-required-extensions.lock.json now; gemini-connector is still a
      # dev-lock member. Either way clone-extensions materializes both from
      # whichever lock owns them, so the two steps below are unchanged by that
      # move. They are pulled forward
      # here because the acceptance audit on cinatra#1705 rates AC4 — the
      # singular-native-shell battery — the epic's only MISSING row, and its
      # proof lane is to reinstate that battery CONNECTOR-SIDE, one file per
      # connector. openai-connector already has a runner (the step above); these
      # two did not, so two thirds of the reinstated battery would have been
      # written and then never executed by any CI — the same vacuity the #2288
      # header describes, arriving through a different door.
      #
      # These are the last two of the three provider adapters, so once the
      # battery-bearing pins land every provider request-translation surface is
      # gated. Both are green at their CURRENTLY pinned shas (measured on the
      # pinned tree: anthropic 110 tests, gemini 66, ~1s of vitest each), so this
      # wiring is not carrying a red baseline forward. It NARROWS #2288 slice 2
      # by two packages rather than pre-empting it — the other ~23 unwired
      # suites are untouched, and that issue's discovery loop (AC1) should
      # REPLACE these explicit steps, not duplicate them, when it lands.
      #
      # Whole-dir, from the package dir, so each package resolves its own test
      # configuration — gemini-connector ships a `vitest.config.ts` (package-local
      # `@/` + `server-only` aliases); anthropic-connector ships none and runs on
      # vitest's defaults, which already discover `src/__tests__/**`. Identical
      # shape and rationale to every step above, and load-bearing here: a
      # file-pinned invocation would silently drop the reinstated
      # `sandbox-provider-translation.test.ts` until someone edited this file
      # again. Whole-dir means the battery becomes enforced the moment the lock
      # pin moves to the commit that carries it — no further change here.
      - name: Anthropic connector tests
        run: cd extensions/cinatra-ai/anthropic-connector && pnpm exec vitest run --no-coverage

      - name: Gemini connector tests
        run: cd extensions/cinatra-ai/gemini-connector && pnpm exec vitest run --no-coverage

      # Admin-namespace route reference gate. Hardens the admin route rename.
      # Permanent 308 redirects preserve external bookmarks via next.config.ts;
      # this gate prevents new in-tree references from silently routing
      # through the redirect. Touch-ratchet via `ADMIN_ROUTE_DIFF_BASE`
      # so pre-existing main violations don't block follow-on PRs (a
      # finding on a line a PR DID NOT add is tolerated; a finding on a
      # line a PR ADDED blocks).
      - name: Administration route banned gate
        env:
          ADMIN_ROUTE_DIFF_BASE: ${{ steps.base.outputs.base }}
        run: node scripts/audit/administration-route-banned.mjs

      # Skill-read default-root containment guard. Bans regrowth of the
      # `allowedRoots` / `allowedReadRoots` plumbing that was removed when
      # the bridge moved to a catalog-only skill resolution path.
      - name: Skill-read default-root-only gate
        run: node scripts/audit/skill-read-default-root-only.mjs

      # `read_skill` function-tool retirement guard. The legacy fallback was
      # retired; reintroducing `createReadSkillTool` or any
      # `name: "read_skill"` function-tool shape reopens the catalog-bypass
      # surface and trips this gate.
      - name: read_skill function-tool banned gate
        run: node scripts/audit/read-skill-function-tool-banned.mjs

      # WordPress / Drupal connector package-name rename guard.
      # Bans new in-tree imports of the legacy `@cinatra-ai/wordpress-connector`
      # / `@cinatra-ai/drupal-connector` names. The packages live as
      # compatibility shims; this gate prevents new code from regrowing the
      # deprecated dependency surface.
      - name: WordPress/Drupal connector rename banned gate
        run: node scripts/audit/wordpress-drupal-connector-rename-banned.mjs

      # `/skills/packages` route-retirement guard. The package list +
      # detail routes were folded into the unified `/skills` list; this gate
      # bans the route string, the page mounts, the catch-all package branch,
      # and the literal route directory from reappearing.
      - name: Skills packages route banned gate
        run: node scripts/audit/skills-packages-route-banned.mjs

      # `/entity/skills` + `/profile/skills` route-retirement guard. Personal
      # skill CRUD moved into the unified `/skills` list (list via
      # ?scope=personal, new via /skills/new, edit via /skills/<id>/edit).
      # The gate bans the legacy route strings, the page mounts, the
      # EntityNavigation component, and the literal src/app/entity directory.
      - name: Entity skills route banned gate
        run: node scripts/audit/entity-skills-route-banned.mjs

      # Agents-status route-retirement guard. The standalone
      # agent-list table was retired; /agents is the single installed-agents
      # surface. Touch-ratchet via
      # `AGENTS_STATUS_ROUTE_DIFF_BASE` so pre-existing legacy refs don't
      # block follow-on PRs (a finding on a line a PR ADDED blocks).
      - name: Agents status route banned gate
        env:
          AGENTS_STATUS_ROUTE_DIFF_BASE: ${{ steps.base.outputs.base }}
        run: node scripts/audit/agents-status-route-banned.mjs

      # Data-new route-retirement guard. The standalone "New data
      # item" type-chooser was retired; /data/types is
      # the type browse + creation entry point. Touch-ratchet via
      # `DATA_NEW_ROUTE_DIFF_BASE`.
      - name: Data new route banned gate
        env:
          DATA_NEW_ROUTE_DIFF_BASE: ${{ steps.base.outputs.base }}
        run: node scripts/audit/data-new-route-banned.mjs

      # OAuth-application stale-table-name guard. The installed
      # @better-auth/oauth-provider plugin uses `public."oauthClient"`
      # (camelCase) — the legacy `oauth_application` reference was never
      # created by the migration. Any code referencing it at runtime would
      # silently fail on every boot. Strict gate (no allowlist) since
      # the existing references were scrubbed; the shared helper at
      # `src/lib/better-auth-oauth-client.ts` is the single source of
      # truth for new INSERT/DELETE call sites.
      - name: OAuth application stale-table banned gate
        run: node scripts/audit/oauth-application-banned.mjs

      # Analytics route-rename guard. The cost/usage/traces app routes
      # were renamed to /analytics/{llm,llm-usage,api}.
      # Package specifiers (@cinatra-ai/metric-cost-api,
      # @cinatra-ai/metric-usage-api) and MCP primitives (metric_cost_*,
      # metric_usage_*) are intentionally stable. Touch-ratchet via
      # `ANALYTICS_ROUTES_DIFF_BASE`.
      - name: Analytics routes banned gate
        env:
          ANALYTICS_ROUTES_DIFF_BASE: ${{ steps.base.outputs.base }}
        run: node scripts/audit/analytics-routes-banned.mjs

      # Configuration jobs-dashboard retirement guard. The Environment
      # "jobs" tab + QueueDash route were retired. Touch-ratchet via
      # `JOBS_DASHBOARD_DIFF_BASE`.
      - name: Configuration jobs-dashboard banned gate
        env:
          JOBS_DASHBOARD_DIFF_BASE: ${{ steps.base.outputs.base }}
        run: node scripts/audit/configuration-jobs-dashboard-banned.mjs

      # Design packages pack smoke.
      # Runs `pnpm pack` on @cinatra-ai/design + @cinatra-ai/sdk-ui and
      # verifies the produced tarballs contain the expected files and no
      # forbidden entries (node_modules/, .env*). This is the local smoke
      # that ships in CI without requiring a reachable production Verdaccio;
      # the actual publish-to-registry step is gated by registry-publish
      # credentials availability and ships at launch readiness.
      - name: Design packages pack smoke
        run: node scripts/audit/design-packages-pack-smoke.mjs

      # Canonical history-aware writer drift gate. Blocks any new DML against
      # cinatra.objects that bypasses @/lib/object-history/canonical-writer.ts.
      - name: Object-history writer drift gate
        run: node scripts/audit/objects-writer-drift-gate.mjs

      - name: Object-history writer drift gate tests
        run: pnpm exec vitest run scripts/audit/__tests__/objects-writer-drift-gate.test.mjs

      # Retention-policy completeness gate. Every versioned object type
      # must have a retention_policy declaration.
      - name: Retention policy completeness gate
        run: node scripts/audit/retention-policy-gate.mjs

      # Recurrence guard for the retention-policy gate: verifies the discovery
      # walk EXCLUDES test files (the bug class that flagged 22 test-fixture
      # types on main as "missing") + asserts the namespaced declarations are
      # present.
      - name: Retention policy gate tests
        run: pnpm exec vitest run scripts/audit/__tests__/retention-policy-gate.test.mjs

      # MutationResult rollout gate. Fails when a NEW object-write server action
      # is unclassified, when the write-surface inventory is stale, or when a
      # MIGRATED surface drops the MutationResult contract. PENDING redirect-form
      # CRUD is tracked via per-area follow-up PRs with browser UAT.
      - name: MutationResult rollout gate
        run: node scripts/audit/mutation-result-rollout-gate.mjs

      - name: MutationResult rollout gate tests
        run: pnpm exec vitest run scripts/audit/__tests__/mutation-result-rollout-gate.test.mjs

      # Unit tests for the object-history substrate + restore engine
      # eligibility logic. Runs in the same job since it's small + shares the
      # install above. Covers freshness probe, CMS retry, and
      # change_set_list filters.
      - name: Object-history unit tests
        run: pnpm exec vitest run src/lib/object-history

      # Data-safety UI server-action + helper unit tests
      # (undo lookup, restore action, MutationResult/UndoToast, freshness/
      # attempts actions, retention badge, URL params). Also pins the
      # SearchParamToast flash-message island (the skills delete-race fix's
      # redirect→toast handoff), which lives under src/components/__tests__ and
      # is otherwise not in any pinned CI step.
      - name: Data-safety UI unit tests
        run: pnpm exec vitest run src/components/data-safety src/components/__tests__/search-param-toast.test.tsx

      # Authz inventory/classification drift gate (the new
      # data-safety MCP primitives must stay classified).
      - name: Authz inventory drift gate
        run: pnpm exec vitest run src/lib/authz/__tests__/drift-gate.test.ts

  # RBAC browser e2e — builds the app and boots the production (standalone)
  # server against a Postgres + Redis service container, runs Playwright. The
  # unit-level resolver matrix (src/lib/authz/__tests__/resolver-matrix.test.ts)
  # is the primary CI proof of resolver correctness and runs in the
  # `rbac-authz-unit` job above; this is the representative end-to-end arm
  # covering permissions, role, and extension authorization surfaces in a real
  # hydrated browser.
  # Intentionally NOT a `needs:` of `build` — image publish stays decoupled from
  # browser-test cadence. This is a REQUIRED status check on `main`: it always
  # runs (`if: always()`) so the check reports on every PR, the `detect` guard
  # fails it RED if detection broke, and a docs-only PR green-stubs in seconds
  # with no service containers started.
  e2e-rbac:
    name: RBAC browser e2e
    needs: detect
    if: ${{ always() }}
    # Opt-in larger-runner lever — same mechanism the `build` job already uses.
    # Unset keeps `ubuntu-latest` (zero-risk default). Set the org/repo variable
    # CI_BUILD_RUNNER (e.g. `ubuntu-latest-4-cores`, 16GB) AFTER confirming
    # availability with `runner-probe.yml` to move this memory-heavy production
    # build off the 2-vCPU/7GB runner — where `pnpm build` (3GB heap) + the
    # job-level postgres/redis sidecars OOM/swap-thrash and the runner gets
    # RECLAIMED mid-build. Rollback is a variable flip, not a code revert.
    runs-on: ${{ vars.CI_BUILD_RUNNER || 'ubuntu-latest' }}
    # Dev-mode (Turbopack) compiles each route segment cold on first hit (the
    # permissions page alone took ~60s). With route pre-warming below the suite
    # fits comfortably, but keep generous headroom over the default.
    timeout-minutes: 45
    services:
      postgres:
        image: ${{ needs.detect.result == 'success' && needs.detect.outputs.skip != 'true' && 'postgres:18' || '' }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: ${{ needs.detect.result == 'success' && needs.detect.outputs.skip != 'true' && 'redis:8' || '' }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      SUPABASE_SCHEMA: cinatra
      REDIS_URL: redis://127.0.0.1:6379
      BETTER_AUTH_SECRET: rbac-e2e-secret-do-not-use-in-prod-xxxxxxxxxxxxxxxxxxxxxxxxxxx
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      OPENAI_API_KEY: sk-test-placeholder
      CINATRA_RUNTIME_MODE: development
      A2A_DEV_BYPASS: "true"
      # A fresh CI instance has no instance-identity / Nango / OpenAI setup
      # rows, which would redirect every authenticated route to /setup.
      # The suite tests app surfaces, not the wizard — skip the setup gate.
      CINATRA_E2E_SETUP_BYPASS: "true"
    steps:
      - name: Guard — detect must have succeeded
        if: ${{ needs.detect.result != 'success' }}
        run: |
          echo "::error::detect job did not succeed (result=${{ needs.detect.result }}); failing this required check rather than passing it silently."
          exit 1

      - name: Docs-only stub
        if: ${{ needs.detect.outputs.skip == 'true' }}
        run: echo "Docs-only or draft PR — reporting RBAC browser e2e as a green stub (the real suite runs on code/mixed PRs)."

      - if: ${{ needs.detect.outputs.skip != 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        if: ${{ needs.detect.outputs.skip != 'true' }}
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        if: ${{ needs.detect.outputs.skip != 'true' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Clone companion extension repos
        if: ${{ needs.detect.outputs.skip != 'true' }}
        uses: ./.github/actions/clone-extensions

      - name: Install dependencies
        if: ${{ needs.detect.outputs.skip != 'true' }}
        run: pnpm install --frozen-lockfile

      # Cache the Playwright browser download (~175 MiB chromium + ffmpeg +
      # headless-shell). Pinned to the @playwright/test version via the
      # lockfile hash so a version bump invalidates the cache. Saves
      # 30-90s per e2e job when warm.
      - name: Cache Playwright browsers
        if: ${{ needs.detect.outputs.skip != 'true' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Playwright Chromium
        if: ${{ needs.detect.outputs.skip != 'true' }}
        run: pnpm exec playwright install --with-deps chromium

      # Reuse Next.js's incremental build cache across runs. Keyed by
      # lockfile + next.config.ts (so a config bump invalidates) and primed
      # by the most-recent matching restore-key. Saves 1-3 min on `pnpm build`
      # when warm.
      - name: Cache Next.js build cache
        if: ${{ needs.detect.outputs.skip != 'true' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: nextjs-prod-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'next.config.ts') }}-${{ github.sha }}
          restore-keys: |
            nextjs-prod-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'next.config.ts') }}-
            nextjs-prod-${{ runner.os }}-

      - name: Provision Better Auth tables (public schema)
        if: ${{ needs.detect.outputs.skip != 'true' }}
        # The cinatra schema DDL is owned by ensurePostgresSchema (runs on
        # first server query), but Better Auth's tables in `public.*`
        # (user/session/member/organization/...) are managed separately. On a
        # fresh CI Postgres, the dev server's instrumentation hook fails with
        # `relation "public.user" does not exist` until we provision them.
        #
        # We apply a committed, idempotent snapshot of the public schema
        # (tests/e2e/rbac/fixtures/public-schema.sql, generated by
        # scripts/dump-public-schema.mjs) rather than the better-auth migrate
        # CLI: the CLI bundles auth.ts + its whole import graph and statically
        # refuses any `import "server-only"` in the tree (it lives in a
        # transitive dep — better-auth/next-js — not auth.ts itself), so it is
        # unusable in CI without mutating node_modules.
        run: node scripts/apply-public-schema.mjs

      - name: Add CI build swap (default-runner only)
        # Best-effort, default-runner ONLY (skipped when CI_BUILD_RUNNER moves this
        # job to a larger runner). Subshell-guarded so a swap-setup failure NEVER
        # fails the build — it falls back to today's behavior.
        # 12G target (was 4G; PR #1746 briefly overshot to 20G, which ate the
        # docker build's root disk and ENOSPC-failed PR #1756 -- so the image
        # build now FREES disk instead of swapping, and these memory-bound build
        # jobs cap swap at 12G behind a 12G disk margin). The entry-66 CI-memory
        # investigation (2026-07-17): the modern ubuntu-latest runner is
        # 4 vCPU / 15.8G RAM, but the fleet's DISK is heterogeneous (entry-66
        # measured ~86G-free AND ~15G-free root disks the same day), so the
        # script below sizes the swapfile to the disk it actually gets. A
        # heavy-but-BOUNDED `pnpm build` (Turbopack NATIVE memory -- the JS heap
        # stays tiny, so NODE_OPTIONS cannot cap it) peaked at ~33G total on the
        # PRE-fix tree; the #1747/#1748 static-import fixes have since bounded it
        # well under RAM + stock + a modest swap, so 12G (+3G stock) is ample and
        # leaves the disk headroom the 20G cap did not. Swap only helps BOUNDED
        # builds: an UNBOUNDED Turbopack runaway (the server-side dynamic-import
        # detonation entry-66 root-caused -- >33G and still climbing) fills any
        # swap and still reclaims the runner; that class needs the content fix,
        # not more swap.
        if: ${{ needs.detect.outputs.skip != 'true' && vars.CI_BUILD_RUNNER == '' }}
        run: |
          set -uxo pipefail
          # Genuinely fail-fast via && (set -e is a no-op in an `if` condition); the
          # if/else makes it best-effort — any failure exits the step 0 with a warning.
          # Disk-aware: pick the roomier of / and the /mnt temp disk, cap the
          # size to what fits behind a 12G disk margin, and ALWAYS remove a
          # partial file on failure — a swapfile that fills the disk kills the
          # build on ENOSPC, strictly worse than no swap.
          # Genuinely best-effort from here: +e (Actions invokes bash -e) so no
          # discovery/diagnostic hiccup can fail the build; explicit exit 0 at
          # the end. The && chain still gates the success path; every var the
          # arithmetic reads is defaulted so set -u cannot abort either.
          set +e
          target=/
          free_kb=$(df -Pk / 2>/dev/null | awk 'NR==2{print $4}'); free_kb=${free_kb:-0}
          if [ -d /mnt ]; then
            mnt_kb=$(df -Pk /mnt 2>/dev/null | awk 'NR==2{print $4}'); mnt_kb=${mnt_kb:-0}
            if [ "$mnt_kb" -gt "$free_kb" ]; then target=/mnt; free_kb=$mnt_kb; fi
          fi
          SWAPFILE="${target%/}/swapfile-ci-build"
          size_kb=$(( free_kb - 12*1024*1024 )); want_kb=$(( 20*1024*1024 ))
          if [ "$size_kb" -gt "$want_kb" ]; then size_kb=$want_kb; fi
          if [ "$size_kb" -lt $(( 2*1024*1024 )) ]; then
            echo "::notice::CI build swap skipped — under 2G swap headroom on $target (free: $(( free_kb / 1024 / 1024 ))G)"
          elif { sudo fallocate -l "${size_kb}K" "$SWAPFILE" || { sudo rm -f "$SWAPFILE"; sudo dd if=/dev/zero of="$SWAPFILE" bs=1M count=$(( size_kb / 1024 )); }; } \
            && sudo chmod 600 "$SWAPFILE" \
            && sudo mkswap "$SWAPFILE" \
            && sudo swapon "$SWAPFILE"; then
            swapon --show || true; free -h || true; df -h "$target" || true
          else
            echo "::warning::CI build swap setup failed — removing any partial swapfile and proceeding without extra swap (today's behavior)"
            sudo rm -f "$SWAPFILE" || true
          fi
          exit 0

      - name: Build app (production)
        if: ${{ needs.detect.outputs.skip != 'true' }}
        # Run the suite against a production build, not `pnpm dev`. Turbopack
        # dev compiles each route cold on first hit, which made the suite
        # exhaust runner resources mid-run (the heaviest authorization test
        # repeatedly killed the job). A prebuilt server serves routes instantly
        # with low, steady memory — fast and stable. The build does no real DB
        # I/O (postgres-sync no-ops under NEXT_PHASE=phase-production-build); the
        # job env supplies the placeholder OPENAI_API_KEY + SUPABASE_DB_URL the
        # build needs.
        #
        # Step-level cap: catch a memory-thrash HANG fast instead of eating the
        # 45-min job cap. Bumped 15 -> 20: a healthy cold-CI build now runs
        # ~10-15 min (the app grew past the old ~8-min assumption, so a 15-min cap
        # FALSE-cancelled legitimately-slow-but-healthy builds on contended runners
        # — observed here as a flaky e2e). 20 keeps headroom under the 45-min job
        # cap for server-wait + the ~13-min Playwright budget while still failing a
        # true hang well before the job cap.
        timeout-minutes: 20
        env:
          # ~3GB worker heap. 4096 over-committed on this 7GB runner alongside the
          # postgres sidecar (swap-thrash → hang); the default ~2GB OOMs. 3072 is
          # the stable middle that GCs cleanly instead of thrashing.
          NODE_OPTIONS: --max-old-space-size=3072
        run: pnpm build

      - name: Start production server on port 3000
        if: ${{ needs.detect.outputs.skip != 'true' }}
        # next.config sets `output: "standalone"`, so `next start` won't serve;
        # run the standalone server exactly like the Dockerfile (server.js +
        # static/public copied alongside it).
        run: |
          cp -r .next/static .next/standalone/.next/static
          [ -d public ] && cp -r public .next/standalone/public || true
          (cd .next/standalone && PORT=3000 HOSTNAME=0.0.0.0 node server.js > /tmp/dev.log 2>&1) &
          echo "prod server launched as PID $!"

      - name: Wait for server ready (prod boot + DB schema provisioning)
        if: ${{ needs.detect.outputs.skip != 'true' }}
        # The instrumentation hook provisions the cinatra schema on first query;
        # poll /api/auth/get-session which is light + cached after first hit.
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/auth/get-session --max-time 5 2>/dev/null || echo 000)
            if [ "$code" = "200" ]; then echo "server ready after ${i} × 5s"; exit 0; fi
            sleep 5
          done
          echo "::error::server did not become ready in 5 min"
          tail -200 /tmp/dev.log
          exit 1

      - name: Run RBAC Playwright e2e
        # E2E_REUSE_SERVER=1 tells the rbac config to reuse our already-booted
        # dev server even in CI (keeps the github reporter + retries enabled).
        #
        # Wrapped in `timeout` (SIGTERM at 13m, SIGKILL 60s later) so a hung
        # suite can't burn the whole job AND — crucially — the step always
        # exits 0 so the artifact-upload steps below run as ordinary steps. A
        # job-level cancellation/timeout skips even `always()` cleanup, which
        # left earlier runs with no diagnostics. The captured exit code is
        # asserted at the end so the job still fails on test failure.
        if: ${{ needs.detect.outputs.skip != 'true' }}
        id: e2e
        env:
          E2E_BASE_URL: http://localhost:3000
          E2E_PORT: "3000"
          E2E_REUSE_SERVER: "1"
        run: |
          set +e
          timeout --kill-after=60 780 pnpm test:e2e:rbac
          code=$?
          echo "code=${code}" >> "$GITHUB_OUTPUT"
          echo "playwright exited with ${code}"
          exit 0

      - name: Upload Playwright report
        # always() so a signal-killed ("cancelled") Playwright step still uploads
        # — failure()/cancelled() are both false when a step is killed inside an
        # otherwise-successful workflow, which skipped these before. Also gated on
        # a real (non-docs) run so the stub path uploads nothing.
        if: ${{ always() && needs.detect.result == 'success' && needs.detect.outputs.skip != 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rbac-playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

      - name: Upload dev server log
        if: ${{ always() && needs.detect.result == 'success' && needs.detect.outputs.skip != 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rbac-dev-server-log
          path: /tmp/dev.log
          retention-days: 7

      - name: Assert RBAC e2e passed
        # Fail the job on test failure / timeout, after artifacts are uploaded.
        # A heavy step (reads steps.e2e.outputs.code): gated on a real run so the
        # docs-only stub path does not see an empty code and go falsely RED.
        if: ${{ needs.detect.outputs.skip != 'true' }}
        run: |
          code="${{ steps.e2e.outputs.code }}"
          if [ "$code" != "0" ]; then
            echo "::error::RBAC e2e failed or timed out (exit ${code})"
            exit 1
          fi
          echo "RBAC e2e passed"

  build:
    # Gate the image build on the test job so a failing typecheck or unit-test
    # run blocks publishing the image, including the `latest` tag on main.
    # Without `needs: test`, a regression would still produce a published image.
    # `needs: detect` is added so a docs-only PR skips the build entirely (the
    # `skip` gate below has no value without that edge); the publish-after-
    # test dependency is preserved.
    # `a2a-unit` (cinatra#2226) joins for the same reason `skills-unit` did: it is
    # the ONLY CI runner for packages/a2a, and coupling it here is what makes it a
    # merge gate WITHOUT adding a branch-protection context.
    # `execution-plane-unit` (cinatra#2316) joins on the identical footing: it is
    # the ONLY CI runner for the packages/execution-plane unit tier.
    # `package-unit-suites` (cinatra#2439) joins on the identical footing again:
    # it is the ONLY CI runner for the unit suites of eighteen workspace
    # packages — packages/llm, packages/chat, packages/objects,
    # packages/registries and the rest — which until this change executed in no
    # workflow at all.
    needs: [detect, test, skills-unit, a2a-unit, execution-plane-unit, package-unit-suites, hosted-mcp-wire-gate]
    # Run even when a prerequisite (`detect`/`test`/`skills-unit`/`a2a-unit`/`execution-plane-unit`/`package-unit-suites`) FAILED, so the guard step
    # below reports a definitive job FAILURE instead of a SKIP. GitHub can count a
    # skipped required check as successful, so a failed `test` merely *skipping*
    # `build` would NOT block a merge gated on the build status. The guard closes
    # that hole with zero success-path latency (it no-ops when prerequisites
    # pass). Docs-only and draft PRs (detect succeeded + skip) still skip the build.
    if: ${{ always() && (needs.detect.result != 'success' || needs.detect.outputs.skip != 'true') }}
    # The `build` job (docker buildx build + next build) is the workflow's long
    # pole (~10-11 min, mostly `next build` on a 2-vCPU runner). To accelerate it,
    # set the org/repo variable CI_BUILD_RUNNER to a larger label (e.g.
    # `ubuntu-latest-4-cores`) AFTER confirming availability with the manual
    # `runner-probe.yml` workflow. Unset (the default) keeps `ubuntu-latest`, so
    # this is a zero-risk no-op until the variable is set, and rollback is a
    # variable flip — not a code revert. There is no in-job fallback for an
    # unavailable runner label (runner selection precedes all steps), hence the
    # probe-first discipline.
    runs-on: ${{ vars.CI_BUILD_RUNNER || 'ubuntu-latest' }}
    # Bound the worst-case slow-runner hang. Typical wall-clock is ~10-11 min
    # for the image build (next build is the dominant pole) plus ~3-5 min for
    # the prod-boot e2e (image load + fresh-DB setup + boot + probes); we've
    # seen occasional 25-30 min hangs on contended runners. 30 min is generous
    # over normal and surfaces a real stall as a job failure (artifacts/logs
    # preserved) instead of letting it eat the workflow budget invisibly. Same
    # defensive class as the RBAC globalTimeout.
    timeout-minutes: 30
    steps:
      # Hard-fail the build (definitive RED, never a non-failing "skip") when a
      # prerequisite gate did not pass — the type-safety enforcement for the
      # CI-only in-build-tsc skip (see the `test` job). No-ops on the success path.
      - name: Guard prerequisite gates (detect + test + skills-unit + a2a-unit + execution-plane-unit + package-unit-suites + hosted-mcp-wire-gate)
        if: ${{ needs.detect.result != 'success' || needs.test.result != 'success' || needs['skills-unit'].result != 'success' || needs['a2a-unit'].result != 'success' || needs['execution-plane-unit'].result != 'success' || needs['package-unit-suites'].result != 'success' || needs['hosted-mcp-wire-gate'].result != 'success' }}
        run: |
          echo "::error::Prerequisite gate failed — detect=${{ needs.detect.result }} test=${{ needs.test.result }} skills-unit=${{ needs['skills-unit'].result }} a2a-unit=${{ needs['a2a-unit'].result }} execution-plane-unit=${{ needs['execution-plane-unit'].result }} package-unit-suites=${{ needs['package-unit-suites'].result }} hosted-mcp-wire-gate=${{ needs['hosted-mcp-wire-gate'].result }}. Refusing to build the image."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No clone-extensions here: the image build acquires the required-
      # extension set INSIDE `docker build` from the committed
      # cinatra-required-extensions.lock.json (SHA-pinned codeload tarballs,
      # integrity-verified — see the Dockerfile acquire step). The build
      # context deliberately excludes extensions/ (.dockerignore), so the
      # published image content is pinned by the lock, not by main-tip clones.
      # The test/gate jobs above keep their clone-back (they validate the
      # tracking tree). The prod-boot e2e step below then BOOTS that image and
      # asserts it serves — proving the no-private-extensions path end to end
      # (issue #81), not just at build/typecheck level.

      - name: Free runner disk for the image build (default-runner only)
        # entry-66 DISK-regression fix (PR #1756): this docker-buildx job died
        # with "no space left on device" mid-build because PR #1746's swapfile
        # landed on the same root disk buildkit writes its layers + the mode=max
        # gha cache export to (the failing run had only ~6G left on / after a
        # 9.4G swapfile, while RAM was 14Gi FREE -- the bottleneck HERE is DISK,
        # not memory). The #1747/#1748 static-import fixes already bounded the
        # Turbopack memory class, so this job needs disk headroom, not swap:
        # DROP the swapfile and instead reclaim the ~25-30G of preinstalled
        # toolchains this job never uses (plus the preloaded docker images)
        # BEFORE the build. Best-effort -- a prune hiccup never fails the job.
        if: ${{ vars.CI_BUILD_RUNNER == '' }}
        run: |
          set -uxo pipefail
          set +e
          echo "disk before prune:"; df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker system prune -af
          echo "disk after prune:"; df -h /
          exit 0

      - name: Add CI build swap (default-runner only, after the disk prune)
        # Cold-cache OOM fix (issue #1758 follow-up, folded into #1759). The
        # docker-buildx build below runs `pnpm build` (Turbopack) INSIDE buildkit;
        # a COLD `next build` peaks ~33G, above the default runner's 15.8G RAM +
        # ~3G stock swap, so buildkit is reclaimed mid-compile. The failing head-
        # of-lane run logged `Creating an optimized production build ...` ->
        # `[ELIFECYCLE] Command failed.` (118.9s) -> `ResourceExhausted: ... pnpm
        # build did not complete successfully: cannot allocate memory` (run
        # 29612773246, `build` job). #1757 DROPPED this job's swapfile (see the
        # prune step above) because PR #1746's 20G swapfile shared the root disk
        # buildkit writes its layers + mode=max gha cache to and ENOSPC-killed
        # #1756 (~6G left after a 9.4G swapfile, with NO prune). Both conditions
        # behind that ENOSPC are gone now: (1) the prune above runs FIRST and
        # reclaims ~23G (this run: / 19G->42G avail), and (2) this step sizes the
        # swapfile at min(20G, free-12G) on the ROOMIER of / and the /mnt temp
        # disk, so it ALWAYS leaves >=12G free on the chosen disk. On a roomy
        # runner (~96G avail post-prune) a 20G swapfile leaves ~76G, above the
        # ~73G baseline docker builds were historically green under, so #1757's
        # ENOSPC structurally cannot recur — while 15.8G RAM + 20G swap (~35.8G)
        # clears the ~33G cold peak. Byte-identical best-effort/fail-open script
        # to the four memory-bound jobs' swap step (subshell-guarded, partial-
        # file cleanup on failure, swapon --show/df -h diagnostics); skipped when
        # CI_BUILD_RUNNER moves this job to a larger runner.
        if: ${{ vars.CI_BUILD_RUNNER == '' }}
        run: |
          set -uxo pipefail
          # Genuinely fail-fast via && (set -e is a no-op in an `if` condition); the
          # if/else makes it best-effort — any failure exits the step 0 with a warning.
          # Disk-aware: pick the roomier of / and the /mnt temp disk, cap the
          # size to what fits behind a 12G disk margin, and ALWAYS remove a
          # partial file on failure — a swapfile that fills the disk kills the
          # build on ENOSPC, strictly worse than no swap.
          # Genuinely best-effort from here: +e (Actions invokes bash -e) so no
          # discovery/diagnostic hiccup can fail the build; explicit exit 0 at
          # the end. The && chain still gates the success path; every var the
          # arithmetic reads is defaulted so set -u cannot abort either.
          set +e
          target=/
          free_kb=$(df -Pk / 2>/dev/null | awk 'NR==2{print $4}'); free_kb=${free_kb:-0}
          if [ -d /mnt ]; then
            mnt_kb=$(df -Pk /mnt 2>/dev/null | awk 'NR==2{print $4}'); mnt_kb=${mnt_kb:-0}
            if [ "$mnt_kb" -gt "$free_kb" ]; then target=/mnt; free_kb=$mnt_kb; fi
          fi
          SWAPFILE="${target%/}/swapfile-ci-build"
          size_kb=$(( free_kb - 12*1024*1024 )); want_kb=$(( 20*1024*1024 ))
          if [ "$size_kb" -gt "$want_kb" ]; then size_kb=$want_kb; fi
          if [ "$size_kb" -lt $(( 2*1024*1024 )) ]; then
            echo "::notice::CI build swap skipped — under 2G swap headroom on $target (free: $(( free_kb / 1024 / 1024 ))G)"
          elif { sudo fallocate -l "${size_kb}K" "$SWAPFILE" || { sudo rm -f "$SWAPFILE"; sudo dd if=/dev/zero of="$SWAPFILE" bs=1M count=$(( size_kb / 1024 )); }; } \
            && sudo chmod 600 "$SWAPFILE" \
            && sudo mkswap "$SWAPFILE" \
            && sudo swapon "$SWAPFILE"; then
            swapon --show || true; free -h || true; df -h "$target" || true
          else
            echo "::warning::CI build swap setup failed — removing any partial swapfile and proceeding without extra swap (today's behavior)"
            sudo rm -f "$SWAPFILE" || true
          fi
          exit 0

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # Build → boot-gate (issue #81). The image is FIRST built and loaded into
      # the local docker daemon, then booted by the prod-boot e2e below. This
      # `build` job is now PUBLISH-FREE: it logs in to nothing and pushes
      # nothing. It runs on EVERY trigger (PR / merge_group / push / dispatch)
      # to prove the boots-without-private-extensions path before merge, and its
      # `cache-to: type=gha,mode=max` below populates the shared gha cache so the
      # downstream publish jobs re-export from cache instead of rebuilding. The
      # GHCR push and the prod-deploy dispatch moved OUT of this job (the
      # build-image e2e-split) — see the `publish-nonrelease-image`,
      # `publish-release-image`, and `release-dispatch` jobs below. Keeping
      # build+e2e here ungated means ordinary PR/merge_group/branch builds never
      # pause for approval; only the release publish + prod-deploy pause behind
      # the `release-approval` Environment.
      - name: Build image (load for prod-boot e2e)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: cinatra-prod-boot-e2e:ci
          # Forward CI=true so the Dockerfile's `next build` skips the redundant
          # in-build tsc (types are gated by the required Typecheck job). Only set
          # here, in CI — a local `docker build` (no build-arg) keeps the check.
          # MUST stay identical on the push step below so its cache hit is total.
          build-args: |
            CI=true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Boot the image WITHOUT private extensions cloned (the checkout above
      # has no extensions/ tree at all): fresh Postgres + Redis on an isolated
      # docker network, one-shot `cinatra setup prod`, the standalone app
      # container, /api/health gate, page-render smoke, and data-driven
      # fresh-DB anchor assertions. See scripts/ci/prod-boot-e2e.sh.
      - name: Prod-boot e2e — boot the core without private extensions
        env:
          IMAGE: cinatra-prod-boot-e2e:ci
        run: bash scripts/ci/prod-boot-e2e.sh

  # ---------------------------------------------------------------------------
  # build-image e2e-split: the GHCR image PUSH and the prod-deploy dispatch
  # moved OUT of the ungated `build` job into the three jobs below.
  # `build` (above) still runs the prod-boot e2e on EVERY trigger and is the
  # merge gate — it just no longer publishes. The publish surfaces are now
  # split by event so that ONLY the v*-tag release path pauses for owner
  # approval while ordinary builds (and the routine main-branch `:latest`
  # publish) stay ungated:
  #
  #   publish-nonrelease-image  — UNGATED. push-to-main + workflow_dispatch
  #     (NON-v*-tag) GHCR publish. Preserves the prior main-branch `:latest`
  #     publish behavior byte-for-byte; the Docker Hub mirror keys off GHCR
  #     `:latest`, so this MUST stay ungated.
  #   publish-release-image     — GATED (environment: release-approval). The
  #     v*-tag GHCR image publish. A release artifact, so it pauses for the
  #     owner before it publishes. ALSO gated on the `upgrade-proof` job below
  #     via `needs`: an image that cannot schema-sync an existing
  #     previous-release database never even reaches the approval pause.
  #   release-dispatch          — GATED (environment: release-approval). Fires
  #     the cross-repo `cinatra-release-published` repository_dispatch to ops
  #     that triggers the prod deploy. The real outward release action — paused.
  #
  # All three re-export from the gha cache that `build` populated
  # (cache-to: type=gha,mode=max), so none of them rebuilds the image; they are
  # pure cache re-exports gated on `needs: build` (so the boot-e2e still gates
  # every publish). None is a REQUIRED status check — the required checks
  # (detect/test/e2e-rbac) are untouched, so a PR's mergeability is unaffected;
  # on a PR/merge_group run all three are skipped by their `if:`.
  # ---------------------------------------------------------------------------

  # UNGATED non-release publish: main-branch `:latest` + branch/sha tags +
  # workflow_dispatch image publish. This is the prior `build`-job `Push image`
  # step's exact event allowlist (`push || workflow_dispatch`) MINUS v*-tag
  # pushes (those go through the GATED `publish-release-image` below). Splitting
  # this out keeps the routine main-push `:latest` publish — which the Docker
  # Hub mirror depends on — running with ZERO behavior change and ZERO approval
  # pause.
  publish-nonrelease-image:
    name: Publish image (non-release)
    needs: build
    # Same publish allowlist as the prior in-`build` Push step, EXCLUDING v*
    # tags (handled by the gated release job). A non-tag push to main, a
    # non-v* tag push, or a manual workflow_dispatch publishes here, ungated.
    if: ${{ (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/v')) || github.event_name == 'workflow_dispatch' }}
    runs-on: ${{ vars.CI_BUILD_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to GHCR
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=sha,format=long,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      # Pure cache re-export — `build` populated type=gha,mode=max, so no layer
      # is rebuilt. Identical build-args (CI=true) to the load build keep the
      # cache hit total.
      - name: Push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CI=true
          cache-from: type=gha

  # ---------------------------------------------------------------------------
  # upgrade-proof — the release recurrence barrier for the prod schema-sync
  # failure class (cinatra#1136): before a release image may publish, prove the
  # JUST-BUILT candidate image can `setup prod` a database provisioned by each
  # of the two most recent PUBLISHED releases. The incident this bars: an image
  # whose own setup runs the versioned migration chain BEFORE its bootstrap DDL
  # boots fine on a FRESH database (the prod-boot e2e in `build` above) yet
  # aborts the prod deploy on every EXISTING database. The harness
  # (scripts/ci/upgrade-proof.sh in CANDIDATE_IMAGE mode) exercises the exact
  # ops deploy sequence: the previous image's setup on a fresh DB, seeded
  # data-bearing rows, then the candidate image's OWN `setup prod` through its
  # deploy-compat forwarder, with ledger/data-preservation/idempotency
  # assertions. Previously this harness only ran on a manual works-after-proof
  # dispatch with a hand-supplied PREV_IMAGE — nothing gated the release path.
  #
  # TWO bases, not one (codex round-0 convergence): a release can be tagged AND
  # published and still fail its prod deploy, leaving production's database one
  # release behind when the next tag builds — proving only the immediate prior
  # tag would false-green exactly that window. Bases resolve automatically from
  # the repo's release tags (scripts/ci/lib/resolve-prev-release-images.sh:
  # stable tags strictly below the building tag; a tag with no published image
  # is skipped, because a barrier-blocked release leaves a git tag but no
  # image; ZERO resolvable bases fail closed). Deliberately NOT GHCR `:latest`
  # — that tag floats to the main-branch tip on every push and is not a
  # release.
  #
  # BLOCKING EDGE: publish-release-image below declares `needs` on this job
  # (and its `if:` carries no always()), so a red — or skipped — proof leaves
  # the whole release path (publish-release-image → release-dispatch +
  # create-release) unreachable: the release-approval Environment pause is
  # never even requested for an image that cannot upgrade an existing
  # database. NOT a required PR status check — on pull_request / merge_group /
  # workflow_dispatch this job is skipped by its `if:` (it must never be added
  # to branch protection, where it would sit "Expected" forever on PRs), so it
  # costs nothing outside v* tag builds. Event guard byte-mirrors
  # publish-release-image's.
  # ---------------------------------------------------------------------------
  upgrade-proof:
    name: Upgrade proof (previous releases to candidate)
    needs: build
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.repository == 'cinatra-ai/cinatra' }}
    runs-on: ${{ vars.CI_BUILD_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      contents: read
      # The base-image existence probe + `docker run` pulls read the PRIVATE
      # previous-release images from GHCR.
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Non-semver checkpoint/marker v-tags publish a checkpoint image but cut
      # no Release and trigger no deploy (see the clearance-gate exemption on
      # publish-release-image) — there is no operator upgrade path to prove,
      # so they skip the proof GREEN (a red here would block the checkpoint
      # publish through the needs edge). Regex kept IDENTICAL to the
      # clearance / release-dispatch semver guards. NOTE: a step cannot
      # short-circuit its job by exiting 0, so this guard emits an output and
      # every later step conditions on it.
      - name: Release-tag guard (checkpoint tags skip the proof)
        id: guard
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?([.+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Release tag '$TAG' — running the previous-release upgrade proof."
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Tag '$TAG' is not a release tag — checkpoint image, upgrade proof not applicable."
          fi

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        if: ${{ steps.guard.outputs.release == 'true' }}

      - name: Login to GHCR
        if: ${{ steps.guard.outputs.release == 'true' }}
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Automatic, fail-closed base resolution (see the job header). The
      # existence probe is `docker buildx imagetools inspect` — the same probe
      # release-dispatch runs before deploying.
      - name: Resolve previous-release base images
        id: bases
        if: ${{ steps.guard.outputs.release == 'true' }}
        env:
          TAG: ${{ github.ref_name }}
          IMAGE_REPO: ghcr.io/${{ github.repository }}
        run: |
          set -euo pipefail
          BASES="$(bash scripts/ci/lib/resolve-prev-release-images.sh "$TAG" "$IMAGE_REPO")"
          echo "Resolved previous-release upgrade bases:"
          printf '%s\n' "$BASES"
          {
            echo 'list<<UPGRADE_PROOF_BASES'
            printf '%s\n' "$BASES"
            echo 'UPGRADE_PROOF_BASES'
          } >> "$GITHUB_OUTPUT"

      # Materialize the candidate image for `docker run`: a pure re-export of
      # the gha cache `build` populated (identical build-args keep the cache
      # hit total) — the same no-rebuild pattern the publish jobs use, with
      # `load:` instead of `push:`.
      - name: Load candidate image from the build cache
        if: ${{ steps.guard.outputs.release == 'true' }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: cinatra-upgrade-proof:candidate
          build-args: |
            CI=true
          cache-from: type=gha

      - name: Upgrade proof from each previous-release base
        if: ${{ steps.guard.outputs.release == 'true' }}
        env:
          BASES: ${{ steps.bases.outputs.list }}
        run: |
          set -euo pipefail
          while IFS= read -r PREV; do
            [ -n "$PREV" ] || continue
            echo "::group::upgrade-proof: ${PREV} -> candidate"
            PREV_IMAGE="$PREV" CANDIDATE_IMAGE="cinatra-upgrade-proof:candidate" \
              bash scripts/ci/upgrade-proof.sh
            echo "::endgroup::"
          done <<< "$BASES"

  # GATED v*-tag image publish. The image-publish half of the release path is a
  # real release artifact, so it pauses behind the `release-approval`
  # Environment (provisioned in THIS repo: required reviewer @groganz,
  # prevent_self_review=false, can_admins_bypass=false — same Environment
  # `create-release` already uses). Exposes the pushed digest as a job output
  # so the gated `release-dispatch` job can forward it to ops. Repo-name guard
  # mirrors the dispatch/release jobs: only the canonical repo publishes.
  publish-release-image:
    name: Publish image (release)
    # `upgrade-proof` is a hard prerequisite (no always() on this job): a red
    # or skipped proof skips this job, so the release-approval pause is never
    # requested — and release-dispatch + create-release, both downstream of
    # this job, stay unreachable — for an image that cannot upgrade an
    # existing database. On non-tag events the `if:` below is false anyway.
    needs: [build, upgrade-proof]
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.repository == 'cinatra-ai/cinatra' }}
    runs-on: ${{ vars.CI_BUILD_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    environment: release-approval
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      # Release clearance gate (machine assertion, fail-closed). A milestone
      # release only publishes once the org has cleared THIS exact tag: the
      # org-level Actions variable RELEASE_CLEARED_VERSION must equal the tag being
      # published. The variable is set by a separate private release-readiness
      # workflow; this repo only reads that version string. The separate release
      # deploy master arm, RELEASE_GATING_ENABLED, lives in cinatra-ai/ops and is
      # read by ops/.github/workflows/deploy-instances.yml after dispatch.
      #
      # SCOPE of the exemption (deliberate, not a bypass): a non-semver
      # checkpoint/marker v-tag (e.g. 'v-pre-extension-system') is a pre-existing,
      # intentional NON-release artifact — it builds + pushes a GHCR checkpoint
      # image but cuts no Release and triggers no deploy (see the semver guards in
      # release-dispatch + create-release). Only a well-formed milestone tag
      # (vMAJOR.MINOR.PATCH) is a release, so only those are clearance-gated; a
      # checkpoint tag is neither empty-clearance-bypassing a release nor able to
      # deploy. Milestone tags fail closed on empty / mismatched clearance.
      - name: Require release clearance for this tag
        env:
          TAG: ${{ github.ref_name }}
          CLEARED: ${{ vars.RELEASE_CLEARED_VERSION }}
        run: |
          set -euo pipefail
          # Release-tag test — kept IDENTICAL to the downstream semver guard used
          # by release-dispatch / create-release, so any tag those jobs treat as a
          # release is clearance-gated here too (no narrower-regex bypass). A
          # non-release checkpoint/marker v-tag is the only exemption.
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?([.+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::notice::Tag '$TAG' is not a release tag — checkpoint image, clearance gate not applicable."
            exit 0
          fi
          if [ -z "${CLEARED:-}" ]; then
            echo "::error::Release clearance not set (RELEASE_CLEARED_VERSION is empty) — refusing to publish '$TAG' (fail-closed)."
            exit 1
          fi
          if [ "$CLEARED" != "$TAG" ]; then
            echo "::error::Release clearance is for '$CLEARED', not '$TAG' — refusing to publish (fail-closed)."
            exit 1
          fi
          echo "::notice::Release clearance confirmed for '$TAG'."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to GHCR
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=sha,format=long,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      # Pure cache re-export from `build`'s gha cache (no rebuild). `id: build`
      # so its digest output feeds `release-dispatch` below.
      - name: Push image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CI=true
          cache-from: type=gha

  # GATED prod-deploy dispatch. Release-gating (Model A): on a v* tag, after the
  # release image is pushed AND the v-prefixed tag is confirmed resolvable in
  # GHCR, tell ops to deploy it to prod. Triggering from HERE (not
  # release:published) closes the release-before-image race — the image provably
  # exists first. This is the real outward release action, so it pauses behind
  # the `release-approval` Environment (the same Environment as the image
  # publish above; both pause on the SAME owner approval for one tag run).
  # GITHUB_TOKEN can't do cross-repo repository_dispatch, so this uses a scoped
  # fine-grained PAT (resource owner cinatra-ai, repo cinatra-ai/ops,
  # Contents: write). Prefer the release-specific CINATRA_RELEASE_DISPATCH_TOKEN;
  # fall back to the legacy CINATRA_OPS_DISPATCH_TOKEN so the rename is
  # non-breaking until the new secret is provisioned. The release dispatch token
  # MUST be distinct from the cinatra-ai/docs dispatch PAT (also named
  # CINATRA_OPS_DISPATCH_TOKEN in ops rotation-matrix.json) — reusing one name
  # across the docs / marketplace / cinatra-app release sources is a
  # rotation/revocation footgun. See .github/secrets-required.txt.
  release-dispatch:
    name: Trigger prod deploy in ops
    needs: publish-release-image
    # Repo-name guard: only the canonical repo dispatches a deploy. A fork or
    # any non-canonical clone must NEVER fire a prod deploy even if a v* tag
    # lands there.
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.repository == 'cinatra-ai/cinatra' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release-approval
    permissions:
      contents: read
      # `imagetools inspect` below reads the PRIVATE release image from GHCR to
      # confirm it resolves before dispatching the deploy; that read requires
      # `packages: read` (the anonymous fetch 401s on the private package).
      packages: read
    steps:
      # Release clearance gate (machine assertion, fail-closed) — see the note on
      # publish-release-image. Independently re-checked here so the outward deploy
      # dispatch can never fire for an uncleared tag even if reached by another
      # path. Non-semver checkpoint tags are exempt (they never dispatch a deploy
      # anyway — see the semver guard in the dispatch step below).
      - name: Require release clearance for this tag
        env:
          TAG: ${{ github.ref_name }}
          CLEARED: ${{ vars.RELEASE_CLEARED_VERSION }}
        run: |
          set -euo pipefail
          # Release-tag test — kept IDENTICAL to this job's downstream semver guard
          # so no tag it treats as a release escapes the clearance check (no
          # narrower-regex bypass). A non-release checkpoint/marker v-tag is exempt.
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?([.+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::notice::Tag '$TAG' is not a release tag — clearance gate not applicable."
            exit 0
          fi
          if [ -z "${CLEARED:-}" ]; then
            echo "::error::Release clearance not set (RELEASE_CLEARED_VERSION is empty) — refusing to dispatch deploy for '$TAG' (fail-closed)."
            exit 1
          fi
          if [ "$CLEARED" != "$TAG" ]; then
            echo "::error::Release clearance is for '$CLEARED', not '$TAG' — refusing to dispatch deploy (fail-closed)."
            exit 1
          fi
          echo "::notice::Release clearance confirmed for '$TAG'."

      # Authenticate to GHCR so the `imagetools inspect` guard below can resolve
      # the PRIVATE release image (ghcr.io/cinatra-ai/cinatra). Without this the
      # anonymous fetch 401s and the job dies BEFORE dispatching the deploy — the
      # prior-milestone prod-deploy defect. Mirrors the Login to GHCR step in
      # publish-release-image; GITHUB_TOKEN has packages:read for this repo's own
      # package.
      - name: Login to GHCR
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger prod deploy in ops
        env:
          GH_TOKEN: ${{ secrets.CINATRA_RELEASE_DISPATCH_TOKEN || secrets.CINATRA_OPS_DISPATCH_TOKEN }}
          TAG: ${{ github.ref_name }}
          DIGEST: ${{ needs.publish-release-image.outputs.digest }}
          SHA: ${{ github.sha }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          set -euo pipefail
          # Only SEMVER release tags (vMAJOR.MINOR(.PATCH)) dispatch a deploy.
          # The `on.push.tags: ['v*']` filter + the job `if:` above admit ANY
          # v-prefixed tag, so a marker/checkpoint tag (e.g.
          # 'v-pre-extension-system') reaches here. Such tags still BUILD + push
          # a GHCR checkpoint image (publish-release-image), but must NOT trigger
          # a deploy.
          # Regex mirrors ops scripts/deploy-instance.sh — keep in sync.
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?([.+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::notice::Tag '$TAG' is not a semver release tag — skipping prod deploy dispatch (the checkpoint image was still built + pushed to GHCR)."
            exit 0
          fi
          # Confirm the v-prefixed image tag actually resolves before deploying.
          docker buildx imagetools inspect "${IMAGE}:${TAG}" >/dev/null
          curl -fsSL --retry 5 --retry-all-errors -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/cinatra-ai/ops/dispatches \
            -d "$(jq -nc --arg tag "$TAG" --arg digest "$DIGEST" --arg sha "$SHA" \
                  '{event_type:"cinatra-release-published",client_payload:{tag:$tag,digest:$digest,sha:$sha}}')"

  # Fresh-clone build gate over the REQUIRED-ONLY universe (cinatra#7, dep-drop slice —
  # the FULL gate that graduated from the one-probe shape, now that the
  # root workspace:* connector deps are gone and `pnpm install` no longer
  # needs the optional dep universe). Presence shape = a fresh public clone
  # that materialized ONLY the declared bootable set
  # (cinatra.requiredExtensions, data-driven — no name literals): every other
  # extension package is PRUNED BEFORE `pnpm install`, the frozen install
  # must succeed against that partial universe, the regenerated maps must
  # OMIT every pruned package (per-file assertion below), the generated
  # per-entry classification test must hold against the SHRUNK maps, the
  # consuming-surface degradation suites must pass, and `next build` must
  # compile cleanly — the #109 class is a BUILD error, so build success IS
  # the subpath-omission proof. This is the dev-surface twin of the prod
  # image build (acquire-lock-set → regenerate → build).
  # The media-feeds probe assertions are KEPT on top of the prune
  # (anti-vacuity continuity with the one-probe shape): the pre-prune assertion runs against
  # the COMMITTED maps before anything is deleted; the explicit probe removal
  # is idempotent whether or not the prune already dropped it (it leaves the
  # universe when requiredExtensions shrinks (the follow-up slice of cinatra#7)).
  presence-degraded-build:
    name: Presence-degraded build (required-only universe)
    needs: detect
    if: ${{ needs.detect.outputs.skip != 'true' }}
    runs-on: ${{ vars.CI_BUILD_RUNNER || 'ubuntu-latest' }}
    # Same long-pole budget rationale as `build` (next build dominates).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Clone companion extension repos
        uses: ./.github/actions/clone-extensions

      # Anti-vacuity FIRST, against the COMMITTED maps and BEFORE any
      # deletion (the prune may legitimately remove the probe once it leaves
      # requiredExtensions): the probe must have REAL loader presence — if it
      # ever loses its entries upstream, this step fails instead of the job
      # silently degenerating into "assert nothing, build anything".
      - name: Assert the probe is referenced by the committed maps (pre-prune)
        run: node scripts/ci/assert-generated-maps-omit.mjs --expect-present @cinatra-ai/media-feeds-connector

      # Prune BEFORE install — the load-bearing difference from the one-probe
      # shape: with the root workspace:* connector deps dropped, the frozen
      # install itself must succeed against the required-only universe (the
      # fresh-public-clone reality). Data-driven from requiredExtensions;
      # fail-closed (nothing pruned / required package missing ⇒ red).
      - name: Prune the presence universe to the declared bootable set
        run: node scripts/ci/prune-extensions-to-required.mjs --out /tmp/pruned-extensions.txt

      - name: Remove the probe connector (idempotent once it leaves the required set)
        run: rm -rf extensions/cinatra-ai/media-feeds-connector

      - name: Install dependencies (frozen, against the pruned universe)
        run: pnpm install --frozen-lockfile

      # Write mode (NOT --check): this check pins presence-aware EMISSION +
      # build, not catalog parity — a pruned package that carries a catalog
      # descriptor would legitimately fail the parity half of a check run, so
      # the check step is deliberately not run here (the canonical --check
      # still gates the full tree in the invariants job above).
      - name: Regenerate the maps against the pruned presence universe
        run: node scripts/extensions/generate-extension-manifest.mjs

      - name: Assert the emitted maps omit EVERY pruned package + the probe (explicit file list)
        run: node scripts/ci/assert-generated-maps-omit.mjs @cinatra-ai/media-feeds-connector $(cat /tmp/pruned-extensions.txt)

      # Consuming-surface degradation, against the SHRUNK maps: the guard's
      # absent-only boundary, every consumer's per-entry degraded path, the
      # generated per-entry classification test (now covering the regenerated
      # set), and the /connectors readiness fail-soft (the #110 canonical
      # regression).
      - name: Degradation suites (guard + consumers + generated classification + readiness fail-soft)
        run: >-
          pnpm exec vitest run
          src/lib/__tests__/extension-load-guard.test.ts
          src/lib/__tests__/extension-degraded-consumers.test.ts
          src/lib/generated/__tests__/guarded-optional-loaders.test.ts
          src/lib/__tests__/connectors-readiness-fail-soft.test.ts

      - name: Add CI build swap (default-runner only)
        # Same 12G step + rationale as the RBAC-e2e job's swap step above
        # (entry-66 CI-memory investigation, 2026-07-17): this job runs the same
        # memory-heavy `pnpm build` directly on the runner and was reclaimed
        # mid-build on the held PRs with no swap at all.
        if: ${{ vars.CI_BUILD_RUNNER == '' }}
        run: |
          set -uxo pipefail
          # Disk-aware: pick the roomier of / and the /mnt temp disk, cap the
          # size to what fits behind a 12G disk margin, and ALWAYS remove a
          # partial file on failure — a swapfile that fills the disk kills the
          # build on ENOSPC, strictly worse than no swap.
          # Genuinely best-effort from here: +e (Actions invokes bash -e) so no
          # discovery/diagnostic hiccup can fail the build; explicit exit 0 at
          # the end. The && chain still gates the success path; every var the
          # arithmetic reads is defaulted so set -u cannot abort either.
          set +e
          target=/
          free_kb=$(df -Pk / 2>/dev/null | awk 'NR==2{print $4}'); free_kb=${free_kb:-0}
          if [ -d /mnt ]; then
            mnt_kb=$(df -Pk /mnt 2>/dev/null | awk 'NR==2{print $4}'); mnt_kb=${mnt_kb:-0}
            if [ "$mnt_kb" -gt "$free_kb" ]; then target=/mnt; free_kb=$mnt_kb; fi
          fi
          SWAPFILE="${target%/}/swapfile-ci-build"
          size_kb=$(( free_kb - 12*1024*1024 )); want_kb=$(( 20*1024*1024 ))
          if [ "$size_kb" -gt "$want_kb" ]; then size_kb=$want_kb; fi
          if [ "$size_kb" -lt $(( 2*1024*1024 )) ]; then
            echo "::notice::CI build swap skipped — under 2G swap headroom on $target (free: $(( free_kb / 1024 / 1024 ))G)"
          elif { sudo fallocate -l "${size_kb}K" "$SWAPFILE" || { sudo rm -f "$SWAPFILE"; sudo dd if=/dev/zero of="$SWAPFILE" bs=1M count=$(( size_kb / 1024 )); }; } \
            && sudo chmod 600 "$SWAPFILE" \
            && sudo mkswap "$SWAPFILE" \
            && sudo swapon "$SWAPFILE"; then
            swapon --show || true; free -h || true; df -h "$target" || true
          else
            echo "::warning::CI build swap setup failed — removing any partial swapfile and proceeding without extra swap (today's behavior)"
            sudo rm -f "$SWAPFILE" || true
          fi
          exit 0

      # Same inert env placeholders as the Dockerfile build stage; CI=true is
      # implicit on Actions runners, so next.config skips the in-build tsc
      # (types are gated by the REQUIRED typecheck job on the full tree).
      - name: Build against the shrunk maps (the #109 class is a build error)
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          SUPABASE_DB_URL: postgresql://build:build@127.0.0.1:5432/build
          BETTER_AUTH_SECRET: build-only-placeholder-not-used-at-runtime
          NANGO_ENCRYPTION_KEY: build-only-placeholder-not-used-at-runtime
          OPENAI_API_KEY: build-only-placeholder-not-used-at-runtime
        run: pnpm build

  # Publish a GitHub Release for a semver v* tag with auto-generated notes
  # (merged PRs / commits since the previous tag). A SEPARATE job (least
  # privilege): only this job holds `contents: write`; the heavy build/push
  # steps stay at the top-level `contents: read`. `needs: publish-release-image`
  # (release-split — was `needs: build`) runs it AFTER the GATED release image
  # publish succeeds, so a failed/unapproved image publish cuts no Release. Both
  # this job and `publish-release-image` carry `environment: release-approval`,
  # so the one owner approval for the tag run releases the image, this Release,
  # AND the prod-deploy dispatch together.
  # Uses the built-in GITHUB_TOKEN — NO external action, NO extra secret, NO
  # checkout (the gh API needs neither). Guards mirror the deploy dispatch:
  # semver-only (a checkpoint/marker v-tag built a GHCR image but cuts no
  # Release) + repo-name-guarded to the canonical repo (a fork/clone never
  # publishes a Release). Idempotent: skips when the Release already exists.
  create-release:
    name: Create GitHub Release
    needs: publish-release-image
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.repository == 'cinatra-ai/cinatra'
    runs-on: ubuntu-latest
    # Gate the public GitHub Release publish behind the org-wide
    # `release-approval` Environment. Creating the Release is a real publish
    # surface, so it must pause for an owner approval before it runs. The
    # Environment is
    # provisioned in THIS repo (required reviewer, prevent_self_review=false,
    # can_admins_bypass=false); without that provisioning a referenced
    # Environment auto-creates UNPROTECTED and the gate is inert, so the line
    # and the provisioned Environment ship together.
    environment: release-approval
    permissions:
      contents: write
    steps:
      # Release clearance gate (machine assertion, fail-closed) — see the note on
      # publish-release-image. Independently re-checked so a GitHub Release (a
      # public release artifact) can never be cut for an uncleared tag. Non-semver
      # checkpoint tags are exempt (they cut no Release — see the semver guard in
      # the release step below).
      - name: Require release clearance for this tag
        env:
          TAG: ${{ github.ref_name }}
          CLEARED: ${{ vars.RELEASE_CLEARED_VERSION }}
        run: |
          set -euo pipefail
          # Release-tag test — kept IDENTICAL to this job's downstream semver guard
          # so no tag it treats as a release escapes the clearance check (no
          # narrower-regex bypass). A non-release checkpoint/marker v-tag is exempt.
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?([.+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::notice::Tag '$TAG' is not a release tag — clearance gate not applicable."
            exit 0
          fi
          if [ -z "${CLEARED:-}" ]; then
            echo "::error::Release clearance not set (RELEASE_CLEARED_VERSION is empty) — refusing to create Release for '$TAG' (fail-closed)."
            exit 1
          fi
          if [ "$CLEARED" != "$TAG" ]; then
            echo "::error::Release clearance is for '$CLEARED', not '$TAG' — refusing to create Release (fail-closed)."
            exit 1
          fi
          echo "::notice::Release clearance confirmed for '$TAG'."

      - name: Create GitHub Release (auto-generated notes)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Semver-only — keep this regex in sync with the build job's
          # deploy-dispatch gate.
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?([.+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::notice::Tag '$TAG' is not a semver release tag — skipping GitHub Release creation (the image was still built + pushed to GHCR)."
            exit 0
          fi
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "::notice::Release $TAG already exists — skipping (idempotent re-run)."
            exit 0
          fi
          gh release create "$TAG" --repo "$REPO" --title "$TAG" --generate-notes --verify-tag
