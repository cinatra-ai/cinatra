# Dashboards suite gate — the full default (pg-free) vitest suites of
# packages/dashboards and packages/sdk-dashboard, on EVERY PR and main push.
#
# Why always-run with NO paths filter (cinatra#1929): the suites' real input
# closure exceeds any honest path set — eslint-boundary.test.ts executes
# eslint.config.mjs, the dashboard tests resolve host src/** through vitest
# aliases, and the two drizzle-cube CONTRACT tests pin the INSTALLED bundle,
# so a pnpm-lock.yaml-only dependency bump is exactly a change that must run
# them (the #1777 bump rotted unwatched for days because no CI lane did).
# An under-covered paths filter produces false-green stubs (the #1919 class);
# always-concluding also makes later required-check promotion safe. Precedent:
# crm-migration-gate (unconditional), mcp-route-gate (every PR + main push).
#
# Deliberate overlap: build-image.yml keeps its scoped cube-guard invocation;
# the full suite re-running it is intentional. dashboard-live-verify stays
# as-is. The DASH_DB_IT Postgres integration arm stays opt-in (the
# *.integration.test.ts files are config-excluded from these default runs).

name: dashboards-suite-gate

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dashboards-suite-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: dashboards default suite
        run: pnpm -C packages/dashboards exec vitest run --no-coverage
      - name: sdk-dashboard default suite
        run: pnpm -C packages/sdk-dashboard exec vitest run --no-coverage
