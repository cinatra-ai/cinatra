# Warm dev-session HMR smoke (cinatra#1093).
#
# The HMR-re-evaluation-over-framework-locked-objects regression class
# (cinatra#1068: "Cannot redefine property: $$typeof" in the server-reference
# bridge under Turbopack HMR) is invisible to every other automated surface:
# vitest and the production-build render-smoke/dashboards suites run fresh,
# deterministic builds; the fresh-install gate is fresh-boot-only. It only
# manifests in a WARM dev session after a true recompile. This workflow makes
# that executable: it boots `pnpm dev` (Turbopack), warms the server-action
# surfaces, forces a true recompile of the setup-action reference bridge, and
# re-walks — then scans the dev-server log for the redefine stack.
#
# NON-GATING BY DESIGN (report-only): scheduled nightly, on manual dispatch, and
# on PRs that touch the bridge / connector-setup surfaces / next+react version
# inputs. It is NOT a required status check — a red here means "a warm-dev HMR
# regression slipped in", never "main is broken". Ratchet to required (scoped to
# those paths) once the flake rate over a few milestones is known.
#
# The dev server is booted EXTERNALLY (not Playwright-managed) so the workflow
# owns its teardown and captures its log for the scan — an earlier
# Playwright-managed `pnpm dev` left an untearable process tree.
name: dev-hmr-smoke

on:
  schedule:
    # Nightly, offset from the other canaries (head-canary 05:23, reconcile 06:37).
    - cron: '51 4 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      # Server-reference / server-action bridge code + the surfaces that bind it.
      - 'src/lib/connector-setup-action-references.server.ts'
      - 'src/lib/register-host-connector-services.ts'
      - 'src/app/connectors/**'
      - 'src/app/setup/**'
      # Bundler / framework-version inputs (next/react changes are the trigger).
      - 'next.config.*'
      - 'pnpm-lock.yaml'
      - 'package.json'
      # The harness itself.
      - 'tests/e2e/dev-hmr-smoke/**'
      - 'tests/e2e/config/dev-hmr-smoke.config.ts'
      - 'scripts/ci/hmr-smoke-scan.mjs'
      - '.github/workflows/dev-hmr-smoke.yml'

permissions:
  contents: read

concurrency:
  group: dev-hmr-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hmr-smoke:
    name: Warm dev-session HMR smoke (report-only)
    runs-on: ${{ vars.CI_BUILD_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:5434/postgres
      SUPABASE_SCHEMA: cinatra_e2e_hmr
      REDIS_URL: redis://127.0.0.1:6379
      BULLMQ_QUEUE_NAME: cinatra-bg-e2e-hmr
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      # next.config.ts REQUIRED_ENV is presence-only; the smoke never makes a
      # real OpenAI call. Mirrors the dashboards/RBAC e2e placeholder.
      OPENAI_API_KEY: ci-placeholder-not-used-by-hmr-smoke
      # Clear the fresh-instance setup-wizard redirect so authenticated routes
      # render (documented browser-e2e affordance, src/lib/setup-wizard.ts).
      CINATRA_E2E_SETUP_BYPASS: "true"
      # Dev-mode boot: makes required-extension-seed absence the intended non-prod
      # no-op (mirrors the dashboards/RBAC e2e jobs).
      CINATRA_RUNTIME_MODE: development
      E2E_PORT: "3000"
      # The workflow boots the dev server; Playwright attaches instead of
      # managing (and cold-booting) its own.
      E2E_REUSE_SERVER: "1"
      # Bound the cold-compile cost of a warm `pnpm dev` route walk. 4 setup
      # routes (+ /connectors, /agents) is enough to lock the server-reference
      # objects and force the bridge recompile #1068 needs, while keeping the
      # twice-walked cold-compile budget comfortably inside the test timeout.
      HMR_SMOKE_MAX_CONNECTORS: "4"
      DEV_SERVER_LOG: /tmp/dev-hmr-server.log
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Clone companion extension repos
        uses: ./.github/actions/clone-extensions

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Derive secrets (throwaway, per-run)
        run: |
          echo "BETTER_AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "CINATRA_ENCRYPTION_KEY=$(printf '0%.0s' {1..64})" >> "$GITHUB_ENV"

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Playwright chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Provision Better Auth tables (public schema)
        # Idempotent snapshot of Better Auth's public.* tables so auth.setup can
        # mint the platform-admin session; the cinatra app schema is created by
        # the instrumentation hook on first query (same as the dashboards job).
        run: node scripts/apply-public-schema.mjs

      - name: Boot dev server (pnpm dev / Turbopack)
        run: |
          set -euo pipefail
          rm -f "$DEV_SERVER_LOG"
          (pnpm dev > "$DEV_SERVER_LOG" 2>&1) &
          echo "$!" > /tmp/dev-hmr.pid
          echo "dev server launched as PID $(cat /tmp/dev-hmr.pid)"

      - name: Wait for dev server ready
        run: |
          set -uo pipefail
          # Turbopack compiles the first route cold, so allow generous slack.
          for i in $(seq 1 90); do
            if curl -fsS "http://localhost:3000/api/auth/get-session" >/dev/null 2>&1; then
              echo "dev server ready after ${i} attempt(s)."
              exit 0
            fi
            sleep 2
          done
          echo "::error::dev server did not become ready in time."
          echo "----- last 100 lines of dev log -----"
          tail -n 100 "$DEV_SERVER_LOG" || true
          exit 1

      - name: Run warm dev-session HMR smoke (Playwright)
        run: pnpm test:e2e:dev-hmr-smoke

      - name: Scan dev-server log for HMR-regression stacks
        if: always()
        # Report-only alongside the Playwright leg: --fail-on-hit so a
        # server-reference redefine stack in the warm-dev log also reds this
        # (non-required) job even if a surface recovered a renderable payload.
        run: node scripts/ci/hmr-smoke-scan.mjs "$DEV_SERVER_LOG" --fail-on-hit

      - name: Stop dev server
        if: always()
        run: |
          if [ -f /tmp/dev-hmr.pid ]; then kill "$(cat /tmp/dev-hmr.pid)" 2>/dev/null || true; fi

      - name: Upload artifacts (dev log + Playwright report)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dev-hmr-smoke
          path: |
            /tmp/dev-hmr-server.log
            playwright-report
          retention-days: 7
          if-no-files-found: ignore
