# WordPress/Drupal assistant Playwright UAT gate.
#
# The UAT RUN LOGIC (composite action) lives in cinatra-ai/ci
# (.github/actions/wp-drupal-uat-run) — shared CI plumbing that operates on a
# cinatra core checkout. This caller stays in THIS repo because its subject is
# core PRs: the path filter below targets core integration paths and the
# Playwright suite itself lives in tests/e2e/wp-drupal-uat/. The canonical
# wire contract lives in cinatra-ai/wordpress-assistant-connector
# (contracts/wp-drupal-assistant/).
#
# - Path-filtered HARD gate on PRs: when plugin-integration paths are
#   touched, the full UAT suite must pass; otherwise the gate passes quickly.
#   The `uat-gate` job ALWAYS runs so it is a stable required status check.
# - Nightly cron runs the full suite regardless of touched paths.
# - The `override-wp-drupal-uat` label skips the hard run (planned migrations);
#   it additionally requires both owners' review + an auditable PR-body rationale
#   (enforced by review process / CONTRIBUTING; recorded here in the job log).
#
# RUNNER REQUIREMENT: the full UAT needs Docker (WP/Drupal + app services) plus
# the app-service env (SUPABASE_DB_URL, BETTER_AUTH_SECRET, REDIS_URL, …). Set
# the `WP_DRUPAL_UAT_RUNNER` repo variable to a provisioned (self-hosted) runner
# label if ubuntu-latest cannot host the stack — whether ubuntu-latest suffices
# is answered empirically by the next contract-path run / 07:00Z nightly.
# CREDENTIALS: the companion devApp repos (wordpress-plugin, drupal-module,
# a2a-servers-dev) are PUBLIC — `cinatra setup dev` clones them anonymously over
# HTTPS, so no deploy key is required. The secret WP_DRUPAL_UAT_DEPLOY_KEY is
# OPTIONAL and forwarded when present (future private repos); the shared action
# skips its SSH-config step entirely when the key is empty.

name: WP/Drupal UAT Gate

on:
  pull_request:
    # Draft PRs skip the real UAT (green-stub via run_real); ready_for_review runs
    # it for real; converted_to_draft lets concurrency cancel an in-flight run.
    # labeled/unlabeled re-evaluate the gate when `override-wp-drupal-uat` is
    # toggled (otherwise removing the label could leave a stale-green check).
    types:
      [
        opened,
        synchronize,
        reopened,
        ready_for_review,
        converted_to_draft,
        labeled,
        unlabeled,
      ]
  schedule:
    - cron: "0 7 * * *" # nightly full suite (07:00 UTC)
  workflow_dispatch: # on-demand proof of the nightly full-suite path (cinatra#173)

permissions:
  contents: read
  pull-requests: read # dorny/paths-filter queries the PR's changed files via the API

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changed-paths:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
      contract_schema: ${{ steps.filter.outputs.contract_schema }}
      # run_real = run the real UAT: relevant paths touched AND not a draft PR.
      # (changed-paths only runs on pull_request, so draft is defined here.)
      run_real: ${{ steps.filter.outputs.relevant == 'true' && github.event.pull_request.draft != true }}
      # run_uat = run_real AND the override label is NOT present. Single source of
      # truth for "Postgres/Redis + secret + composite action all activate" on the
      # uat-gate job — drives the conditional service images AND every real-run
      # step `if:` so the services condition can never drift from the step
      # conditions. (changed-paths is pull_request-only, so the labels read here
      # is always defined.)
      run_uat: ${{ steps.filter.outputs.relevant == 'true' && github.event.pull_request.draft != true && !contains(github.event.pull_request.labels.*.name, 'override-wp-drupal-uat') }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            contract_schema:
              - 'src/lib/wp-drupal-auth-init.schema.json'
            relevant:
              - 'src/lib/wp-drupal-contract.ts'
              - 'src/lib/wp-drupal-auth-init.schema.json'
              - 'src/app/api/wordpress/**'
              - 'src/app/api/drupal/**'
              - 'src/lib/wordpress-mcp-connection.ts'
              # cinatra#1919 — the hosted-LLM MCP path the suite's boot exercises
              # runs through the external-MCP registry (host-connector service
              # publication + the /api/mcp tools the WP/Drupal widget reaches). A
              # PR touching ONLY this module previously skipped the suite
              # (misleading green); it is a real boot-dependency and must trigger
              # the gate. The filter-coverage regression test
              # (src/lib/__tests__/wp-drupal-uat-paths-filter-coverage.test.ts)
              # keeps this list covering the suite's boot-dependency modules.
              - 'src/lib/external-mcp-registry.ts'
              - 'src/lib/dev-auto-setup.ts'
              - 'packages/llm/src/scripted-test-provider.ts'
              # S5 iframe cutover (cinatra#1221): the WP/Drupal widget no longer
              # renders the turn — it frames the Cinatra-served /embed/assistant
              # page, which the suite drives cross-origin. A regression in the
              # embed page, the frame-ancestors resolver, the assistant chat
              # route, or the route-guard that sets the frame-ancestors CSP would
              # break the suite yet previously skip this gate. These are real
              # boot dependencies; the coverage test keeps them in this list.
              - 'src/app/embed/assistant/**'
              - 'src/lib/embed/**'
              - 'src/app/api/assistants/chat/**'
              - 'src/lib/auth-route-guard.ts'
              # cinatra#2036 (surfaced by #2031) — the assistant/widget/boot MOUNT +
              # TURN closure the suite's scenarios actually execute. Scenarios 4/5
              # drive the widget assistant turn end-to-end: the CLOSED
              # handle→built-in binding + the audience closure (the exact seam the
              # #2031 out-of-audience regression lived in), the dual-token widget
              # auth/broker sequence, the assistant runtime + chat runner the turn
              # runs through, and the boot seeding that mints the WP/Drupal built-in
              # assistants. Each PR behind #2031 (#1915 registry, #1935 chat/boot,
              # #1991 widget) changed ONLY paths like these and fast-passed the gate.
              # The coverage regression test pins this set; keep the two lists equal.
              # Assistant registry + audience closure (scenarios 4/5 visibility):
              - 'src/lib/assistant-registry-reader.ts'
              - 'src/lib/assistant-registry-schema.ts'
              - 'src/lib/assistant-audience-closure.ts'
              - 'src/lib/assistant-selector-audience.ts'
              - 'src/lib/assistant-widget-handles.ts'
              # Assistant boot-seed closure (the WP/Drupal built-in siblings the
              # widget binds to are minted at boot; a regression here → no assistant):
              - 'src/lib/assistant-agent-registration.ts'
              - 'src/lib/assistant-users.ts'
              - 'src/lib/assistant-config.ts'
              - 'packages/agents/src/builtin-assistant-template.ts'
              # The assistant turn runtime + the chat runner/dispatch it runs through:
              - 'src/lib/assistant-runtime/**'
              - 'src/app/api/chat/**'
              - 'packages/chat/src/**'
              # Widget auth/broker — the dual-token (cnx_/cit_/cwu_) sequence that
              # gates the widget turn (scenarios 4/5/6) + its mint endpoints:
              - 'src/lib/widget-broker-route.ts'
              - 'src/lib/widget-token-broker.ts'
              - 'src/lib/widget-user-auth.ts'
              - 'src/lib/widget-stream-agents.server.ts'
              - 'src/lib/widget-stream-auth.ts'
              - 'src/lib/widget-auth-audit.ts'
              - 'src/lib/widget-mcp-actor-token.ts'
              - 'src/lib/widget-chat-resume-token.ts'
              - 'src/app/api/widget-auth/**'
              # The short-lived cit_ transport-token MINT survives on the per-agent
              # route (POST /api/agents/{slug}/token) post-S5; the suite mints there
              # before every widget turn (global-setup warm-up + scenarios 4/5). A
              # regression here fails the turn auth yet would otherwise skip the gate.
              - 'src/app/api/agents/*/token/**'
              # Boot orchestration/phases the mount + assistant seeding depend on:
              - 'src/lib/boot/**'
              - 'tests/e2e/wp-drupal-uat/**'
              - 'tests/e2e/config/wp-drupal-uat.config.ts'
              - 'tests/e2e/config/base.ts'
              - 'dev/wordpress-plugin/**'
              - 'dev/drupal-module/**'
              # cinatra#2165 — the Drupal COMPANION IMAGE the suite boots. The
              # composite action brings the stack up with `docker compose
              # --profile wordpress --profile drupal up`, and the `drupal`
              # service has a `build:` (no registry image), so compose BUILDS
              # docker/drupal/Dockerfile and runs scripts/drupal-entrypoint.sh
              # as the container entrypoint. A PR that rebases that image (a
              # base-image major, an extension change) or rewrites the
              # bootstrap the Drupal scenarios depend on therefore changes what
              # the suite runs against — yet previously fast-passed this gate,
              # the same misleading-green shape as cinatra#1919 / cinatra#2036.
              # The coverage regression test pins these; keep the two lists equal.
              # (The symmetric WordPress-side image paths are a known remaining
              # gap, left to their own lane rather than widened here.)
              - 'docker/drupal/**'
              - 'scripts/drupal-entrypoint.sh'

  # Reciprocal contract lock-step gate (canonical-first ordering): a core PR
  # that edits the ENFORCED auth-init schema copy must match the CANONICAL
  # schema already on the contract repo's default branch
  # (cinatra-ai/wordpress-assistant-connector, contracts/wp-drupal-assistant/).
  # The contract repo's own gate covers the other direction plus a weekly
  # drift schedule. Cheap (two checkouts + a deep-compare), so it runs on
  # drafts too.
  contract-schema-lockstep:
    if: github.event_name == 'pull_request' && needs.changed-paths.outputs.contract_schema == 'true'
    needs: changed-paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Checkout the canonical contract repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: cinatra-ai/wordpress-assistant-connector
          path: .wp-drupal-contract
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
      - name: Enforced copy matches the canonical v1 auth-init schema
        run: |
          node --input-type=module -e "
            import { readFileSync } from 'node:fs';
            import assert from 'node:assert/strict';
            const canonical = JSON.parse(readFileSync('.wp-drupal-contract/contracts/wp-drupal-assistant/v1/auth-init.schema.json', 'utf8'));
            const enforced = JSON.parse(readFileSync('src/lib/wp-drupal-auth-init.schema.json', 'utf8'));
            assert.deepEqual(
              enforced,
              canonical,
              'src/lib/wp-drupal-auth-init.schema.json does not match the canonical v1 auth-init schema on the contract repo default branch — land the canonical change first (canonical-first ordering), then update the enforced copy here.',
            );
            console.log('OK: enforced copy matches the canonical v1 auth-init schema.');
          "

  # Stable required status check — always runs on PRs, branches internally.
  # `!cancelled()` keeps it running (and failing loud below) when changed-paths
  # itself fails — a skipped required check would otherwise satisfy protection.
  uat-gate:
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    needs: changed-paths
    runs-on: ${{ vars.WP_DRUPAL_UAT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 40
    # Conditional service containers (the dashboard-live-verify idiom): an empty
    # `image` string means the service is NOT started. `services:` containers
    # spin up for the WHOLE job regardless of step `if:`, so gating the image on
    # the single authoritative `run_uat` output keeps the fast-pass / draft /
    # override-labeled paths container-free and trivially fast-green as a
    # required check, while the real-run path gets a live Postgres + Redis.
    services:
      postgres:
        # postgres:18-alpine matches docker-compose.yml's Postgres major so CI
        # exercises the same engine `cinatra setup dev` provisions against.
        image: ${{ needs.changed-paths.outputs.run_uat == 'true' && 'postgres:18-alpine' || '' }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: ${{ needs.changed-paths.outputs.run_uat == 'true' && 'redis:8-alpine' || '' }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # In-repo, zero-secret app-service env mirroring dashboard-live-verify.yml.
      # The connection string is the same literal the CLI's own rebuildEnvLocal()
      # writes; the Postgres service publishes 5434 above. Job-level env is
      # inherited by every step INCLUDING the composite action's steps, so
      # `cinatra setup dev` (run inside the composite action) finds SUPABASE_DB_URL
      # and a live DB. (cinatra#173)
      SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:5434/postgres
      REDIS_URL: redis://127.0.0.1:6379
      # scripted-test-provider.ts fail-CLOSES unless this is exactly 'development'
      # (and NODE_ENV != production); `setup dev` also asserts the configured
      # runtime mode equals development. Do NOT set NODE_ENV=production here.
      CINATRA_RUNTIME_MODE: development
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_BETTER_AUTH_URL: http://localhost:3000
      # App-side wayflow endpoint (compose publishes 3010). The wayflow
      # container starts BEFORE the app in this job, so its startup scan sees a
      # markerless just-cloned tree and mounts ZERO agents; the app's
      # agent-marker-backfill boot phase then writes the published markers and
      # POSTs the authenticated reload via triggerWayflowReload — which is a
      # silent no-op (reason=no_base_url) unless this is set. Without it every
      # widget-stream relay 404s on the agent card ("(no response)" in tests
      # 4/5) even with a healthy, tokened wayflow.
      WAYFLOW_BASE_URL: http://localhost:3010
      # cinatra#1919 — provide the public MCP URL the hosted-LLM write path needs.
      # `setup dev`'s self-establish cannot bring up a Tailscale Funnel in CI (no
      # sidecar, no TS_AUTHKEY), so without an operator-supplied URL the MCP
      # settings row stays URL-less, `hasLlmMcpAccess` is false, and the widget
      # answers "No LLM provider configured" — the 4 previously-red assertions.
      # This is the container-reachable app origin the WP/Drupal + wayflow
      # containers already target (CINATRA_BASE_URL=http://host.docker.internal:3000
      # via the compose host-gateway mapping), so the agent's MCP tool-call write
      # path resolves it. Being an EXPLICIT operator URL it also makes the CLI's
      # self-establish stand down at its first gate (no hostname prediction, so no
      # dependence on the extensions-tree declarer) — green here does not wait on
      # the CLI release wave. Non-localhost, so it is accepted (localhost is refused).
      MCP_PUBLIC_BASE_URL: http://host.docker.internal:3000
      # next.config.ts REQUIRED_ENV asserts presence of OPENAI_API_KEY at
      # dev-server startup (next.config.ts:6-13). The UAT boots `pnpm dev` with
      # the deterministic SCRIPTED provider (no real OpenAI call), but the
      # presence check still fires — so a zero-secret placeholder is required
      # (mirrors dashboard-live-verify.yml and the Dockerfile placeholder).
      OPENAI_API_KEY: ci-placeholder-not-used-by-wp-drupal-uat
    steps:
      - name: Fail loud if changed-paths did not succeed
        if: needs.changed-paths.result != 'success'
        run: |
          echo "::error::changed-paths result: ${{ needs.changed-paths.result }} — path relevance unknown, failing the gate instead of skipping."
          exit 1
      - name: Override label present → skip with audit note
        if: contains(github.event.pull_request.labels.*.name, 'override-wp-drupal-uat')
        run: |
          echo "::notice::override-wp-drupal-uat label present — UAT hard gate skipped."
          echo "Requires both owners' review + a PR-body rationale (what breaks, follow-up PRs, rollback). See docs/developer/contributing.md."
      - name: No contract paths touched (or draft/override) → gate passes quickly
        if: needs.changed-paths.outputs.run_uat != 'true'
        run: echo "No WP/Drupal contract paths touched, or draft/override-labeled PR — UAT not applicable (real UAT runs on ready non-draft PRs touching contract paths, and nightly)."
      - name: Reclaim runner disk (real-run only — full UAT stack + browsers exhaust ubuntu-latest)
        if: needs.changed-paths.outputs.run_uat == 'true'
        # See the nightly job's identical step: run 28865808274 died on
        # "No space left on device" (2026-07-07). Real-run path only.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Enlarge swap + record the memory baseline (real-run only)
        if: needs.changed-paths.outputs.run_uat == 'true'
        # DISK was never the constraint on the silent-stall runs (>100 GB free
        # after the reclaim above) — MEMORY was. This job co-hosts the docker
        # WordPress + Drupal + nango + wayflow stack, the Postgres/Redis service
        # containers, a Next dev server and a Playwright Chromium on one
        # 4-vCPU / 16-GB runner. When it runs out of headroom the box stops
        # making progress ENTIRELY: the suite emits nothing further, no
        # Playwright per-test timeout can fire (its own process is wedged), and
        # the job is torn down with no diagnosis.
        #
        # The hosted image ships a 4 GB swapfile. Growing it to 16 GB on the
        # (plentiful) reclaimed disk turns that cliff into a slowdown the suite
        # can still finish and report through. `swapon --show` + `free -m` are
        # recorded so the next investigation starts with the baseline instead of
        # inferring it from silence.
        run: |
          set -euo pipefail
          # ADDITIVE: a dedicated swapfile ALONGSIDE whatever the image already
          # has. Deliberately no `swapoff -a` — disabling every existing swap
          # device first would leave the box with LESS headroom during the
          # window it takes to build the new file, and would mask a real failure
          # to detach an in-use device.
          if swapon --show=NAME --noheadings | grep -qx /mnt/cinatra-uat-swap; then
            sudo swapoff /mnt/cinatra-uat-swap
          fi
          sudo rm -f /mnt/cinatra-uat-swap
          sudo fallocate -l 16G /mnt/cinatra-uat-swap
          sudo chmod 600 /mnt/cinatra-uat-swap
          sudo mkswap /mnt/cinatra-uat-swap
          sudo swapon /mnt/cinatra-uat-swap
          # Prefer reclaiming page cache over swapping; swap here is the cliff
          # guard of last resort, not a routine tier.
          sudo sysctl -w vm.swappiness=10
          swapon --show
          free -m
          nproc
      - name: Checkout
        if: needs.changed-paths.outputs.run_uat == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # MASK-AT-MINT (all four derivations below).
      #
      # A value written to $GITHUB_ENV becomes part of the JOB env, and the
      # runner prints the whole job env in the `##[group]Run …` header of every
      # subsequent step — so a step does not have to echo anything for its
      # derived key material to end up in the job log, and this repository's
      # job logs are public. `::add-mask::` registers the value with the
      # runner's log masker and is emitted BEFORE the value is written
      # anywhere, echoed, or handed to a subprocess, because the masker only
      # redacts SUBSEQUENT output: it cannot redact retroactively, and it does
      # not cover transformed forms (a base64 of, or a prefix of, a masked
      # value). That is why the diagnostic prints below report NAMES + LENGTHS
      # rather than leaning on the masker, and why every file written for
      # artifact upload goes through scripts/ci/uat-diagnostics.sh's scrubber —
      # the masker covers the log stream, never a file. The mask-verify job at
      # the bottom of this workflow asserts the result on the finished log.
      - name: Derive BETTER_AUTH_SECRET (throwaway, per-run)
        if: needs.changed-paths.outputs.run_uat == 'true'
        run: |
          set -euo pipefail
          minted="$(openssl rand -hex 32)"
          echo "::add-mask::$minted"
          printf 'BETTER_AUTH_SECRET=%s\n' "$minted" >> "$GITHUB_ENV"
          echo "minted BETTER_AUTH_SECRET (${#minted} chars)"
      - name: Derive NANGO_ENCRYPTION_KEY (throwaway base64 32-byte, per-run)
        if: needs.changed-paths.outputs.run_uat == 'true'
        # docker-compose.yml's nango-server (default profile, always started by
        # the composite action's `docker compose --profile wordpress --profile
        # drupal up`) interpolates `NANGO_ENCRYPTION_KEY: ${NANGO_ENCRYPTION_KEY}`
        # from the runner env. Unset → nango boots with a BLANK key and fails
        # (cinatra#665). nango-server REQUIRES a base64-encoded 32-byte AES key
        # (mirrors scripts/ci/works-after/nango.sh's wa_throwaway_b64key); a
        # bare placeholder string like build-image.yml uses is fine only there
        # because that build stage never boots nango. This is THROWAWAY crypto
        # minted per run — never an ops secret. Exported to $GITHUB_ENV so the
        # job env reaches the composite action's `docker compose up` step.
        run: |
          set -euo pipefail
          minted="$(openssl rand -base64 32)"
          echo "::add-mask::$minted"
          printf 'NANGO_ENCRYPTION_KEY=%s\n' "$minted" >> "$GITHUB_ENV"
          echo "minted NANGO_ENCRYPTION_KEY (${#minted} chars)"
      - name: Derive CINATRA_BRIDGE_TOKEN (throwaway, per-run)
        if: needs.changed-paths.outputs.run_uat == 'true'
        # The wayflow container authenticates its /api/llm-bridge callback with
        # this shared secret, and its boot preflight (agent_loader.py) EXITS
        # non-zero when the token is absent — so without this derivation the
        # container restart-loops, the widget-stream relay to localhost:3010
        # dies with "fetch failed", and the SSE/edit UAT scenarios fail with
        # "(no response)" (the pre-existing red on every real run of this
        # suite; the wp/drupal auth+widget scenarios still passed because they
        # never touch the relay). Reaches BOTH sides from the single job env:
        # `pnpm setup:dev` (composite step) writes docker/wayflow/.wayflow.env
        # from it via scripts/gen-wayflow-env.mjs (env_file for the container),
        # and the Playwright webServer `pnpm dev` inherits it for the app-side
        # bridge check. THROWAWAY crypto minted per run — never an ops secret.
        run: |
          set -euo pipefail
          minted="$(openssl rand -hex 32)"
          echo "::add-mask::$minted"
          printf 'CINATRA_BRIDGE_TOKEN=%s\n' "$minted" >> "$GITHUB_ENV"
          echo "minted CINATRA_BRIDGE_TOKEN (${#minted} chars)"
      - name: Derive CINATRA_CONTEXT_ATTEST_KEY (throwaway, per-run)
        if: needs.changed-paths.outputs.run_uat == 'true'
        # Symmetric with the bridge token: the wayflow boot preflight
        # (agent_loader.py) also EXITS non-zero without the per-node context-
        # attestation key, so the container restart-loops and the widget-stream
        # relay scenarios fail. Same plumbing — one derivation into the job env
        # reaches BOTH the container (scripts/gen-wayflow-env.mjs writes it into
        # docker/wayflow/.wayflow.env, which already lists this key) and the
        # app-side `pnpm dev`, so app and container share the SAME key (a
        # mismatch would 403 composed-child context resolution). THROWAWAY.
        run: |
          set -euo pipefail
          minted="$(openssl rand -hex 32)"
          echo "::add-mask::$minted"
          printf 'CINATRA_CONTEXT_ATTEST_KEY=%s\n' "$minted" >> "$GITHUB_ENV"
          echo "minted CINATRA_CONTEXT_ATTEST_KEY (${#minted} chars)"
      - name: Assert app-service env present (regression pin for cinatra#173)
        if: needs.changed-paths.outputs.run_uat == 'true'
        # Env-presence guard ONLY (runs in the caller, BEFORE the composite
        # action installs `pg`). Postgres reachability is already guaranteed by
        # the services.postgres healthcheck (steps don't start until it passes).
        run: |
          : "${SUPABASE_DB_URL:?cinatra#173 regression: SUPABASE_DB_URL must be exported (postgres service + job env) before cinatra setup dev}"
          : "${BETTER_AUTH_SECRET:?cinatra#173 regression: BETTER_AUTH_SECRET must be derived (openssl rand) before cinatra setup dev}"
          : "${NANGO_ENCRYPTION_KEY:?cinatra#665 regression: NANGO_ENCRYPTION_KEY must be derived (openssl rand -base64 32) before docker compose up — nango-server boots blank otherwise}"
          : "${CINATRA_BRIDGE_TOKEN:?regression pin: CINATRA_BRIDGE_TOKEN must be derived (openssl rand) before cinatra setup dev — the wayflow runtime refuses to boot without it and the widget-stream relay scenarios fail with '(no response)'}"
          : "${CINATRA_CONTEXT_ATTEST_KEY:?regression pin: CINATRA_CONTEXT_ATTEST_KEY must be derived (openssl rand) before cinatra setup dev — the wayflow boot preflight refuses to start without it, and the artifact leak scan below cannot report a trustworthy result for an unset value}"
          : "${OPENAI_API_KEY:?cinatra#173 regression: OPENAI_API_KEY placeholder must be set (next.config.ts REQUIRED_ENV) before the dev server boots}"
          : "${CINATRA_RUNTIME_MODE:?cinatra#173 regression: CINATRA_RUNTIME_MODE=development required (scripted provider fail-closes otherwise)}"
          echo "app-service env present"
      # cinatra#2131 — start the periodic resource sampler BEFORE the composite
      # action, which is where the docker stack comes up and where the
      # Playwright webServer boots the Next dev server. Both of those are the
      # load that tipped the runner over, so the series has to begin ahead of
      # them to be worth reading.
      - name: Start the periodic resource sampler
        if: needs.changed-paths.outputs.run_uat == 'true'
        run: |
          bash scripts/ci/uat-diagnostics.sh sampler-start \
            "$RUNNER_TEMP/uat-diagnostics/resource-samples.txt" \
            "$RUNNER_TEMP/uat-sampler.pid" 30
      - name: Run full UAT suite
        if: needs.changed-paths.outputs.run_uat == 'true'
        uses: cinatra-ai/ci/.github/actions/wp-drupal-uat-run@72d0b1caa9b11e33a9ba3e65e55aae46ad844bf1 # v0.1.0-ci61-merged.9f228d7
        with:
          # OPTIONAL — devApp repos are public (anonymous HTTPS clone). Forwarded
          # when configured so a future private flip keeps working unchanged.
          deploy-key: ${{ secrets.WP_DRUPAL_UAT_DEPLOY_KEY }}
      # ---- cinatra#2131 diagnostics capture (green AND red) ----
      # `always()` so the sampler is stopped and its series kept on a pass, on a
      # failure, and on a run the Playwright run ceiling ends. Nothing here can
      # run after a hard runner teardown; that is stated rather than papered
      # over.
      - name: Stop the periodic resource sampler
        if: ${{ always() && needs.changed-paths.outputs.run_uat == 'true' }}
        run: |
          bash scripts/ci/uat-diagnostics.sh sampler-stop \
            "$RUNNER_TEMP/uat-sampler.pid" \
            "$RUNNER_TEMP/uat-diagnostics/resource-samples.txt"
      - name: Capture docker compose logs (failure path)
        if: ${{ failure() && needs.changed-paths.outputs.run_uat == 'true' }}
        run: bash scripts/ci/uat-diagnostics.sh compose-logs "$RUNNER_TEMP/uat-compose-logs"
      # Fail-closed backstop BEFORE anything is published: the runner's log
      # masker does not touch FILES, so this greps the staged artifact content
      # for the actual in-memory values and reports a boolean per path.
      #
      # Both uploads below are gated on this step's OUTCOME, not merely ordered
      # after it. A red step does not stop an `always()`/`failure()` step from
      # running, so without the explicit gate a positive leak result would still
      # publish the contaminated artifact — and would additionally make
      # `failure()` true, publishing the compose logs on an otherwise green run.
      - name: Verify no minted value reached the staged artifacts
        id: leak_scan
        if: ${{ always() && needs.changed-paths.outputs.run_uat == 'true' }}
        run: |
          bash scripts/ci/uat-diagnostics.sh scan \
            "$RUNNER_TEMP/uat-diagnostics" \
            "$RUNNER_TEMP/uat-compose-logs"
      - name: Upload the resource snapshot
        if: ${{ always() && needs.changed-paths.outputs.run_uat == 'true' && steps.leak_scan.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: uat-resource-snapshot-${{ github.job }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/uat-diagnostics
          if-no-files-found: warn
          retention-days: 14
      - name: Upload the docker compose logs
        if: ${{ failure() && needs.changed-paths.outputs.run_uat == 'true' && steps.leak_scan.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: uat-compose-logs-${{ github.job }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/uat-compose-logs
          if-no-files-found: warn
          retention-days: 14

  nightly:
    # schedule = the 07:00Z nightly; workflow_dispatch = on-demand proof of the
    # full-suite path (cinatra#173). The full suite runs regardless of paths.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ vars.WP_DRUPAL_UAT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 50
    services:
      postgres:
        # postgres:18-alpine matches docker-compose.yml's Postgres major so CI
        # exercises the same engine `cinatra setup dev` provisions against.
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # In-repo, zero-secret app-service env mirroring dashboard-live-verify.yml
      # (and the uat-gate job above). Job-level env reaches the composite
      # action's steps, so `cinatra setup dev` finds SUPABASE_DB_URL + a live DB
      # on ubuntu-latest. (cinatra#173)
      SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:5434/postgres
      REDIS_URL: redis://127.0.0.1:6379
      # scripted-test-provider.ts fail-CLOSES unless this is exactly 'development'
      # (and NODE_ENV != production); `setup dev` also asserts development.
      CINATRA_RUNTIME_MODE: development
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_BETTER_AUTH_URL: http://localhost:3000
      # App-side wayflow endpoint (compose publishes 3010) — same rationale as
      # the uat-gate job: the app's agent-marker-backfill reload is a silent
      # no-op without it and the widget-stream relay then 404s on the agent
      # card (wayflow scanned the just-cloned, markerless tree at startup).
      WAYFLOW_BASE_URL: http://localhost:3010
      # cinatra#1919 — provide the public MCP URL the hosted-LLM write path needs.
      # `setup dev`'s self-establish cannot bring up a Tailscale Funnel in CI (no
      # sidecar, no TS_AUTHKEY), so without an operator-supplied URL the MCP
      # settings row stays URL-less, `hasLlmMcpAccess` is false, and the widget
      # answers "No LLM provider configured" — the 4 previously-red assertions.
      # This is the container-reachable app origin the WP/Drupal + wayflow
      # containers already target (CINATRA_BASE_URL=http://host.docker.internal:3000
      # via the compose host-gateway mapping), so the agent's MCP tool-call write
      # path resolves it. Being an EXPLICIT operator URL it also makes the CLI's
      # self-establish stand down at its first gate (no hostname prediction, so no
      # dependence on the extensions-tree declarer) — green here does not wait on
      # the CLI release wave. Non-localhost, so it is accepted (localhost is refused).
      MCP_PUBLIC_BASE_URL: http://host.docker.internal:3000
      # Presence-only — next.config.ts REQUIRED_ENV asserts it at dev-server
      # startup; the UAT uses the deterministic scripted provider, never a real
      # OpenAI call. Zero-secret placeholder (mirrors dashboard-live-verify.yml).
      OPENAI_API_KEY: ci-placeholder-not-used-by-wp-drupal-uat
    steps:
      - name: Reclaim runner disk (full UAT stack + browsers exhaust ubuntu-latest)
        # The 2026-07-07 on-demand proof (run 28865808274) died with "No space
        # left on device" at the end of the suite: WP+Drupal+nango+app images,
        # pnpm store, Next build cache and Playwright browsers together overflow
        # the ~14 GB free on ubuntu-latest. Drop the large preinstalled
        # toolchains this job never uses (same idiom as the works-after proof).
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Enlarge swap + record the memory baseline
        # Identical to the uat-gate job's step — see the rationale there: the
        # silent mid-suite stalls were a MEMORY cliff, not a disk one, and the
        # nightly runs the same full stack on the same runner class.
        run: |
          set -euo pipefail
          # ADDITIVE: a dedicated swapfile ALONGSIDE whatever the image already
          # has. Deliberately no `swapoff -a` — disabling every existing swap
          # device first would leave the box with LESS headroom during the
          # window it takes to build the new file, and would mask a real failure
          # to detach an in-use device.
          if swapon --show=NAME --noheadings | grep -qx /mnt/cinatra-uat-swap; then
            sudo swapoff /mnt/cinatra-uat-swap
          fi
          sudo rm -f /mnt/cinatra-uat-swap
          sudo fallocate -l 16G /mnt/cinatra-uat-swap
          sudo chmod 600 /mnt/cinatra-uat-swap
          sudo mkswap /mnt/cinatra-uat-swap
          sudo swapon /mnt/cinatra-uat-swap
          # Prefer reclaiming page cache over swapping; swap here is the cliff
          # guard of last resort, not a routine tier.
          sudo sysctl -w vm.swappiness=10
          swapon --show
          free -m
          nproc
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # MASK-AT-MINT — identical to the uat-gate job's block; see the rationale
      # there. The runner's per-step job-env dump renders these values in a
      # PUBLIC log, so each is registered with the log masker before it is
      # written anywhere, and the diagnostic print is name + length only.
      - name: Derive BETTER_AUTH_SECRET (throwaway, per-run)
        run: |
          set -euo pipefail
          minted="$(openssl rand -hex 32)"
          echo "::add-mask::$minted"
          printf 'BETTER_AUTH_SECRET=%s\n' "$minted" >> "$GITHUB_ENV"
          echo "minted BETTER_AUTH_SECRET (${#minted} chars)"
      - name: Derive NANGO_ENCRYPTION_KEY (throwaway base64 32-byte, per-run)
        # docker-compose.yml's nango-server (default profile, always started by
        # the composite action's `docker compose --profile wordpress --profile
        # drupal up`) interpolates `NANGO_ENCRYPTION_KEY: ${NANGO_ENCRYPTION_KEY}`
        # from the runner env. Unset → nango boots with a BLANK key and fails
        # (cinatra#665, the nightly-red root cause). nango-server REQUIRES a
        # base64-encoded 32-byte AES key (mirrors scripts/ci/works-after/nango.sh's
        # wa_throwaway_b64key). THROWAWAY crypto minted per run — never an ops
        # secret. Exported to $GITHUB_ENV so the job env reaches the composite
        # action's `docker compose up` step.
        run: |
          set -euo pipefail
          minted="$(openssl rand -base64 32)"
          echo "::add-mask::$minted"
          printf 'NANGO_ENCRYPTION_KEY=%s\n' "$minted" >> "$GITHUB_ENV"
          echo "minted NANGO_ENCRYPTION_KEY (${#minted} chars)"
      - name: Derive CINATRA_BRIDGE_TOKEN (throwaway, per-run)
        # Same rationale as the uat-gate job's step: the wayflow container's
        # boot preflight refuses to start without the bridge token, so the
        # widget-stream relay scenarios fail with "(no response)" unless the
        # job env carries it into `pnpm setup:dev` (which writes
        # docker/wayflow/.wayflow.env via scripts/gen-wayflow-env.mjs) and the
        # Playwright webServer `pnpm dev`. THROWAWAY crypto minted per run.
        run: |
          set -euo pipefail
          minted="$(openssl rand -hex 32)"
          echo "::add-mask::$minted"
          printf 'CINATRA_BRIDGE_TOKEN=%s\n' "$minted" >> "$GITHUB_ENV"
          echo "minted CINATRA_BRIDGE_TOKEN (${#minted} chars)"
      - name: Derive CINATRA_CONTEXT_ATTEST_KEY (throwaway, per-run)
        # Same rationale as the uat-gate job's step: the wayflow boot preflight
        # also refuses to start without the per-node context-attestation key. One
        # derivation into the job env reaches BOTH the container (via
        # scripts/gen-wayflow-env.mjs -> docker/wayflow/.wayflow.env) and the app
        # (`pnpm dev`), sharing the SAME key. THROWAWAY crypto minted per run.
        run: |
          set -euo pipefail
          minted="$(openssl rand -hex 32)"
          echo "::add-mask::$minted"
          printf 'CINATRA_CONTEXT_ATTEST_KEY=%s\n' "$minted" >> "$GITHUB_ENV"
          echo "minted CINATRA_CONTEXT_ATTEST_KEY (${#minted} chars)"
      - name: Assert app-service env present (regression pin for cinatra#173)
        # Env-presence guard ONLY (runs in the caller, BEFORE the composite
        # action installs `pg`). Postgres reachability is already guaranteed by
        # the services.postgres healthcheck (steps don't start until it passes).
        run: |
          : "${SUPABASE_DB_URL:?cinatra#173 regression: SUPABASE_DB_URL must be exported (postgres service + job env) before cinatra setup dev}"
          : "${BETTER_AUTH_SECRET:?cinatra#173 regression: BETTER_AUTH_SECRET must be derived (openssl rand) before cinatra setup dev}"
          : "${NANGO_ENCRYPTION_KEY:?cinatra#665 regression: NANGO_ENCRYPTION_KEY must be derived (openssl rand -base64 32) before docker compose up — nango-server boots blank otherwise}"
          : "${CINATRA_BRIDGE_TOKEN:?regression pin: CINATRA_BRIDGE_TOKEN must be derived (openssl rand) before cinatra setup dev — the wayflow runtime refuses to boot without it and the widget-stream relay scenarios fail with '(no response)'}"
          : "${CINATRA_CONTEXT_ATTEST_KEY:?regression pin: CINATRA_CONTEXT_ATTEST_KEY must be derived (openssl rand) before cinatra setup dev — the wayflow boot preflight refuses to start without it, and the artifact leak scan below cannot report a trustworthy result for an unset value}"
          : "${OPENAI_API_KEY:?cinatra#173 regression: OPENAI_API_KEY placeholder must be set (next.config.ts REQUIRED_ENV) before the dev server boots}"
          : "${CINATRA_RUNTIME_MODE:?cinatra#173 regression: CINATRA_RUNTIME_MODE=development required (scripted provider fail-closes otherwise)}"
          echo "app-service env present"
      # cinatra#2131 — same capture the uat-gate job runs; see the rationale
      # there. The nightly hosts the identical stack on the identical runner
      # class, so it is exactly where the next resource incident shows up.
      - name: Start the periodic resource sampler
        run: |
          bash scripts/ci/uat-diagnostics.sh sampler-start \
            "$RUNNER_TEMP/uat-diagnostics/resource-samples.txt" \
            "$RUNNER_TEMP/uat-sampler.pid" 30
      - name: Run full UAT suite
        uses: cinatra-ai/ci/.github/actions/wp-drupal-uat-run@72d0b1caa9b11e33a9ba3e65e55aae46ad844bf1 # v0.1.0-ci61-merged.9f228d7
        with:
          # OPTIONAL — devApp repos are public (anonymous HTTPS clone). Forwarded
          # when configured so a future private flip keeps working unchanged.
          deploy-key: ${{ secrets.WP_DRUPAL_UAT_DEPLOY_KEY }}
      - name: Stop the periodic resource sampler
        if: always()
        run: |
          bash scripts/ci/uat-diagnostics.sh sampler-stop \
            "$RUNNER_TEMP/uat-sampler.pid" \
            "$RUNNER_TEMP/uat-diagnostics/resource-samples.txt"
      - name: Capture docker compose logs (failure path)
        if: failure()
        run: bash scripts/ci/uat-diagnostics.sh compose-logs "$RUNNER_TEMP/uat-compose-logs"
      # Same fail-closed gate as the uat-gate job: the uploads are conditional on
      # this step's OUTCOME, because a red step does not prevent a later
      # `always()` / `failure()` step from running.
      - name: Verify no minted value reached the staged artifacts
        id: leak_scan
        if: always()
        run: |
          bash scripts/ci/uat-diagnostics.sh scan \
            "$RUNNER_TEMP/uat-diagnostics" \
            "$RUNNER_TEMP/uat-compose-logs"
      - name: Upload the resource snapshot
        if: ${{ always() && steps.leak_scan.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: uat-resource-snapshot-${{ github.job }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/uat-diagnostics
          if-no-files-found: warn
          retention-days: 14
      - name: Upload the docker compose logs
        if: ${{ failure() && steps.leak_scan.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: uat-compose-logs-${{ github.job }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/uat-compose-logs
          if-no-files-found: warn
          retention-days: 14

  # cinatra#2131 — public-log masking assertion for the per-run minted values.
  #
  # Runs as its OWN job because a job cannot read its own log: the log blob is
  # only published once the job COMPLETES, and the values cannot be handed
  # forward either (masked values are redacted out of job outputs — the masking
  # working as designed). So this reads the finished UAT job log from the same
  # run and asserts the leak site directly: every rendering of the four minted
  # env keys must show `***`. Values themselves are checked in-job by the
  # `Verify no minted value reached the staged artifacts` step above, which
  # greps the real in-memory values across everything staged for upload.
  mask-verify:
    needs: [uat-gate, nightly]
    if: ${{ always() && (contains(fromJSON('["success", "failure"]'), needs.uat-gate.result) || contains(fromJSON('["success", "failure"]'), needs.nightly.result)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # read this run's own job log
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
      - name: Every minted value renders masked in this run's public job log
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/uat-mask-verify.mjs
