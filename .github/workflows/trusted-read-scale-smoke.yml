# Trusted-read native-injection — provider-scale proof (cinatra#2019).
#
# Boots the pinned WordPress fixture (the SAME `wordpress` docker-compose
# profile the S1 capture workflow uses — see wp-mcp-gateway-capture.yml) and
# runs the live half of the provider-scale proof harness against it:
# `src/lib/__tests__/connector-instance-native-read-injection-live-scale-smoke.test.ts`.
# That test is a normal vitest file that self-skips everywhere else (including
# the wholesale root suite) unless WP_BASE_URL + WP_MCP_BASIC_AUTH are set —
# this job is the only place that sets them.
#
# What the live test proves against the REAL fixture (docker/wordpress/
# scale-smoke-plugin — a dedicated, first-class MCP server carrying 64
# read-only tools, kept as its own plugin so it never marks the S1
# annotation-transport captures stale):
#   - the injection builder -> the provider materializer -> the shared
#     per-provider approval-vocabulary boundary carries all of a server's
#     tools through with no truncation and zero skipped entries, for both
#     providers the trusted-read feature supports (openai, anthropic);
#   - on the PINNED default adapter server, with the descriptor set cinatra
#     actually ships today, opting a site into trusted-site mode still
#     injects NOTHING — the "ships dark" guarantee, proven live rather than
#     assumed. This is also the post-merge live proof that the WordPress
#     connector's real gate (wordpress-mcp-connector#91) behaves the same way
#     against a real site.
#
# NOT a required status check (same posture as wp-mcp-gateway-capture.yml):
# it is evidence for human review on this PR, and a recurring drift check
# afterward. The synthetic, fully-deterministic half of this proof (64 tools x
# 3 connector instances x 3 servers, no live stack needed) runs in the normal
# root Vitest suite via
# src/lib/__tests__/connector-instance-native-read-injection-scale-matrix.test.ts
# and IS part of the required gate of record (perpetual-loops-invariants ->
# `pnpm test:root`).
#
# cinatra#2024 (S9 program acceptance, item A): this job also runs the M1
# GOVERNED-INVOKER live counterpart
# (src/lib/__tests__/connector-instance-invoker-live-scale-smoke.test.ts) —
# the real-provider-round-trip proof PR #2189 itself deferred to program
# acceptance ("real provider round-trips deferred to program acceptance").
# It reuses the SAME already-booted fixture and minted app password this job
# already produces for the M2 live test above; no extra boot step. Its own
# synthetic half (connector-instance-invoker-scale-matrix.test.ts) likewise
# runs in the normal root Vitest suite, not here.

name: Trusted-Read Scale Smoke

on:
  workflow_dispatch: {}
  schedule:
    - cron: "10 6 * * 1" # weekly Monday 06:10 UTC — offset from the S1 capture's 05:23 slot
  pull_request:
    paths:
      - ".github/workflows/trusted-read-scale-smoke.yml"
      - "docker/wordpress/scale-smoke-plugin/**"
      - "docker/wordpress/Dockerfile"
      - "docker-compose.yml"
      - "scripts/wordpress-entrypoint.sh"
      - "src/lib/connector-instance-native-read-injection.ts"
      - "src/lib/connector-instance-trusted-read-verifier.ts"
      - "src/lib/connector-instance-trusted-read-descriptors.ts"
      - "src/lib/connector-instance-catalog-cache.ts"
      - "src/lib/mcp-approval-vocabulary.ts"
      - "packages/llm/src/mcp-materializer.ts"
      - "src/lib/__tests__/connector-instance-native-read-injection-live-scale-smoke.test.ts"
      - "src/lib/__tests__/connector-instance-native-read-injection-scale-matrix.test.ts"
      - "src/lib/connector-instance-invoker.ts"
      - "src/lib/connector-instance-mcp-transport.ts"
      - "src/lib/connector-instance-snapshot-loader.ts"
      - "src/lib/__tests__/connector-instance-invoker-live-scale-smoke.test.ts"
      - "src/lib/__tests__/connector-instance-invoker-scale-matrix.test.ts"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scale-smoke:
    name: Live provider-scale proof (boot pinned fixture)
    runs-on: ${{ vars.WP_DRUPAL_UAT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - name: Reclaim runner disk (image build can exhaust ubuntu-latest)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          df -h /
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # No later step needs the git token (public-registry install, local
          # docker build, no pushes) — don't leave it in .git/config while
          # building and running an image from repository content.
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Boot pinned WordPress fixture (wordpress profile — WP + db only)
        run: docker compose --profile wordpress up -d --build wordpress wordpress-db
      - name: Wait for MCP default + scale-smoke servers ready
        # Same route-up signal convention as wp-mcp-gateway-capture.yml: 200/
        # 405/401 all prove the MCP route is registered + serving (a missing
        # route 404s; a plain-permalink site 301-redirects).
        run: |
          wait_ready() {
            path="$1"
            for i in $(seq 1 90); do
              code=$(curl -s -o /dev/null -w '%{http_code}' -I "http://localhost:8080${path}" --max-time 5 || echo 000)
              if [ "$code" = "200" ] || [ "$code" = "405" ] || [ "$code" = "401" ]; then
                echo "${path} ready after ${i} tries (HTTP ${code})"
                return 0
              fi
              sleep 5
            done
            echo "::error::${path} not ready in ~7.5 min"
            docker compose --profile wordpress logs wordpress | tail -200
            return 1
          }
          wait_ready "/wp-json/mcp/mcp-adapter-default-server"
          wait_ready "/wp-json/scalesmoke/scalesmoke-server"
          docker exec cinatra-wordpress-1 wp core version --allow-root | grep -E '^6\.9\.' || { echo "::error::core version is not 6.9.*"; exit 1; }
      - name: Mint per-run app password (no committed secret)
        # The credential is minted at runtime, so GitHub cannot auto-redact it
        # like a stored secret — mask BOTH the raw password and the derived
        # base64 Basic value before either can reach a log line.
        run: |
          APPPW=$(docker exec cinatra-wordpress-1 wp user application-password create admin scale-smoke --porcelain --allow-root)
          echo "::add-mask::$APPPW"
          BASIC_B64=$(printf 'admin:%s' "$APPPW" | base64 -w0)
          echo "::add-mask::$BASIC_B64"
          echo "WP_MCP_BASIC_AUTH=$BASIC_B64" >> "$GITHUB_ENV"
      - name: Run the live provider-scale proof
        env:
          WP_BASE_URL: http://localhost:8080
          WP_MCP_BASIC_AUTH: ${{ env.WP_MCP_BASIC_AUTH }}
        run: >-
          pnpm exec vitest run --config vitest.config.ts --no-coverage
          src/lib/__tests__/connector-instance-native-read-injection-live-scale-smoke.test.ts
      - name: Run the live M1 governed-invoker provider-scale proof (cinatra#2024 S9 item A)
        env:
          WP_BASE_URL: http://localhost:8080
          WP_MCP_BASIC_AUTH: ${{ env.WP_MCP_BASIC_AUTH }}
        run: >-
          pnpm exec vitest run --config vitest.config.ts --no-coverage
          src/lib/__tests__/connector-instance-invoker-live-scale-smoke.test.ts
      - name: Compose logs (always)
        if: ${{ always() }}
        run: |
          docker compose --profile wordpress logs > compose-logs.txt 2>&1 || true
      - name: Upload compose logs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trusted-read-scale-smoke-compose-logs
          path: compose-logs.txt
          if-no-files-found: warn
          retention-days: 7
