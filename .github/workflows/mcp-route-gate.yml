# MCP machine-flow route guard + advertised-URL route-shape test.
#
# The MCP OAuth handshake pages (auth / account / consent) live under
# src/app/api/mcp/* adjacent to the JSON-RPC server endpoint; the human-facing
# admin config pages stay under src/app/admin/mcp/*. This workflow runs two
# guards on every PR + push to main:
#
#   1. administration-mcp-machine-flow-banned.mjs — prevents machine-flow
#      routes from drifting back into the admin namespace.
#   2. advertised-url-routes.test.ts — asserts every OAuth handshake URL the
#      server advertises resolves to a real route file under src/app/api/mcp/*.
#
# A dedicated workflow (rather than build-image.yml) keeps the guards independent
# of the build job and runs them even on docs-only changes.

name: MCP Route Gate

on:
  pull_request:
    # Draft PRs skip this gate; it runs on push-to-main and non-draft PRs
    # (ready_for_review re-runs it when a draft is marked ready).
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# cinatra#3355 — the committed worker cap for every vitest invocation in this
# workflow (a workflow-level `env:` is in scope for the steps of every job in
# the file). The value is the INTERIM worker count cinatra#3355 records, now
# given a committed home in the tree; that issue's criterion-3 comparison of
# runner and worker configurations may replace it. It makes no claim about what
# the runner services on the box carry today.
# Enforced by scripts/audit/vitest-worker-cap.mjs.
env:
  VITEST_MAX_WORKERS: "3"

jobs:
  # ---------------------------------------------------------------------------
  # changes — does this pull request touch anything the job below reads?
  # (cinatra#3508)
  #
  # On `pull_request` dorny/paths-filter reads the PR's changed files from the
  # REST API (needs `pull-requests: read`) — no checkout, ~5s, no services. On
  # every other event (push to main, merge_group) there is no changed-file set
  # to read, so the output is forced true and the job below runs for real.
  #
  # The guard is JOB-level, never a `paths:` trigger filter: a guarded job that
  # does not run still reports `skipped`, which branch protection counts as
  # passing, while a filtered-out WORKFLOW never reports at all and leaves a
  # required context waiting forever.
  # ---------------------------------------------------------------------------
  changes:
    name: Detect changed paths (mcp-route-gate)
    runs-on: ${{ fromJSON(vars.CI_RUNNER_GATE || '"ubuntu-latest"') }}
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      mcp: ${{ github.event_name != 'pull_request' || steps.filter.outputs.mcp == 'true' }}
    steps:
      - id: filter
        if: ${{ github.event_name == 'pull_request' }}
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            mcp:
              # Derived from the job's two steps: `MCP machine-flow route banned
              # gate` walks the tracked tree but only ever OPENS the SCAN_EXTS
              # extensions of scripts/audit/administration-mcp-machine-flow-banned.mjs
              # (.ts .tsx .js .jsx .mjs .cjs .mts .cts .md .mdx .json .yml .yaml),
              # and `MCP advertised-URL route shape test` runs the
              # packages/mcp-server suite against the src/app/api/mcp route files.
              - '.github/workflows/**'
              - '**/*.ts'
              - '**/*.tsx'
              - '**/*.js'
              - '**/*.jsx'
              - '**/*.mjs'
              - '**/*.cjs'
              - '**/*.mts'
              - '**/*.cts'
              - '**/*.md'
              - '**/*.mdx'
              - '**/*.json'
              - '**/*.yml'
              - '**/*.yaml'
              # administration-mcp-machine-flow-banned.mjs:50 also fails on the
              # mere EXISTENCE of a handshake directory inside one of the three
              # admin namespaces it guards, whatever the file extension inside
              # it, so those namespaces are matched wholesale. They are named by
              # their ROOT, never by a handshake route under it: that gate opens
              # every tracked .yml, this file included, and would read such a
              # literal here as one of the references it bans (9 violations on
              # its own guard, run 35027084267).
              - 'src/app/configuration/mcp/**'
              - 'src/app/admin/mcp/**'
              - 'src/app/administration/mcp/**'

  mcp-route-gate:
    needs: [changes]
    # A skipped job still reports `mcp-route-gate` as skipped, which branch
    # protection counts as a pass — the required context never hangs.
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.changes.outputs.mcp == 'true' }}
    runs-on: ${{ fromJSON(vars.CI_RUNNER_HEAVY || '"ubuntu-latest"') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: MCP machine-flow route banned gate
        run: node scripts/audit/administration-mcp-machine-flow-banned.mjs
      - name: MCP advertised-URL route shape test
        run: cd packages/mcp-server && pnpm exec vitest run src/__tests__/advertised-url-routes.test.ts --no-coverage
