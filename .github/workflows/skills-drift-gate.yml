name: skills-drift-gate

# Thin caller for the reusable cinatra-ai/ci skills-drift-gate (cinatra#188).
#
# Flags when a cinatra change touches a surface a successor-skill SKILL.md
# depends on (cinatra#2090 S3: the pinned skills universe is the UNION of the
# successor skill repos below) — a declared `cinatra-watches` surface (MCP
# primitive / @cinatra-ai/* package / route / source-path glob) or, for skills
# without a watch block, a verbatim-identifier heuristic — so the impacted
# skill is reviewed before it silently goes stale.
#
# ENFORCE mode: the gate now FAILS on an UNACKNOWLEDGED declared-watch finding.
# Heuristic findings remain advisory (reported, never gating), so only a precise,
# skill-declared surface change can block a PR. Resolve a finding with ONE of:
#   - Skills-PR: <#n|url> covers: <skill-slug>[, ...]   (linked assistant-skills PR)
#   - Skills-reviewed: <note>
#   - Skills-unaffected: <reason>                        (reason REQUIRED)
#
# Required-check context: a reusable workflow_call does NOT create its own check
# context; the context is surfaced under THIS caller's JOB name, formatted
# "<caller-job> / <reusable-job>". The job below is named `skills-drift-gate`
# and the reusable job is `skills-drift-gate`, so the required status check is
# "skills-drift-gate / skills-drift-gate" — same convention as
# "source-leak-gate / source-leak-gate". Registered as a required check on main
# after the cinatra#188 enforce proof cycle.
#
# cinatra-ONLY: this gate is wired into this repo and nothing else. It is NOT
# part of the org-wide min-repo-config rollout (cinatra is the only repo whose
# changes can drift the assistant-skills knowledge).

on:
  pull_request:
  # merge_group (engineering#484): post this required context on GitHub
  # merge-queue candidates so a queue entry never hangs on the missing check.
  # The pinned engine (ci@4582648, a descendant of ci#59 @c3bc633) resolves the
  # incremental diff base from merge_group.base_sha via the shared
  # resolve-diff-base.sh resolver. Inert until a merge queue is enabled
  # (engineering#485).
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read
  # pull-requests:read is required by the bumped engine's PUSH arm (ci #57):
  # on a squash-merge to main it resolves the merged PR via
  # GET /commits/{sha}/pulls to read a PR-body-only Skills-* acknowledgement.
  # A reusable workflow's scope is capped by the caller, so this MUST be
  # granted here in the SAME change as the pin bump or the run fails at
  # startup (same rule as the attribution caller's actions:read).
  pull-requests: read

jobs:
  # KEEP this job name stable as `skills-drift-gate` — it is the required-check
  # context prefix.
  skills-drift-gate:
    # Double-pin per the workflow-pinning convention: the workflow ref (@<sha>) and the
    # `ref` input below are pinned to the SAME cinatra-ai/ci commit (the
    # multi-repo-capable gate, cinatra-ai/ci#82), so the gate code is never
    # pulled from mutable main.
    uses: cinatra-ai/ci/.github/workflows/skills-drift-gate.yml@3cc2f075fb91341e2f81870e258cbe0606c2a56b # v0.1.2-next.3cc2f07
    with:
      # Successor-skill pins (cinatra#2090 S3): the former single
      # @cinatra-ai/assistant-skills pack was consolidated into six successor
      # skill repos; the watch-bearing SKILL.mds (and their cinatra-watches
      # unions) now live in the five injectable routers, and the internal
      # hitl bundle rides along so the whole required set is watched. Each
      # entry below is kept in STRICT LOCKSTEP with that repo's resolvedSha
      # in cinatra-required-extensions.lock.json — at each required-extensions
      # lock refresh, re-pin the matching entry to the new resolvedSha written
      # into the lock, in the SAME change (the same rule the retired single
      # skills_ref pin followed; its last value, 92fb85a, lagged the final
      # assistant-skills lock pin fef2b294 by one commit — this re-pin absorbs
      # that lag by construction, since the successor tips were extracted from
      # fef2b294).
      skills_repos: |
        cinatra-ai/chat-assistant-core-skill@2cb491e1e3ccf7fe946b253254f2e7a4d509bc55
        cinatra-ai/extension-authoring-skill@01c040e6453a08f8de128bc40b7b9047793fde1a
        cinatra-ai/automation-authoring-skill@596afabf6a10b8f1f297521fcb7d1f78fb70213b
        cinatra-ai/company-research-skill@639fdc073b7d600a8436900843bfd3ac42778743
        cinatra-ai/blog-content-skill@163f73c05b441b61799a2db203f8ce873ec8aae7
        cinatra-ai/hitl-prompt-drive-skill@81edce91254e677d7e68269503f3cf22fe7c9a2d
      mode: enforce
      ref: 3cc2f075fb91341e2f81870e258cbe0606c2a56b # same SHA as the workflow @ref
