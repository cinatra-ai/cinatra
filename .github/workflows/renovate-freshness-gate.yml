name: renovate-freshness-gate

# Detectable-dormancy guard for the hosted Renovate (Mend) app on THIS repo.
#
# Renovate rewrites its Dependency Dashboard issue on every run it completes, so
# a frozen `updatedAt` means the hosted app has stopped executing against this
# repo — even while the org-wide installation keeps running sibling repos. That
# is exactly what happened in cinatra#1632: the dashboard (#164) sat stale from
# 2026-07-01, a manually-checked "run again" box went unhonored, and dependency
# currency silently reverted to manual bump waves (better-auth drifted 5 patch
# releases behind). Schedule/config cannot cause this — a manual-run request
# bypasses the schedule and still could not freeze the dashboard.
#
# This scheduled check fails AND surfaces a tracking issue when the dashboard's
# `updatedAt` exceeds the freshness window (weekly Renovate schedule + grace =
# 10 days), so a dead bot can never again masquerade as "no updates available".
# It owns its own green path: a fresh dashboard passes silently and auto-closes
# any prior alert.
#
# Systemic counterpart: engineering#552 adds the same input-freshness gate to
# the closeout dependency-currency wave (a per-milestone ceremony check). This
# workflow is the continuous, always-on detector between closeouts.

on:
  schedule:
    - cron: "23 6 * * *" # daily 06:23 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: renovate-freshness-gate
  cancel-in-progress: false

jobs:
  freshness:
    if: github.repository == 'cinatra-ai/cinatra'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      # Freshness window: weekly Renovate schedule ("before 6am on monday") + grace.
      MAX_AGE_DAYS: "10"
      # Idempotency key: at most one open alert issue, edited in place.
      ALERT_LABEL: "renovate-health"
    steps:
      - name: Evaluate Dependency Dashboard freshness
        run: |
          set -euo pipefail
          REPO="${GITHUB_REPOSITORY}"

          # Ensure the idempotency label exists (no-op if already present).
          gh label create "$ALERT_LABEL" \
            --repo "$REPO" \
            --color "b60205" \
            --description "Renovate bot-health / freshness-gate alerts" \
            2>/dev/null || true

          # Resolve the Renovate Dependency Dashboard issue by author + exact title.
          # Not hardcoded to a number so the check survives a dashboard re-create.
          updated="$(gh issue list --repo "$REPO" \
            --search 'Dependency Dashboard in:title author:app/renovate' \
            --state open --json number,updatedAt,title \
            --jq 'map(select(.title=="Dependency Dashboard")) | (first.updatedAt // "")')"
          dash_num="$(gh issue list --repo "$REPO" \
            --search 'Dependency Dashboard in:title author:app/renovate' \
            --state open --json number,updatedAt,title \
            --jq 'map(select(.title=="Dependency Dashboard")) | (first.number // "")')"

          if [ -z "$updated" ]; then
            stale=1
            age_days="n/a"
            reason="No open **Dependency Dashboard** issue authored by \`app/renovate\` was found. Renovate has either never onboarded or its dashboard was deleted."
            echo "::error::No open Renovate 'Dependency Dashboard' issue found."
          else
            now_s=$(date -u +%s)
            upd_s=$(date -u -d "$updated" +%s)
            age_secs=$(( now_s - upd_s ))
            max_secs=$(( MAX_AGE_DAYS * 86400 ))
            age_days=$(( age_secs / 86400 )) # display only; comparison is on seconds
            echo "Dependency Dashboard #${dash_num} updatedAt=${updated} age=${age_days}d (${age_secs}s) threshold=${MAX_AGE_DAYS}d (${max_secs}s)"
            # Compare on seconds so a dashboard 10d23h old trips at the 10-day mark,
            # not only at a full 11 days (integer-day flooring would delay detection).
            if [ "$age_secs" -gt "$max_secs" ]; then
              stale=1
              reason="The Renovate **Dependency Dashboard** (#${dash_num}) was last updated \`${updated}\` — **${age_days} days** ago, exceeding the ${MAX_AGE_DAYS}-day freshness window (weekly Renovate schedule + grace). Renovate refreshes the dashboard on every completed run, so a frozen timestamp means the hosted Renovate (Mend) app has stopped executing against this repo."
            else
              stale=0
            fi
          fi

          # Find any existing open alert issue (label-keyed; at most one).
          existing="$(gh issue list --repo "$REPO" \
            --label "$ALERT_LABEL" --state open \
            --json number --jq '(first.number // "")')"

          if [ "$stale" = "0" ]; then
            echo "Dashboard is fresh (${age_days}d <= ${MAX_AGE_DAYS}d). Silent pass."
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --repo "$REPO" \
                --body "Auto-resolved by \`renovate-freshness-gate\`: the Dependency Dashboard is fresh again (last updated ${age_days} day(s) ago, within the ${MAX_AGE_DAYS}-day window). Closing."
              gh issue close "$existing" --repo "$REPO" --reason completed
            fi
            exit 0
          fi

          # --- Stale path: surface a tracking issue, then fail the job. ---
          dash_ref=""
          [ -n "$dash_num" ] && dash_ref="#${dash_num}"
          body_file="${RUNNER_TEMP:-/tmp}/renovate-freshness-body.md"
          {
            printf '## Renovate appears dormant on this repository\n\n'
            printf '%s\n\n' "$reason"
            printf '**Dashboard:** %s · [Mend web portal](https://developer.mend.io/github/%s)\n' "$dash_ref" "$REPO"
            printf '**Freshness window:** %s days · **Observed age:** %s day(s)\n' "$MAX_AGE_DAYS" "$age_days"
            printf '**Detected by:** `.github/workflows/renovate-freshness-gate.yml` (run: %s/%s/actions/runs/%s)\n\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            printf '### What this means\n'
            printf 'A stale dashboard is not a schedule symptom — a manual dashboard "run again" request\n'
            printf 'bypasses the schedule, and neither that nor the schedule can freeze the dashboard.\n'
            printf 'It means the hosted Renovate (Mend) app has stopped completing runs against this repo.\n\n'
            printf '### Owner action required (Mend developer portal — not fixable in-repo)\n'
            printf '1. Open https://developer.mend.io/github/%s (authenticated as a cinatra-ai admin).\n' "$REPO"
            printf '2. Read the latest job log for this repo; look for a run error / "job disabled" / resource-limit / paused state.\n'
            printf '3. Clear the error state and trigger a run (portal "Recheck" / "Run now"), or reset onboarding if the portal offers it.\n'
            printf '4. Confirm this issue auto-closes on the next `renovate-freshness-gate` run once the dashboard refreshes.\n\n'
            printf 'Root-cause diagnosis and background: cinatra#1632. Systemic ceremony guard: engineering#552.\n'
          } > "$body_file"

          if [ -n "$existing" ]; then
            gh issue edit "$existing" --repo "$REPO" --body-file "$body_file"
            gh issue comment "$existing" --repo "$REPO" \
              --body "Still stale as of this run: dashboard age ${age_days} day(s) (> ${MAX_AGE_DAYS})."
            echo "Updated existing alert issue #${existing}."
          else
            new="$(gh issue create --repo "$REPO" \
              --title "Renovate dormant: Dependency Dashboard stale (freshness gate)" \
              --label "$ALERT_LABEL" \
              --body-file "$body_file")"
            echo "Opened alert issue: ${new}"
          fi

          echo "::error::Renovate Dependency Dashboard is stale/missing (age=${age_days}, threshold=${MAX_AGE_DAYS}d) — hosted Renovate is not running on this repo. See the surfaced alert issue."
          exit 1
