name: renovate-freshness-gate

# Detectable-dormancy guard for Renovate on THIS repo.
#
# Renovate rewrites its Dependency Dashboard issue on every run it completes, so
# a frozen dashboard means Renovate has stopped executing against this repo —
# whatever is meant to be executing it.
#
# WHICH RENOVATE: this gate was written against the hosted Mend app, which went
# dormant twice (cinatra#1632, cinatra#2241). The runs now come from
# `.github/workflows/renovate-self-hosted.yml` — the same Renovate, executed
# here, authenticating as the org bot GitHub App instead of Mend's
# `renovate[bot]`. The gate is therefore IDENTITY-AGNOSTIC: a dashboard write by
# ANY recognised Renovate identity (see RENOVATE_LOGINS below) proves a run. It
# keeps accepting the Mend identity so the historical dashboard, and the hosted
# app while it is still installed, still count.
#
# Freshness is measured from the last RENOVATE-AUTHORED write to the dashboard
# (the issue's edit history via GraphQL `userContentEdits`, falling back to the
# issue's creation), NOT from the issue's `updatedAt`. Any human edit — e.g.
# ticking a dashboard checkbox — also bumps `updatedAt` and can mask a dead
# bot. That is exactly what happened in cinatra#1632: Renovate's last dashboard
# write was 2026-06-14, but an owner checkbox tick on 2026-07-01 pushed
# `updatedAt` forward and hid seventeen days of dormancy (and anchored the
# initial diagnosis to the wrong date). A Renovate-authored write is the only
# dashboard signal that proves a completed run.
#
# (Both signals share one benign limitation: Renovate edits the issue only when
# the body actually changes, so a fully static dependency landscape for longer
# than the window would false-alarm either way; in practice the dashboard
# churns at least weekly. This revision strictly removes the false-NEGATIVE
# class — human edits masking a dead bot — without adding false positives.)
#
# This scheduled check fails AND surfaces a tracking issue when the last
# Renovate-authored dashboard write exceeds the freshness window (weekly
# Renovate schedule + grace = 10 days), so a dead bot can never again
# masquerade as "no updates available". It owns its own green path: a fresh
# dashboard passes silently and auto-closes any prior alert.
#
# Systemic counterpart: engineering#552 adds the same input-freshness gate to
# the closeout dependency-currency wave (a per-milestone ceremony check). This
# workflow is the continuous, always-on detector between closeouts.

on:
  schedule:
    - cron: "23 6 * * *" # daily 06:23 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: renovate-freshness-gate
  cancel-in-progress: false

jobs:
  freshness:
    if: github.repository == 'cinatra-ai/cinatra'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      # Freshness window: weekly Renovate schedule ("before 6am on monday") + grace.
      MAX_AGE_DAYS: "10"
      # Idempotency key: at most one open alert issue, edited in place.
      ALERT_LABEL: "renovate-health"
      # Identities whose dashboard write counts as "Renovate ran". Space-separated
      # GraphQL Bot logins (no `app/` prefix; the REST/`gh` listing adds one and
      # is normalised before comparing):
      #   renovate     — the hosted Mend app (historical writes; still installed)
      #   groganz-bot  — the org bot App that self-hosted Renovate runs as
      # Adding an identity here is what makes an executor swap a non-event for
      # this gate. Dropping `renovate` before the hosted app is uninstalled would
      # blind the gate to whichever of the two actually ran.
      RENOVATE_LOGINS: "renovate groganz-bot"
    steps:
      - name: Evaluate Dependency Dashboard freshness
        run: |
          set -euo pipefail
          REPO="${GITHUB_REPOSITORY}"
          OWNER="${REPO%%/*}"
          NAME="${REPO#*/}"

          # Ensure the idempotency label exists (no-op if already present).
          gh label create "$ALERT_LABEL" \
            --repo "$REPO" \
            --color "b60205" \
            --description "Renovate bot-health / freshness-gate alerts" \
            2>/dev/null || true

          # Recognised Renovate identities, as a jq array (see RENOVATE_LOGINS).
          allowed="$(jq -cn --arg s "$RENOVATE_LOGINS" '$s | split(" ") | map(select(length > 0))')"
          echo "Recognised Renovate identities: $(jq -r 'join(", ")' <<<"$allowed")"

          # Resolve the Dependency Dashboard by exact title, then keep the ones a
          # recognised Renovate identity authored. Searching on TITLE (rather than
          # `author:app/renovate`, as this gate did while Mend was the only
          # executor) is what makes an executor swap survive: Renovate scopes its
          # issue lookups to its own login, so a bot-account change can leave a
          # frozen dashboard from the old identity beside a live one from the new.
          # Freshness is the NEWEST write across ALL of them, so a superseded
          # dashboard can never pin this gate red — and a re-created dashboard is
          # still found, exactly as before (never hardcoded to a number).
          dash_json="$(gh issue list --repo "$REPO" \
            --search 'Dependency Dashboard in:title' \
            --state open --limit 100 --json number,title,author \
            | jq -c --argjson allowed "$allowed" \
              'map(select(.title == "Dependency Dashboard"
                          and ((.author.login // "") | ltrimstr("app/")) as $l
                          | $allowed | index($l)))
               | map(.number)')"
          mapfile -t DASH_NUMS < <(jq -r '.[]' <<<"$dash_json")
          echo "Dependency Dashboard candidates: ${DASH_NUMS[*]:-none}"

          last_bot_write=""
          dash_num=""
          for cand in "${DASH_NUMS[@]:-}"; do
            [ -n "$cand" ] || continue
            # Last RENOVATE-AUTHORED write: newest bot-authored body edit, or the
            # issue's creation if the bot has never edited it. Deliberately NOT
            # `updatedAt`: human edits (checkbox ticks, comments) bump that too
            # and would let a dead bot look alive (the cinatra#1632 masking).
            # The `userContentEdits` connection guarantees no ordering, so walk
            # ALL pages and take the max — sampling a page could miss the newest
            # bot write and false-alarm on a healthy bot. Page bound: 20 pages
            # (2000 edits) is far beyond any real dashboard; on early bail the
            # max over collected pages can only err toward a false RED, never a
            # false green.
            created_at=""
            author_login=""
            all_edits="[]"
            cursor=""
            page_no=0
            while [ "$page_no" -lt 20 ]; do
              page_no=$(( page_no + 1 ))
              page="$(gh api graphql \
                -f query='query($owner: String!, $name: String!, $num: Int!, $after: String) {
                  repository(owner: $owner, name: $name) {
                    issue(number: $num) {
                      createdAt
                      author { login }
                      userContentEdits(first: 100, after: $after) {
                        pageInfo { hasNextPage endCursor }
                        nodes { editedAt editor { login } }
                      }
                    }
                  }
                }' -f owner="$OWNER" -f name="$NAME" -F num="$cand" \
                ${cursor:+-f after="$cursor"})"
              if [ "$page_no" -eq 1 ]; then
                created_at="$(jq -r '.data.repository.issue.createdAt // ""' <<<"$page")"
                author_login="$(jq -r '.data.repository.issue.author.login // ""' <<<"$page")"
              fi
              batch="$(jq -c '.data.repository.issue.userContentEdits.nodes // []' <<<"$page")"
              all_edits="$(jq -c --argjson b "$batch" '. + $b' <<<"$all_edits")"
              has_next="$(jq -r '.data.repository.issue.userContentEdits.pageInfo.hasNextPage // false' <<<"$page")"
              cursor="$(jq -r '.data.repository.issue.userContentEdits.pageInfo.endCursor // ""' <<<"$page")"
              [ "$has_next" = "true" ] && [ -n "$cursor" ] || break
            done
            cand_write="$(jq -r --arg created "$created_at" --arg author "$author_login" --argjson allowed "$allowed" '
              (
                [ .[]
                  | ((.editor.login // "") | ltrimstr("app/")) as $l
                  | select($allowed | index($l))
                  | .editedAt ]
                | max
              )
              // (($author | ltrimstr("app/")) as $a
                  | if ($allowed | index($a)) then $created else "" end)
              // ""
            ' <<<"$all_edits")"
            echo "Dashboard #${cand}: last Renovate-authored write=${cand_write:-none} (author=${author_login:-unknown})"
            # Keep the NEWEST write across candidates. ISO-8601 UTC timestamps all
            # share one format, so lexical > is chronological here.
            if [ -n "$cand_write" ] && { [ -z "$last_bot_write" ] || [[ "$cand_write" > "$last_bot_write" ]]; }; then
              last_bot_write="$cand_write"
              dash_num="$cand"
            fi
          done

          # No candidate carried a provable bot write: still name one in the alert
          # so the reader has somewhere to look.
          if [ -z "$dash_num" ] && [ "${#DASH_NUMS[@]}" -gt 0 ]; then
            dash_num="${DASH_NUMS[0]}"
          fi

          if [ -z "$dash_num" ]; then
            stale=1
            age_days="n/a"
            reason="No open **Dependency Dashboard** issue authored by a recognised Renovate identity (\`${RENOVATE_LOGINS}\`) was found. Renovate has either never onboarded, its dashboard was deleted, or it now runs under an identity this gate does not yet recognise (extend \`RENOVATE_LOGINS\` in \`.github/workflows/renovate-freshness-gate.yml\`)."
            echo "::error::No open Renovate 'Dependency Dashboard' issue found."
          elif [ -z "$last_bot_write" ]; then
            stale=1
            age_days="n/a"
            reason="The Dependency Dashboard (#${dash_num}) exists but no write by a recognised Renovate identity (\`${RENOVATE_LOGINS}\`) was found in its collected edit history, and it was not created by one either — the dashboard no longer carries any provable bot activity."
            echo "::error::Dependency Dashboard #${dash_num}: no Renovate-authored write found."
          else
            now_s=$(date -u +%s)
            upd_s=$(date -u -d "$last_bot_write" +%s)
            age_secs=$(( now_s - upd_s ))
            max_secs=$(( MAX_AGE_DAYS * 86400 ))
            age_days=$(( age_secs / 86400 )) # display only; comparison is on seconds
            echo "Dependency Dashboard #${dash_num} last Renovate-authored write=${last_bot_write} age=${age_days}d (${age_secs}s) threshold=${MAX_AGE_DAYS}d (${max_secs}s)"
            # Compare on seconds so a dashboard 10d23h old trips at the 10-day mark,
            # not only at a full 11 days (integer-day flooring would delay detection).
            if [ "$age_secs" -gt "$max_secs" ]; then
              stale=1
              reason="The Renovate **Dependency Dashboard** (#${dash_num}) was last written by Renovate itself at \`${last_bot_write}\` — **${age_days} days** ago, exceeding the ${MAX_AGE_DAYS}-day freshness window (weekly Renovate schedule + grace). Renovate rewrites the dashboard on every completed run, so a frozen bot-write timestamp means NO Renovate executor — the self-hosted workflow, or the hosted Mend app while it is still installed — has completed a run against this repo. Newer HUMAN edits (e.g. ticking a dashboard checkbox) do not count: only a Renovate-authored write proves a completed run."
            else
              stale=0
            fi
          fi

          # Find any existing open alert issue (label-keyed; at most one).
          existing="$(gh issue list --repo "$REPO" \
            --label "$ALERT_LABEL" --state open \
            --json number --jq '(first.number // "")')"

          if [ "$stale" = "0" ]; then
            echo "Dashboard is fresh (${age_days}d <= ${MAX_AGE_DAYS}d). Silent pass."
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --repo "$REPO" \
                --body "Auto-resolved by \`renovate-freshness-gate\`: the Dependency Dashboard carries a Renovate-authored write from ${age_days} day(s) ago, within the ${MAX_AGE_DAYS}-day window. Closing."
              gh issue close "$existing" --repo "$REPO" --reason completed
            fi
            exit 0
          fi

          # --- Stale path: surface a tracking issue, then fail the job. ---
          dash_ref=""
          [ -n "$dash_num" ] && dash_ref="#${dash_num}"
          body_file="${RUNNER_TEMP:-/tmp}/renovate-freshness-body.md"
          {
            printf '## Renovate appears dormant on this repository\n\n'
            printf '%s\n\n' "$reason"
            printf '**Dashboard:** %s · **Recognised Renovate identities:** `%s`\n' "$dash_ref" "$RENOVATE_LOGINS"
            printf '**Freshness window:** %s days · **Observed age:** %s day(s) since the last Renovate-authored write\n' "$MAX_AGE_DAYS" "$age_days"
            printf '**Detected by:** `.github/workflows/renovate-freshness-gate.yml` (run: %s/%s/actions/runs/%s)\n\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            printf '### What this means\n'
            printf 'Freshness is measured from the last RENOVATE-AUTHORED dashboard write (issue edit\n'
            printf 'history), not `updatedAt` — human edits such as checkbox ticks bump `updatedAt`\n'
            printf 'and can mask a dead bot. A stale bot-write is not a schedule symptom — a manual\n'
            printf 'dashboard "run again" request bypasses the schedule and neither it nor the\n'
            printf 'schedule can freeze the dashboard. It means no Renovate executor has completed a\n'
            printf 'run against this repo inside the window.\n\n'
            printf '### Fix it here first (self-hosted Renovate — in-repo, no portal)\n'
            printf '1. Open the `renovate-self-hosted` workflow: %s/%s/actions/workflows/renovate-self-hosted.yml\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY"
            printf '2. Read the last run. Three distinct failures look identical from here:\n'
            printf '   - **red run** — open it, download the `renovate-log-*` artifact, read the error;\n'
            printf '   - **green run that did nothing** — the cron drifted outside the config schedule window (`before 6am on monday`, Europe/Berlin), so every update was skipped;\n'
            printf '   - **no run at all** — GitHub disables scheduled workflows after 60 days of repository inactivity, and a disabled workflow is silent. Re-enable it on that page.\n'
            printf '3. Re-run now: `gh workflow run renovate-self-hosted.yml -f dry_run=disabled` (the dispatch default is a DRY run and writes nothing).\n'
            printf '4. If the run is green and the dashboard still does not move, check that the bot App installation still has contents:write + pull_requests:write + issues:write on this repo, and that the `RENOVATE_APP_ID` / `RENOVATE_APP_PRIVATE_KEY` repository secrets are still set (a rotated App key fails the token-mint step loudly).\n'
            printf '5. Confirm this issue auto-closes on the next `renovate-freshness-gate` run once Renovate writes the dashboard again.\n\n'
            printf '### If the hosted Mend app is still the executor\n'
            printf 'Until the Mend app is uninstalled it may also be writing this dashboard. If the\n'
            printf 'self-hosted workflow is healthy and you are chasing the hosted app instead, its\n'
            printf 'state lives in the Mend developer portal (https://developer.mend.io/github/%s),\n' "$REPO"
            printf 'not in this repo; a portal reset alone was known-insufficient once already\n'
            printf '(2026-07-15, cinatra#1632). The self-hosted workflow exists precisely so this\n'
            printf 'branch of the runbook is no longer load-bearing.\n\n'
            printf 'Root-cause diagnosis and background: cinatra#1632, cinatra#2241. Systemic ceremony guard: engineering#552.\n'
          } > "$body_file"

          if [ -n "$existing" ]; then
            gh issue edit "$existing" --repo "$REPO" --body-file "$body_file"
            gh issue comment "$existing" --repo "$REPO" \
              --body "Still stale as of this run: last Renovate-authored dashboard write ${age_days} day(s) ago (> ${MAX_AGE_DAYS})."
            echo "Updated existing alert issue #${existing}."
          else
            new="$(gh issue create --repo "$REPO" \
              --title "Renovate dormant: Dependency Dashboard stale (freshness gate)" \
              --label "$ALERT_LABEL" \
              --body-file "$body_file")"
            echo "Opened alert issue: ${new}"
          fi

          echo "::error::Renovate Dependency Dashboard is stale/missing (age=${age_days}, threshold=${MAX_AGE_DAYS}d) — no Renovate executor is completing runs on this repo. See the surfaced alert issue."
          exit 1
