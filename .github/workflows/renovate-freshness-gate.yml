name: renovate-freshness-gate

# Detectable-dormancy guard for the hosted Renovate (Mend) app on THIS repo.
#
# Renovate rewrites its Dependency Dashboard issue on every run it completes, so
# a frozen dashboard means the hosted app has stopped executing against this
# repo — even while the org-wide installation keeps running sibling repos.
#
# Freshness is measured from the last RENOVATE-AUTHORED write to the dashboard
# (the issue's edit history via GraphQL `userContentEdits`, falling back to the
# issue's creation), NOT from the issue's `updatedAt`. Any human edit — e.g.
# ticking a dashboard checkbox — also bumps `updatedAt` and can mask a dead
# bot. That is exactly what happened in cinatra#1632: Renovate's last dashboard
# write was 2026-06-14, but an owner checkbox tick on 2026-07-01 pushed
# `updatedAt` forward and hid seventeen days of dormancy (and anchored the
# initial diagnosis to the wrong date). A Renovate-authored write is the only
# dashboard signal that proves a completed run.
#
# (Both signals share one benign limitation: Renovate edits the issue only when
# the body actually changes, so a fully static dependency landscape for longer
# than the window would false-alarm either way; in practice the dashboard
# churns at least weekly. This revision strictly removes the false-NEGATIVE
# class — human edits masking a dead bot — without adding false positives.)
#
# This scheduled check fails AND surfaces a tracking issue when the last
# Renovate-authored dashboard write exceeds the freshness window (weekly
# Renovate schedule + grace = 10 days), so a dead bot can never again
# masquerade as "no updates available". It owns its own green path: a fresh
# dashboard passes silently and auto-closes any prior alert.
#
# Systemic counterpart: engineering#552 adds the same input-freshness gate to
# the closeout dependency-currency wave (a per-milestone ceremony check). This
# workflow is the continuous, always-on detector between closeouts.

on:
  schedule:
    - cron: "23 6 * * *" # daily 06:23 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: renovate-freshness-gate
  cancel-in-progress: false

jobs:
  freshness:
    if: github.repository == 'cinatra-ai/cinatra'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      # Freshness window: weekly Renovate schedule ("before 6am on monday") + grace.
      MAX_AGE_DAYS: "10"
      # Idempotency key: at most one open alert issue, edited in place.
      ALERT_LABEL: "renovate-health"
    steps:
      - name: Evaluate Dependency Dashboard freshness
        run: |
          set -euo pipefail
          REPO="${GITHUB_REPOSITORY}"
          OWNER="${REPO%%/*}"
          NAME="${REPO#*/}"

          # Ensure the idempotency label exists (no-op if already present).
          gh label create "$ALERT_LABEL" \
            --repo "$REPO" \
            --color "b60205" \
            --description "Renovate bot-health / freshness-gate alerts" \
            2>/dev/null || true

          # Resolve the Renovate Dependency Dashboard issue by author + exact title.
          # Not hardcoded to a number so the check survives a dashboard re-create.
          dash_num="$(gh issue list --repo "$REPO" \
            --search 'Dependency Dashboard in:title author:app/renovate' \
            --state open --json number,title \
            --jq 'map(select(.title=="Dependency Dashboard")) | (first.number // "")')"

          last_bot_write=""
          if [ -n "$dash_num" ]; then
            # Last RENOVATE-AUTHORED write: newest bot-authored body edit, or the
            # issue's creation if the bot has never edited it. Deliberately NOT
            # `updatedAt`: human edits (checkbox ticks, comments) bump that too
            # and would let a dead bot look alive (the cinatra#1632 masking).
            # The `userContentEdits` connection guarantees no ordering, so walk
            # ALL pages and take the max — sampling a page could miss the newest
            # bot write and false-alarm on a healthy bot. Page bound: 20 pages
            # (2000 edits) is far beyond any real dashboard; on early bail the
            # max over collected pages can only err toward a false RED, never a
            # false green.
            created_at=""
            author_login=""
            all_edits="[]"
            cursor=""
            page_no=0
            while [ "$page_no" -lt 20 ]; do
              page_no=$(( page_no + 1 ))
              page="$(gh api graphql \
                -f query='query($owner: String!, $name: String!, $num: Int!, $after: String) {
                  repository(owner: $owner, name: $name) {
                    issue(number: $num) {
                      createdAt
                      author { login }
                      userContentEdits(first: 100, after: $after) {
                        pageInfo { hasNextPage endCursor }
                        nodes { editedAt editor { login } }
                      }
                    }
                  }
                }' -f owner="$OWNER" -f name="$NAME" -F num="$dash_num" \
                ${cursor:+-f after="$cursor"})"
              if [ "$page_no" -eq 1 ]; then
                created_at="$(jq -r '.data.repository.issue.createdAt // ""' <<<"$page")"
                author_login="$(jq -r '.data.repository.issue.author.login // ""' <<<"$page")"
              fi
              batch="$(jq -c '.data.repository.issue.userContentEdits.nodes // []' <<<"$page")"
              all_edits="$(jq -c --argjson b "$batch" '. + $b' <<<"$all_edits")"
              has_next="$(jq -r '.data.repository.issue.userContentEdits.pageInfo.hasNextPage // false' <<<"$page")"
              cursor="$(jq -r '.data.repository.issue.userContentEdits.pageInfo.endCursor // ""' <<<"$page")"
              [ "$has_next" = "true" ] && [ -n "$cursor" ] || break
            done
            last_bot_write="$(jq -r --arg created "$created_at" --arg author "$author_login" '
              (
                [ .[]
                  | select((.editor.login // "") == "renovate")
                  | .editedAt ]
                | max
              )
              // (if $author == "renovate" then $created else "" end)
              // ""
            ' <<<"$all_edits")"
          fi

          if [ -z "$dash_num" ]; then
            stale=1
            age_days="n/a"
            reason="No open **Dependency Dashboard** issue authored by \`app/renovate\` was found. Renovate has either never onboarded or its dashboard was deleted."
            echo "::error::No open Renovate 'Dependency Dashboard' issue found."
          elif [ -z "$last_bot_write" ]; then
            stale=1
            age_days="n/a"
            reason="The Dependency Dashboard (#${dash_num}) exists but no Renovate-authored write was found in its collected edit history and it was not created by \`app/renovate\` under the expected login — the dashboard no longer carries any provable bot activity."
            echo "::error::Dependency Dashboard #${dash_num}: no Renovate-authored write found."
          else
            now_s=$(date -u +%s)
            upd_s=$(date -u -d "$last_bot_write" +%s)
            age_secs=$(( now_s - upd_s ))
            max_secs=$(( MAX_AGE_DAYS * 86400 ))
            age_days=$(( age_secs / 86400 )) # display only; comparison is on seconds
            echo "Dependency Dashboard #${dash_num} last Renovate-authored write=${last_bot_write} age=${age_days}d (${age_secs}s) threshold=${MAX_AGE_DAYS}d (${max_secs}s)"
            # Compare on seconds so a dashboard 10d23h old trips at the 10-day mark,
            # not only at a full 11 days (integer-day flooring would delay detection).
            if [ "$age_secs" -gt "$max_secs" ]; then
              stale=1
              reason="The Renovate **Dependency Dashboard** (#${dash_num}) was last written by Renovate itself at \`${last_bot_write}\` — **${age_days} days** ago, exceeding the ${MAX_AGE_DAYS}-day freshness window (weekly Renovate schedule + grace). Renovate rewrites the dashboard on every completed run, so a frozen bot-write timestamp means the hosted Renovate (Mend) app has stopped executing against this repo. Newer HUMAN edits (e.g. ticking a dashboard checkbox) do not count: only a Renovate-authored write proves a completed run."
            else
              stale=0
            fi
          fi

          # Find any existing open alert issue (label-keyed; at most one).
          existing="$(gh issue list --repo "$REPO" \
            --label "$ALERT_LABEL" --state open \
            --json number --jq '(first.number // "")')"

          if [ "$stale" = "0" ]; then
            echo "Dashboard is fresh (${age_days}d <= ${MAX_AGE_DAYS}d). Silent pass."
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --repo "$REPO" \
                --body "Auto-resolved by \`renovate-freshness-gate\`: the Dependency Dashboard carries a Renovate-authored write from ${age_days} day(s) ago, within the ${MAX_AGE_DAYS}-day window. Closing."
              gh issue close "$existing" --repo "$REPO" --reason completed
            fi
            exit 0
          fi

          # --- Stale path: surface a tracking issue, then fail the job. ---
          dash_ref=""
          [ -n "$dash_num" ] && dash_ref="#${dash_num}"
          body_file="${RUNNER_TEMP:-/tmp}/renovate-freshness-body.md"
          {
            printf '## Renovate appears dormant on this repository\n\n'
            printf '%s\n\n' "$reason"
            printf '**Dashboard:** %s · [Mend web portal](https://developer.mend.io/github/%s)\n' "$dash_ref" "$REPO"
            printf '**Freshness window:** %s days · **Observed age:** %s day(s) since the last Renovate-authored write\n' "$MAX_AGE_DAYS" "$age_days"
            printf '**Detected by:** `.github/workflows/renovate-freshness-gate.yml` (run: %s/%s/actions/runs/%s)\n\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            printf '### What this means\n'
            printf 'Freshness is measured from the last RENOVATE-AUTHORED dashboard write (issue edit\n'
            printf 'history), not `updatedAt` — human edits such as checkbox ticks bump `updatedAt`\n'
            printf 'and can mask a dead bot. A stale bot-write is not a schedule symptom — a manual\n'
            printf 'dashboard "run again" request bypasses the schedule and neither it nor the\n'
            printf 'schedule can freeze the dashboard. It means the hosted Renovate (Mend) app has\n'
            printf 'stopped completing runs against this repo.\n\n'
            printf '### Owner action required (Mend developer portal — not fixable in-repo)\n'
            printf '1. Open https://developer.mend.io/github/%s (authenticated as a cinatra-ai admin).\n' "$REPO"
            printf '2. Read the latest job log for this repo; look for a run error / "job disabled" / resource-limit / paused state, and paste its terminal status into the tracking thread.\n'
            printf '3. Clear the error state and trigger a run (portal "Recheck" / "Run now"), or reset onboarding if the portal offers it.\n'
            printf '4. If the portal shows NO jobs at all for this repo in the stale window, a portal reset alone is known-insufficient (tried 2026-07-15, cinatra#1632): escalate to Mend support (https://support.mend.io) citing the repo slug and the last bot-write timestamp.\n'
            printf '5. Confirm this issue auto-closes on the next `renovate-freshness-gate` run once Renovate writes the dashboard again.\n\n'
            printf 'Root-cause diagnosis and background: cinatra#1632. Systemic ceremony guard: engineering#552.\n'
          } > "$body_file"

          if [ -n "$existing" ]; then
            gh issue edit "$existing" --repo "$REPO" --body-file "$body_file"
            gh issue comment "$existing" --repo "$REPO" \
              --body "Still stale as of this run: last Renovate-authored dashboard write ${age_days} day(s) ago (> ${MAX_AGE_DAYS})."
            echo "Updated existing alert issue #${existing}."
          else
            new="$(gh issue create --repo "$REPO" \
              --title "Renovate dormant: Dependency Dashboard stale (freshness gate)" \
              --label "$ALERT_LABEL" \
              --body-file "$body_file")"
            echo "Opened alert issue: ${new}"
          fi

          echo "::error::Renovate Dependency Dashboard is stale/missing (age=${age_days}, threshold=${MAX_AGE_DAYS}d) — hosted Renovate is not running on this repo. See the surfaced alert issue."
          exit 1
