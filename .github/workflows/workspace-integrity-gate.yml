# Workspace integrity gate (cinatra#1669 follow-up).
#
# Runs `scripts/audit/workspace-deps-resolve.mjs` on every PR + push to main:
# asserts every `workspace:`-protocol dependency declared in an IN-TREE
# workspace member's package.json (the root app + packages/*) resolves to a
# package that actually exists in the workspace.
#
# WHY a dedicated deterministic gate (not just the frozen install the required
# build/test jobs already run): a stale `workspace:*` declaration left after a
# package is deleted is NOT caught by `pnpm install --frozen-lockfile` — when
# the equally-stale lockfile still matches the manifests, pnpm skips resolution
# and never re-validates workspace membership, so `main` ships uninstallable for
# any forced-resolution (dev, upgrade) install (exactly cinatra#1669). This gate
# encodes the invariant directly at the manifest level: fail the PR that removes
# a package but leaves a dangling `workspace:*` pointing at it.
#
# Same topology as repo-docs-tree-guard.yml (a lean, standalone gate). It scans
# only the in-tree, git-tracked members (root + packages/*) — the deletable
# #1669 surface — so it needs neither `pnpm install` nor the companion-extension
# clone: node + git only, hermetic and fast.

name: Workspace Integrity Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  workspace-deps-resolve:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      # Self-test the gate's pure helpers before running it.
      - name: Gate unit tests
        run: node --test scripts/audit/__tests__/workspace-deps-resolve.test.mjs

      - name: Workspace deps resolve gate
        run: node scripts/audit/workspace-deps-resolve.mjs
