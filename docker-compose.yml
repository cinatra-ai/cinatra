# Compose profile groupings
# ----------------------------------------------------------------------------
# `wayflow`       — Unified multi-tenant WayFlow runtime (hosts every installed
#                   agent at /agents/<vendor>/<slug>/ on port 3010)
# `drupal`        — Drupal CMS + drupal-db + the shared `wayflow` runtime
# `wordpress`     — WordPress CMS + wordpress-db + the shared `wayflow` runtime
# `a2a-peers`     — External A2A peer fixtures used by Cinatra integration tests
# `twenty`        — Twenty CRM dev stack (twenty-server/worker/db/redis)
# `plane`         — Plane project-management dev stack (loopback-only @ :3400)
# ----------------------------------------------------------------------------
# Use `docker compose --profile drupal up -d` to bring up Drupal + the shared
# wayflow runtime. Profiles can be combined: `--profile drupal --profile wordpress`.
# See docker/drupal/README.md for Drupal widget post-install setup.
# The `wayflow` service below serves every installed agent in one container.

services:
  postgres:
    image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    # MAJOR: Postgres 17 -> 18 (upgrade track; see docs/upgrade-track.md §3).
    # Pinned to the CONFIRMED multi-arch (amd64/arm64/...) OCI index digest of
    # postgres:18-alpine (18.4, resolved 2026-07-11 via imagetools) — the tag is
    # human-readable, the @sha256 is the binding pin.
    #
    # LAYOUT CHANGE with 18 (docker-library/postgres#1259): PGDATA moved to
    # /var/lib/postgresql/18/docker and the volume MUST be mounted at the
    # PARENT /var/lib/postgresql — an 18 container refuses a volume mounted at
    # the legacy .../data target. MIGRATING AN EXISTING DEV VOLUME: a 17-era
    # cinatra-postgres volume (cluster at the volume root) makes 18 refuse to
    # start (fail-closed, data untouched). Either dump/restore it — the exact
    # mechanism scripts/ci/works-after/postgres.sh proves (pg_dump from a 17
    # container on the old volume -> restore into a fresh 18 one) — or, for
    # disposable dev data, `docker volume rm <project>_cinatra-postgres` and let
    # 18 initdb fresh.
    # Host port publication moved to docker-compose.dev.yml (base-safe-by-default):
    # a bare `docker compose up` no longer exposes 5434 on 0.0.0.0.
    # Local dev + self-host install add `-f docker-compose.dev.yml` (loopback).
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - cinatra-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    # MAJOR: Redis 7 -> 8 (upgrade track; see docs/upgrade-track.md §9). Pinned
    # to the CONFIRMED multi-arch OCI index digest of redis:8-alpine (8.8.0,
    # resolved 2026-07-11 via the registry API; index digest unchanged since
    # 2026-06-23) — the tag is human-readable, the @sha256 is the binding pin.
    # Redis here is a cache/queue backend (BullMQ): Redis 8 reads a Redis 7
    # RDB/AOF forward-compatibly, and the works-after redis arm proves a real
    # BullMQ enqueue -> worker-run -> complete on 8-alpine with this repo's
    # pinned bullmq + ioredis. ROLLBACK: repoint to
    # redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    # AND clear any persisted dump first (rm /data/dump.rdb /data/appendonly*
    # in the cinatra-redis volume): Redis 8.8 writes RDB format v14, Redis 7.4
    # reads only <=v12 and refuses a newer dump (crash-loop class). Re-resolve
    # at bump time: `docker buildx imagetools inspect redis:8-alpine`.
    image: redis:8-alpine@sha256:9d317178eceac8454a2284a9e6df2466b93c745529947f0cd42a0fa9609d7005
    # Host port publication moved to docker-compose.dev.yml (base-safe-by-default):
    # a bare `docker compose up` no longer exposes 6379 on 0.0.0.0.
    volumes:
      - cinatra-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  verdaccio:
    # Upgrade track (inventory + pin-drift first pass): the floating `:6` tag
    # moved on every pull. Pinned to a CONFIRMED multi-arch (amd64/arm64) OCI
    # index digest so the pin no longer drifts; `:6` is kept for readability, the
    # @sha256 is the binding pin. verdaccio 6.7.4 is the latest stable line (no
    # newer major offered). Dev registry only, ephemeral storage. Re-resolve at
    # bump time: `docker buildx imagetools inspect verdaccio/verdaccio:6`.
    # See docs/upgrade-track.md §8.
    image: verdaccio/verdaccio:6@sha256:e3ac7e335e69504cd0b09616aa52066399868282313c34762d2a77b8169a3575
    ports:
      - "4873:4873"
    volumes:
      - cinatra-verdaccio-storage:/verdaccio/storage
      - ./docker/verdaccio/config.yaml:/verdaccio/conf/config.yaml:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:4873/').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  nango-db:
    image: postgres:17-alpine@sha256:979c4379dd698aba0b890599a6104e082035f98ef31d9b9291ec22f2b13059ca
    # Upgrade track: HELD at postgres 17-alpine as a CURRENT VALIDATED HOLD
    # while the platform DB moved to 18 (see docs/upgrade-track.md §3): this
    # store is app-coupled to Nango, whose upstream reference compose still
    # pins postgres 16 — 17 is already a deliberate, validated divergence, and
    # 18 is unvalidated by upstream (the works-after nango arm proves
    # fresh-init, not a restored 17 cluster under 18). Revisit when Nango
    # upstream moves; it keeps the LEGACY .../data mount for as long as it is
    # a <=17 image. Digest-pinned to a CONFIRMED multi-arch (amd64/arm64)
    # manifest so ARM dev hosts are safe AND the pg-major-cutover tool's digest
    # read-back is satisfied. The prod PGDATA volume is migrated by the
    # logical-dump -> fresh-volume restore in the ops pg-major-cutover tooling
    # (hub-nango profile), which rebinds nango-db to the external restored
    # volume via the ops prod override. See docs/upgrade-track.md.
    # Host port publication moved to docker-compose.dev.yml (base-safe-by-default):
    # a bare `docker compose up` no longer exposes 5435 on 0.0.0.0
    # (this is a Postgres with default nango/nango creds). Only the host-side CLI
    # backup/restore tooling (NANGO_DATABASE_URL) reaches it, on 127.0.0.1.
    environment:
      POSTGRES_DB: nango
      POSTGRES_USER: nango
      POSTGRES_PASSWORD: nango
    volumes:
      - nango-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nango"]
      interval: 5s
      timeout: 3s
      retries: 10

  nango-server:
    # Pinned to an immutable digest (was the floating `:hosted` tag, which moved
    # on every pull). This is an amd64-only image (NangoHQ publishes no arm64 /
    # multi-arch index for `hosted` — the manifest is a single-arch
    # manifest.v2+json), so a digest pin adds no cross-arch portability cost.
    # Re-resolve the digest at bump time with:
    #   docker buildx imagetools inspect nangohq/nango-server:hosted
    # Renovate owns bumps (it already tracks nangohq/nango-server). The hosted
    # deployment re-resolves and smokes its own digest independently — do not
    # hand-sync the two. Resolved 2026-06-23. See docs/upgrade-track.md.
    image: nangohq/nango-server:hosted@sha256:6f12853c192eab083175865a0427c1ea57a757a2d4d932ed8af46d6e3c002869
    # Keep the connector backend alive across the intermittent qemu SIGSEGVs the
    # amd64-only image hits on arm64 dev hosts. `unless-stopped` (NOT
    # `on-failure:N`, which exhausts its retry budget and returns to
    # dead-permanently for an intermittently-crashing emulated process); Docker
    # only applies the policy after a 10s successful start, so a true boot-loop
    # still surfaces instead of spinning forever. See cinatra-ai/cinatra#730.
    restart: unless-stopped
    ports:
      - "3003:3003"
      - "3009:3009"
    environment:
      NANGO_ENCRYPTION_KEY: ${NANGO_ENCRYPTION_KEY}
      SERVER_PORT: "3003"
      NANGO_SERVER_URL: http://localhost:3003
      NANGO_PUBLIC_SERVER_URL: http://localhost:3003
      NANGO_DASHBOARD_USERNAME: admin
      NANGO_DASHBOARD_PASSWORD: cinatra-local
      FLAG_AUTH_ENABLED: "false"
      FLAG_SERVE_CONNECT_UI: "true"
      NANGO_LOGS_ENABLED: "false"
      CSP_REPORT_ONLY: "true"
      NODE_TLS_REJECT_UNAUTHORIZED: "0"
      LOG_LEVEL: info
      RECORDS_DATABASE_URL: postgresql://nango:nango@nango-db:5432/nango
      NANGO_DB_HOST: nango-db
      NANGO_DB_NAME: nango
      NANGO_DB_USER: nango
      NANGO_DB_PASSWORD: nango
      NANGO_DB_SSL: "false"
      NANGO_REDIS_URL: redis://redis:6379
    depends_on:
      nango-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Probe the HTTP /health contract (the same one scripts/setup.sh and
    # scripts/ci/works-after/nango.sh wait on) so the container reports
    # `unhealthy` when the process is hung-but-port-bound — a plain port check
    # would mask that. Uses a `node -e` http probe (curl is not guaranteed in
    # the image; node is, since this IS a node server). start_period covers the
    # slow first-boot migrations the works-after smoke allows up to 180s for.
    # NOTE: depends_on conditions only gate the INITIAL start, not the
    # restart-policy relaunches — acceptable; Nango just retries/stays unhealthy
    # if a dep is briefly down. See cinatra-ai/cinatra#730.
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const http=require('http');const port=Number(process.env.SERVER_PORT||3003);const req=http.get({host:'127.0.0.1',port,path:'/health',timeout:4000},res=>process.exit(res.statusCode>=200&&res.statusCode<300?0:1));req.on('timeout',()=>req.destroy(new Error('timeout')));req.on('error',()=>process.exit(1));",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 180s

  wordpress-db:
    profiles: ["wordpress"]
    image: mariadb:11.4
    ports:
      - "3307:3306"
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_ROOT_PASSWORD: wordpress-root
    volumes:
      - cinatra-wordpress-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  wordpress:
    profiles: ["wordpress"]
    # Custom dev image (docker/wordpress/Dockerfile) bakes git/composer/wp-cli +
    # WordPress/abilities-api + WordPress/mcp-adapter at BUILD time, so the slow
    # clone+composer work no longer runs inside the uat-gate's ~5-min readiness
    # window (#260 Step 6). `docker compose up` builds a missing image before the
    # readiness poll begins; pull_policy: build prevents a stale registry image
    # from shadowing a rebuild. Mirrors the docker/drupal/Dockerfile bake pattern.
    build:
      context: ./docker/wordpress
      args:
        ABILITIES_API_VERSION: "0.4.0"
        MCP_ADAPTER_VERSION: "0.4.1"
    image: cinatra-wordpress-dev:6.8-php8.3
    pull_policy: build
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: wordpress-db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_ENVIRONMENT_TYPE', 'local' );
      MCP_ADAPTER_REF: v0.4.1
      WP_DEV_URL: http://localhost:8080
      WP_DEV_ADMIN_USER: admin
      WP_DEV_ADMIN_PASS: admin
      # Reserved example.com TLD — `dev@localhost` (no dot) fails WordPress
      # is_email(), so `wp core install` errors and the site never installs.
      WP_DEV_ADMIN_EMAIL: dev@example.com
      # Container-reachable base for the WP plugin's server-to-server calls back
      # to the host cinatra dev server. Inside the container `localhost:3000`
      # (the browser-facing cinatra_url) is the container's own loopback, so the
      # /token exchange must target the host gateway instead. Mirrors the drupal
      # + wayflow services; requires the `extra_hosts` mapping below on Linux/CI.
      CINATRA_BASE_URL: http://host.docker.internal:3000
    volumes:
      - cinatra-wordpress:/var/www/html
      - ./dev/wordpress-plugin:/var/www/html/wp-content/plugins/cinatra
      - ./scripts/wordpress-entrypoint.sh:/usr/local/bin/cinatra-wp-entrypoint.sh:ro
      # Generic dev-content seeder + manifest (mounted outside the web root).
      - ./docker/wordpress/seed-content.php:/opt/cinatra-dev-content/seed-content.php:ro
      - ./scripts/fixtures/external-instances.dev-content.json:/opt/cinatra-dev-content/external-instances.dev-content.json:ro
    entrypoint: ["/usr/local/bin/cinatra-wp-entrypoint.sh"]
    command: ["apache2-foreground"]
    depends_on:
      wordpress-db:
        condition: service_healthy
    # Resolve `host.docker.internal` (the CINATRA_BASE_URL host) to the host
    # gateway. Automatic on Docker Desktop but NOT on Linux/CI, where the
    # WP/Drupal UAT runs — without this the plugin's server-to-server /token
    # call to the host cinatra dev server fails to connect.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ---------------------------------------------------------------------------
  # A2A dev peer agents. OPT-IN via `--profile a2a-peers`.
  # Cloned into `dev/a2a-peers/` (gitignored) by `cinatra setup` from
  # cinatra-ai/a2a-servers-dev (package.json `cinatra.devApps`). Run
  # `cinatra setup dev` first, then start with:
  #   docker compose --profile a2a-peers up -d --build
  # Most peers need no API key. Two are LLM-backed: dice_agent_rest needs
  # GOOGLE_API_KEY (unless GOOGLE_GENAI_USE_VERTEXAI=TRUE) and adk_expense_reimbursement
  # needs GEMINI_API_KEY (GOOGLE_API_KEY as fallback), both read from .env.local.
  # Wire peer URLs via CINATRA_A2A_DEV_PEER_URLS (comma-separated).
  # Peer connections auto-register in /connectors (A2A Servers) on dev boot.
  # ---------------------------------------------------------------------------
  # NOTE: For E2E external A2A dispatch testing (streaming), run a peer directly on
  # the host instead of Docker — Docker Desktop macOS proxies cause ECONNRESET for
  # Node.js SSE streaming clients. Peers ship run_host*.py launchers that bind
  # 127.0.0.1 on the same host port (so CINATRA_A2A_DEV_PEER_URLS needs no change):
  #   docker stop cinatra-a2a-peer-signing-1
  #   cd dev/a2a-peers/signing_and_verifying && uv run run_host.py   # 10006
  # (helloworld has no host launcher; `uv run .` binds :9999, or use the compose
  # service for the :10001 mapping.)
  a2a-peer-helloworld:
    profiles: ["a2a-peers"]
    build:
      context: ./dev/a2a-peers/helloworld
      dockerfile: Dockerfile
    ports:
      - "10001:9999"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:9999/.well-known/agent-card.json')\""]
      interval: 10s
      timeout: 5s
      retries: 6

  # Host-run alternative (Docker Desktop ECONNRESET workaround):
  #   docker stop cinatra-a2a-peer-number-alice-1
  #   cd dev/a2a-peers/number_guessing_game && uv run run_host_alice.py
  a2a-peer-number-alice:
    profiles: ["a2a-peers"]
    build:
      context: ./dev/a2a-peers/number_guessing_game
      dockerfile: Dockerfile
    command: ["python", "agent_Alice.py"]
    ports:
      - "10002:8001"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/.well-known/agent-card.json')\""]
      interval: 10s
      timeout: 5s
      retries: 6

  # number-bob is a CLI client that connects to Alice and Carol as a player — it is NOT
  # an A2A server and has no HTTP endpoint. Excluded from a2a-peers profile.
  a2a-peer-number-bob:
    profiles: ["a2a-peers-disabled"]
    build:
      context: ./dev/a2a-peers/number_guessing_game
      dockerfile: Dockerfile
    command: ["python", "agent_Bob.py"]

  # Host-run alternative:
  #   docker stop cinatra-a2a-peer-number-carol-1
  #   cd dev/a2a-peers/number_guessing_game && uv run run_host_carol.py
  a2a-peer-number-carol:
    profiles: ["a2a-peers"]
    build:
      context: ./dev/a2a-peers/number_guessing_game
      dockerfile: Dockerfile
    command: ["python", "agent_Carol.py"]
    ports:
      - "10004:8003"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8003/.well-known/agent-card.json')\""]
      interval: 10s
      timeout: 5s
      retries: 6

  # Host-run alternative:
  #   docker stop cinatra-a2a-peer-dice-rest-1
  #   cd dev/a2a-peers/dice_agent_rest && uv run . --host 127.0.0.1 --port 10005
  a2a-peer-dice-rest:
    profiles: ["a2a-peers"]
    build:
      context: ./dev/a2a-peers/dice_agent_rest
      dockerfile: Dockerfile
    environment:
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GOOGLE_GENAI_USE_VERTEXAI: ${GOOGLE_GENAI_USE_VERTEXAI:-}
    ports:
      - "10005:10101"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:10101/.well-known/agent-card.json')\""]
      interval: 10s
      timeout: 5s
      retries: 6

  # Host-run alternative:
  #   docker stop cinatra-a2a-peer-signing-1
  #   cd dev/a2a-peers/signing_and_verifying && uv run run_host.py
  a2a-peer-signing:
    profiles: ["a2a-peers"]
    build:
      context: ./dev/a2a-peers/signing_and_verifying
      dockerfile: Dockerfile
    ports:
      - "10006:9999"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:9999/.well-known/agent-card.json')\""]
      interval: 10s
      timeout: 5s
      retries: 6

  # Host-run alternative (also requires GEMINI_API_KEY in env):
  #   docker stop cinatra-a2a-peer-adk-reimbursement-1
  #   cd dev/a2a-peers/adk_expense_reimbursement && uv run . --host 127.0.0.1 --port 10007
  a2a-peer-adk-reimbursement:
    profiles: ["a2a-peers"]
    build:
      context: ./dev/a2a-peers/adk_expense_reimbursement
      dockerfile: Dockerfile
    environment:
      # Upstream __main__.py reads GEMINI_API_KEY. Fallback to GOOGLE_API_KEY
      # so devs who only have the latter set (used by langgraph-server) are not
      # forced to duplicate the key. Empty default keeps compose happy when
      # the peer is not opted-in.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-${GOOGLE_API_KEY:-}}
      GOOGLE_GENAI_USE_VERTEXAI: ${GOOGLE_GENAI_USE_VERTEXAI:-}
    ports:
      - "10007:10002"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:10002/.well-known/agent-card.json')\""]
      interval: 10s
      timeout: 10s
      retries: 10

  # ---------------------------------------------------------------------------
  # Neo4j + Graphiti. Required for the objects-layer Graphiti backend.
  # Neo4j Community stores the knowledge graph; knowledge-graph-mcp fronts it via MCP.
  # Dev credentials: NEO4J_PASSWORD defaults to "cinatra-local" (same convention as
  # Nango dashboard password). Override for production — see SUMMARY.md prod notes.
  # Production overlay MUST: (a) remove the graphiti host port binding (neo4j's
  # is already base-OFF — see below), (b) set NEO4J_PASSWORD to a strong secret.
  # neo4j host ports (7474/7687) moved to docker-compose.dev.yml
  # (base-safe-by-default): a bare `docker compose up` no longer
  # exposes them on 0.0.0.0. Local dev + self-host install add
  # `-f docker-compose.dev.yml` (loopback). ops prod/demo overrides
  # already `!reset []` neo4j regardless.
  # ---------------------------------------------------------------------------
  neo4j:
    # MAJOR: 5.26-community -> the CalVer line (the successor to the 5.x semver
    # line; Neo4j retired semver after 5.26). 2026.05-community = kernel 2026.05.0,
    # the latest community release (verified empirically against the registry —
    # `docker buildx imagetools inspect neo4j:community` resolves to the same
    # digest). Digest-pinned (immutable): the tag is human-readable, the @sha256
    # is the binding pin. Re-resolve at bump time with
    # `docker buildx imagetools inspect neo4j:2026.05-community`.
    # DIGEST RE-RESOLVED 2026-07-11: upstream REPUBLISHED the 2026.05-community
    # tag on 2026-07-02 (same kernel 2026.05.0 — still the latest stable
    # calendar release — new build/bytes), so the pin follows the current
    # multi-arch index digest; the prior index digest was sha256:b91a6fa7b1d8…
    # The digest-bound graphiti works-after dispatch gates this (NEO4J_IMAGE
    # carries the full tag@sha256 ref).
    # See docs/upgrade-track.md §7 for the major's two behavior changes:
    #  (1) the default Cypher language is now CYPHER_25 (was 5) — pinned back to
    #      CYPHER_5 below so graphiti's Cypher-5-shaped MCP queries keep parsing;
    #  (2) a NEO4J_AUTH password now has an 8-char minimum (the default
    #      `cinatra-local` is 13 chars; a prod override must be >=8).
    image: neo4j:2026.05-community@sha256:6c162e2432f861f2c4e3da77a6ba478e7f10e2160b870541f85294532bc6ff5f
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-cinatra-local}
      # The healthcheck below expands its password var INSIDE the container, so the
      # container must actually receive the password — otherwise a prod
      # NEO4J_PASSWORD override changes NEO4J_AUTH but the in-container healthcheck
      # still authenticates with `cinatra-local` and fails forever, so graphiti
      # (depends_on: service_healthy) never starts. We pass it under a NON-`NEO4J_`
      # name on purpose: Neo4j's entrypoint maps every `NEO4J_*` env var to a
      # neo4j.conf setting under strict_validation, so a `NEO4J_PASSWORD` var is
      # rejected as an unknown setting ("No declared setting with name: PASSWORD")
      # and the server refuses to boot. `CINATRA_HC_NEO4J_PW` is ignored by the
      # config loader but still available to the healthcheck shell, and tracks the
      # same default so the healthcheck password always matches NEO4J_AUTH.
      CINATRA_HC_NEO4J_PW: ${NEO4J_PASSWORD:-cinatra-local}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_apoc_export_file_enabled: "true"
      NEO4J_apoc_import_file_enabled: "true"
      # CalVer default is CYPHER_25; graphiti (knowledge-graph-mcp) emits
      # Cypher-5-shaped queries, so pin the server default back to CYPHER_5.
      # (db.query.default_language, __ -> _ env mapping.)
      NEO4J_db_query_default__language: CYPHER_5
    volumes:
      - cinatra-neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${CINATRA_HC_NEO4J_PW:-cinatra-local}\" 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  graphiti:
    # ALREADY at the newest STABLE — no newer tag to bump to (ops#359 reframe:
    # latest stable, not only a major hop). The zepai/knowledge-graph-mcp repo
    # tops out at 1.0.2-graphiti-0.28.2 (verified empirically: the registry's
    # newest tag, == `:latest` == `:1.0.2`, same digest; the ladder is
    # 0.4.0 -> 1.0.0-g0.22.0 -> 1.0.1-g0.23.1 -> 1.0.2-g0.28.2, with no
    # 1.0.3 / 1.1.x / 2.x / newer graphiti line published). So this stays on its
    # current release; the only change is an immutable digest pin (the tag
    # floated `:latest`-style before — same hardening the Nango row got).
    # Re-resolve at bump time with
    # `docker buildx imagetools inspect zepai/knowledge-graph-mcp:1.0.2-graphiti-0.28.2`.
    image: zepai/knowledge-graph-mcp:1.0.2-graphiti-0.28.2@sha256:c9e0efd3f0bcdb4125eceed08958aea94fe2d85a90c20dfdaadaaf8304e1c4d6
    ports:
      - "8000:8000"
    environment:
      # knowledge-graph-mcp uses pydantic-settings with __ as nested delimiter.
      # DATABASE__PROVIDER=neo4j switches from the bundled FalkorDB to our Neo4j service.
      DATABASE__PROVIDER: neo4j
      DATABASE__PROVIDERS__NEO4J__URI: bolt://neo4j:7687
      DATABASE__PROVIDERS__NEO4J__USERNAME: neo4j
      DATABASE__PROVIDERS__NEO4J__PASSWORD: ${NEO4J_PASSWORD:-cinatra-local}
      # OpenAI key required for entity extraction and embeddings.
      # Pass both the nested pydantic-settings key AND the raw env var —
      # graphiti_core's internal initialization reads OPENAI_API_KEY directly.
      LLM__PROVIDERS__OPENAI__API_KEY: ${OPENAI_API_KEY:-}
      EMBEDDER__PROVIDERS__OPENAI__API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SEMAPHORE_LIMIT: "10"
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      # MCP server: check TCP port reachability (no fixed HTTP health endpoint).
      test: ["CMD-SHELL", "python3 -c \"import socket; s=socket.socket(); s.settimeout(3); s.connect(('localhost', 8000)); s.close()\""]
      interval: 10s
      timeout: 5s
      retries: 12

  # WayFlow multi-tenant runtime.
  # ONE container hosts every installed agent at /agents/<vendor>/<slug>/, mirroring
  # the on-disk agents/<vendor>/<slug>/ tree. The loader (docker/wayflow/agent_loader.py)
  # recursively scans agents/*/*/oas.json on startup and mounts each agent as an
  # isolated A2AServer ASGI sub-application under a Starlette parent. No per-agent
  # pinning env var; agent URL is derived from agent_templates.packageName.
  #
  # Profiles: [wayflow, drupal, wordpress] — the same shared runtime is brought up by
  # any of the three operator commands; drupal/wordpress profiles still bring up their
  # CMS containers (drupal/drupal-db, wordpress/wordpress-db) alongside.
  #
  # Start the runtime:    docker compose --profile wayflow up
  # With Drupal CMS:      docker compose --profile drupal up
  # With WordPress CMS:   docker compose --profile wordpress up
  #
  # Healthcheck probes GET /.health (returns {"status": "ok", "agents": <count>}).
  # 12 retries × 10s gives the loader 2 minutes to mount all agents on cold start.
  wayflow:
    build:
      context: ./docker/wayflow
    restart: unless-stopped
    ports:
      - "3010:3010"
    # Host-secret env (CINATRA_BRIDGE_TOKEN / OPENAI_API_KEY / WAYFLOW_BASE_URL)
    # is sourced from a NARROW, generated file — NOT inlined as
    # `environment: CINATRA_BRIDGE_TOKEN: "${CINATRA_BRIDGE_TOKEN}"`. That
    # interpolation reads the *shell* env, so a bring-up that does not first
    # `source .env.local` (a bare `docker compose up`, a CI harness) leaves the
    # token EMPTY; worse, an empty `environment:` value OVERRIDES an `env_file`
    # value on the same key, so the bridge silently 403s and the widget
    # content-edit returns "(no response)". `scripts/gen-wayflow-env.mjs`
    # (run by `npm run services`) writes docker/wayflow/.wayflow.env with ONLY
    # those three keys; `required: false` keeps a fresh checkout bootable
    # (the wayflow runtime then fails LOUD at boot if the bridge token is
    # absent — agent_loader.py main()). Static, non-secret keys stay inline
    # below: they are not interpolated, share no key with the env_file, and so
    # never hit the empty-override trap (PORT especially must be 3010 here, NOT
    # .env.local's app PORT 3000).
    env_file:
      - path: ./docker/wayflow/.wayflow.env
        required: false
    environment:
      PORT: "3010"
      CINATRA_AGENTS_DIR: "/agents"
      CINATRA_BASE_URL: "http://host.docker.internal:3000"
      # Multi-tenant loader auto-discovers all agents/<vendor>/<slug>/cinatra/oas.json.
      # No per-agent pinning env var is needed.
    volumes:
      - ./extensions:/agents:ro
    profiles:
      - wayflow
      - drupal
      - wordpress
    healthcheck:
      # Treat both `ok` and `degraded` as healthy. The
      # loader explicitly tolerates per-agent load failures (Pitfall 6
      # "never crash the runtime") and surfaces them via /.health as
      # status="degraded" + failed_agents=[...]. If the healthcheck rejects
      # `degraded`, a single broken agent (e.g. a publish-in-progress with
      # malformed oas.json) restart-loops the entire runtime — discarding
      # all healthy agents on each restart. Only a hard failure (status
      # missing, HTTP non-200, JSON parse failure) is treated as unhealthy.
      test:
        - "CMD-SHELL"
        - "python3 -c \"import urllib.request,json; r=urllib.request.urlopen('http://localhost:3010/.health'); j=json.loads(r.read()); exit(0 if j.get('status') in ('ok','degraded') else 1)\""
      interval: 10s
      timeout: 5s
      retries: 12
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ---------------------------------------------------------------------------
  # Drupal 11 dev stack. OPT-IN via `--profile drupal`.
  # Boots a Drupal 11 + MariaDB site with drupal/mcp_tools installed.
  # The cinatra module is bind-mounted from dev/drupal-module/cinatra/.
  # First boot runs composer require + drush site:install (takes ~60s).
  # ---------------------------------------------------------------------------
  drupal-db:
    profiles: ["drupal"]
    image: mariadb:11.4
    ports: ["3308:3306"]
    environment:
      MARIADB_DATABASE: drupal
      MARIADB_USER: drupal
      MARIADB_PASSWORD: drupal
      MARIADB_ROOT_PASSWORD: drupal-root
    volumes:
      - cinatra-drupal-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  drupal:
    profiles: ["drupal"]
    build:
      context: .
      dockerfile: docker/drupal/Dockerfile
    ports: ["8082:80"]
    environment:
      MCP_TOOLS_API_KEY: dev-mcp-key
      DRUPAL_ADMIN_USER: admin
      DRUPAL_ADMIN_PASS: cinatra
      DRUPAL_SITE_URL: http://localhost:8082
      CINATRA_BASE_URL: http://host.docker.internal:3000
    volumes:
      - cinatra-drupal:/drupal/web/sites/default
      - ./dev/drupal-module/cinatra:/drupal/web/modules/custom/cinatra
      - ./scripts/drupal-entrypoint.sh:/usr/local/bin/cinatra-drupal-entrypoint.sh:ro
      - ./docker/drupal/config/sync:/drupal/config/sync
      # Generic dev-content seeder + manifest (mounted outside the web root).
      - ./docker/drupal/seed-content.php:/opt/cinatra-dev-content/seed-content.php:ro
      - ./scripts/fixtures/external-instances.dev-content.json:/opt/cinatra-dev-content/external-instances.dev-content.json:ro
    entrypoint: ["/usr/local/bin/cinatra-drupal-entrypoint.sh"]
    command: ["apache2-foreground"]
    depends_on:
      drupal-db:
        condition: service_healthy
    # Resolve `host.docker.internal` (the CINATRA_BASE_URL host above) to the
    # host gateway. Automatic on Docker Desktop but NOT on Linux/CI, where the
    # WP/Drupal UAT runs — without this the module's server-to-server /token
    # call to the host cinatra dev server fails to connect.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ---- Twenty CRM stack (profile-gated; default `docker compose up` does NOT start this) ----
  # ~2 GB image pull on first start; explicit opt-in: `docker compose --profile twenty up -d twenty-server twenty-worker twenty-db twenty-redis`
  # Single Apple workspace via `workspace:seed:dev --light` — Twenty has no IS_MULTIWORKSPACE_ENABLED env var.
  # Bootstrap (API key) via `workspace:generate-api-key` — Twenty OAuth supports only authorization_code/refresh_token, NOT client_credentials.
  twenty-db:
    image: postgres:16
    container_name: cinatra-twenty-db-1
    profiles: ["twenty"]
    ports: ["5532:5432"]
    environment:
      POSTGRES_DB: default
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: cinatra-twenty-dev
    volumes:
      - cinatra-twenty-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h localhost -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  twenty-redis:
    image: redis:7
    container_name: cinatra-twenty-redis-1
    profiles: ["twenty"]
    ports: ["6479:6379"]
    command: ["--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  twenty-server:
    image: twentycrm/twenty:${TWENTY_TAG:-v2.7.3}
    container_name: cinatra-twenty-1
    profiles: ["twenty"]
    ports: ["3300:3000"]
    environment:
      NODE_PORT: 3000
      NODE_ENV: development
      PG_DATABASE_URL: postgres://postgres:cinatra-twenty-dev@twenty-db:5432/default
      SERVER_URL: http://localhost:3300
      REDIS_URL: redis://twenty-redis:6379
      STORAGE_TYPE: local
      ENCRYPTION_KEY: ${TWENTY_ENCRYPTION_KEY:-cinatra-dev-twenty-encryption-key-replace-in-prod}
      APP_SECRET: ${TWENTY_APP_SECRET:-cinatra-dev-twenty-app-secret-replace-in-prod}
    volumes:
      - cinatra-twenty-server:/app/packages/twenty-server/.local-storage
    depends_on:
      twenty-db:
        condition: service_healthy
      twenty-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:3000/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  twenty-worker:
    image: twentycrm/twenty:${TWENTY_TAG:-v2.7.3}
    container_name: cinatra-twenty-worker-1
    profiles: ["twenty"]
    command: ["yarn", "worker:prod"]
    environment:
      PG_DATABASE_URL: postgres://postgres:cinatra-twenty-dev@twenty-db:5432/default
      SERVER_URL: http://localhost:3300
      REDIS_URL: redis://twenty-redis:6379
      DISABLE_DB_MIGRATIONS: "true"
      DISABLE_CRON_JOBS_REGISTRATION: "true"
      STORAGE_TYPE: local
      ENCRYPTION_KEY: ${TWENTY_ENCRYPTION_KEY:-cinatra-dev-twenty-encryption-key-replace-in-prod}
      APP_SECRET: ${TWENTY_APP_SECRET:-cinatra-dev-twenty-app-secret-replace-in-prod}
    volumes:
      - cinatra-twenty-server:/app/packages/twenty-server/.local-storage
    depends_on:
      twenty-db:
        condition: service_healthy
      twenty-server:
        condition: service_healthy

  # ---- Plane (project management) stack (profile-gated; default `docker compose up` does NOT start this) ----
  # Folds Plane's OFFICIAL Community-Edition prebuilt-image compose
  # (github.com/makeplane/plane → deployments/cli/community) into cinatra's
  # compose as `--profile plane`. ~12 long-running containers, ~2 GB RAM idle,
  # multi-GB image pull on first start. Explicit opt-in:
  #   docker compose --profile plane up -d
  #
  # SMOKE-PROVEN topology (Plane CE 1.3.1, on-the-wire, cinatra#315/#320):
  #   - LOOPBACK-ONLY: the only published port is `127.0.0.1:3400:80` on the
  #     proxy (per docker-compose.dev.yml policy — NOT Twenty's non-loopback
  #     exposure). DB/Redis/MQ/MinIO are container-network-internal (unpublished).
  #   - The community compose binds the proxy via Swarm `mode: host` 80/443 +
  #     `deploy.replicas`; plain `docker compose` ignores `deploy:`, so we use a
  #     normal `ports:` bridge mapping and drop `deploy:`/`mode:host` here.
  #   - REST is reachable at http://localhost:3400/api/v1/... and X-API-Key is the
  #     SOLE authenticator (see src/lib/dev-auto-setup.ts autoSetupLocalPlane).
  #   - Plane CE itself is NOT an MCP server; the official `plane-mcp-server`
  #     (Python/FastMCP, direct-named tools) is a SEPARATE bridge process and is
  #     NOT part of this community compose. The dev auto-setup therefore only
  #     wires an external_mcp_servers row when a real Plane MCP bridge URL
  #     (PLANE_MCP_URL) answers `tools/list` — otherwise it logs a setup hint.
  #
  # Image pins (upgrade-paths slice 1, cinatra#1420). The Plane app images and
  # MinIO previously rode the MUTABLE `stable` / `latest` tags — the two floating
  # tags this stack carried. Plane runs implicit DB migrations at boot, so a
  # floating `stable` can silently cross a schema-migrating major on a plain
  # `docker pull`; that class is now closed:
  #   - Plane images default to the release tag `${PLANE_TAG:-v1.3.1@sha256:…}` — the IMMUTABLE
  #     v1.3.1 release (≡ the `stable` the #315/#320 smoke ran, resolved on the
  #     Docker registry), digest-bound. The `${PLANE_TAG}` override knob is kept:
  #     set PLANE_TAG=<tag> to pull a different Plane release (the whole
  #     `tag@digest` default is replaced, so an override is not digest-locked).
  #   - MinIO defaults to the immutable dated `RELEASE.2025-09-07T16-13-09Z`
  #     (≡ the `latest` digest at pin time), digest-bound (see plane-minio).
  # Existing `latest`/`stable` volumes have unknown last-writer versions — the
  # supported source→target rules live in docs/architecture/upgrade-matrix.json
  # (the machine-readable matrix) + docs/internals/architecture/stateful-service-inventory.md.
  # A major must now arrive as a reviewable pin-diff, never absorbed by a pull.
  plane-db:
    image: postgres:15.7-alpine
    container_name: cinatra-plane-db-1
    profiles: ["plane"]
    command: postgres -c 'max_connections=1000'
    environment:
      POSTGRES_USER: plane
      POSTGRES_DB: plane
      POSTGRES_PASSWORD: plane
      PGDATA: /var/lib/postgresql/data
    volumes:
      - cinatra-plane-pgdata:/var/lib/postgresql/data
    networks: ["plane"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plane -d plane"]
      interval: 5s
      timeout: 5s
      retries: 20

  plane-redis:
    image: valkey/valkey:7.2.11-alpine
    container_name: cinatra-plane-redis-1
    profiles: ["plane"]
    volumes:
      - cinatra-plane-redisdata:/data
    networks: ["plane"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  plane-mq:
    image: rabbitmq:3.13.6-management-alpine
    container_name: cinatra-plane-mq-1
    profiles: ["plane"]
    environment:
      RABBITMQ_DEFAULT_USER: plane
      RABBITMQ_DEFAULT_PASS: plane
      RABBITMQ_DEFAULT_VHOST: plane
    volumes:
      - cinatra-plane-rabbitmq:/var/lib/rabbitmq
    networks: ["plane"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12

  plane-minio:
    # Pinned from the floating `:latest` (upgrade-paths slice 1, cinatra#1420).
    # `RELEASE.2025-09-07T16-13-09Z` is the immutable dated release the `:latest`
    # tag resolved to at pin time; the `@sha256` is the binding pin (multi-arch
    # manifest list, amd64+arm64, so no portability cost). Object store for Plane
    # uploads — classified `object-store` in the state inventory. Re-resolve at
    # bump time: `docker buildx imagetools inspect minio/minio:<RELEASE.tag>`.
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: cinatra-plane-minio-1
    profiles: ["plane"]
    command: server /export --console-address ":9090"
    environment:
      MINIO_ROOT_USER: access-key
      MINIO_ROOT_PASSWORD: secret-key
    volumes:
      - cinatra-plane-uploads:/export
    networks: ["plane"]

  plane-migrator:
    image: makeplane/plane-backend:${PLANE_TAG:-v1.3.1@sha256:2cdcb5f778c6ccacebce0e5a751d39fac4a549a44e049a5b110a7623cfdad139} # immutable release tag, digest-bound
    container_name: cinatra-plane-migrator-1
    profiles: ["plane"]
    restart: "no"
    command: ./bin/docker-entrypoint-migrator.sh
    networks: ["plane"]
    environment: &plane-app-env
      # App
      WEB_URL: http://localhost:3400
      DEBUG: "0"
      CORS_ALLOWED_ORIGINS: http://localhost:3400
      GUNICORN_WORKERS: "1"
      SECRET_KEY: ${PLANE_SECRET_KEY:-60gp0byfz2dvffa45cxl20p1scy9xbpf6d8c5y0geejgkyp1b5}
      API_KEY_RATE_LIMIT: "600/minute"
      # Postgres — Plane derives the DSN from these parts when DATABASE_URL is
      # unset (settings/common.py reads POSTGRES_HOST, not PGHOST), so we
      # DELIBERATELY omit an inline connection-string DSN literal: the dev-only
      # embedded-credential form trips secret-scan-gate's Postgres detector.
      PGHOST: plane-db
      POSTGRES_HOST: plane-db
      PGDATABASE: plane
      POSTGRES_USER: plane
      POSTGRES_PASSWORD: plane
      POSTGRES_DB: plane
      POSTGRES_PORT: "5432"
      # Redis
      REDIS_HOST: plane-redis
      REDIS_PORT: "6379"
      REDIS_URL: redis://plane-redis:6379/
      # RabbitMQ — likewise derived (settings/common.py builds CELERY_BROKER_URL
      # from RABBITMQ_USER/PASSWORD/HOST/PORT/VHOST when AMQP_URL is unset), so no
      # inline amqp:// credential literal.
      RABBITMQ_HOST: plane-mq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: plane
      RABBITMQ_PASSWORD: plane
      RABBITMQ_VHOST: plane
      # MinIO / S3
      USE_MINIO: "1"
      AWS_REGION: ""
      AWS_ACCESS_KEY_ID: access-key
      AWS_SECRET_ACCESS_KEY: secret-key
      AWS_S3_ENDPOINT_URL: http://plane-minio:9000
      AWS_S3_BUCKET_NAME: uploads
      MINIO_ENDPOINT_SSL: "0"
      FILE_SIZE_LIMIT: "5242880"
    depends_on:
      plane-db:
        condition: service_healthy
      plane-redis:
        condition: service_healthy

  plane-api:
    image: makeplane/plane-backend:${PLANE_TAG:-v1.3.1@sha256:2cdcb5f778c6ccacebce0e5a751d39fac4a549a44e049a5b110a7623cfdad139} # immutable release tag, digest-bound
    container_name: cinatra-plane-api-1
    profiles: ["plane"]
    command: ./bin/docker-entrypoint-api.sh
    environment: *plane-app-env
    # The proxy (caddy) dials the bare upstream name `api`; alias this service to
    # it on the dedicated `plane` network (service name is `plane-api`).
    networks:
      plane:
        aliases: ["api"]
    # The plane-backend image ships python3 (no curl/wget-with-spider here), so
    # the healthcheck must use python — a curl check is always-unhealthy.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python3 -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/instances/', timeout=4).status==200 else 1)\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
    depends_on:
      plane-db:
        condition: service_healthy
      plane-redis:
        condition: service_healthy
      plane-mq:
        condition: service_healthy
      plane-migrator:
        condition: service_completed_successfully

  plane-worker:
    image: makeplane/plane-backend:${PLANE_TAG:-v1.3.1@sha256:2cdcb5f778c6ccacebce0e5a751d39fac4a549a44e049a5b110a7623cfdad139} # immutable release tag, digest-bound
    container_name: cinatra-plane-worker-1
    profiles: ["plane"]
    command: ./bin/docker-entrypoint-worker.sh
    environment: *plane-app-env
    networks: ["plane"]
    depends_on:
      plane-api:
        condition: service_started

  plane-beat-worker:
    image: makeplane/plane-backend:${PLANE_TAG:-v1.3.1@sha256:2cdcb5f778c6ccacebce0e5a751d39fac4a549a44e049a5b110a7623cfdad139} # immutable release tag, digest-bound
    container_name: cinatra-plane-beat-1
    profiles: ["plane"]
    command: ./bin/docker-entrypoint-beat.sh
    environment: *plane-app-env
    networks: ["plane"]
    depends_on:
      plane-api:
        condition: service_started

  plane-live:
    image: makeplane/plane-live:${PLANE_TAG:-v1.3.1@sha256:2073b6950a394545ea1db6ed4157e951ad5a6e1881e74f4f9238ace6c35bbf3d} # immutable release tag, digest-bound
    container_name: cinatra-plane-live-1
    profiles: ["plane"]
    environment:
      # The proxy routes `/live/` here by the bare name `live`; the upstream
      # api is reachable by its alias `api` on the `plane` network.
      API_BASE_URL: http://api:8000
      LIVE_SERVER_SECRET_KEY: ${PLANE_LIVE_SECRET_KEY:-2FiJk1U2aiVPEQtzLehYGlTSnTnrs7LW}
      REDIS_HOST: plane-redis
      REDIS_PORT: "6379"
      REDIS_URL: redis://plane-redis:6379/
    networks:
      plane:
        aliases: ["live"]
    depends_on:
      plane-api:
        condition: service_started

  plane-web:
    image: makeplane/plane-frontend:${PLANE_TAG:-v1.3.1@sha256:c178fd85c4588165262cfe748bd103fdeccebbbab827c53e71b9ce32fff84f86} # immutable release tag, digest-bound
    container_name: cinatra-plane-web-1
    profiles: ["plane"]
    networks:
      plane:
        aliases: ["web"]
    depends_on:
      plane-api:
        condition: service_started
      plane-worker:
        condition: service_started

  plane-space:
    image: makeplane/plane-space:${PLANE_TAG:-v1.3.1@sha256:e08c2c8741ae6f81a9326dc9201e7e09c0c411b87a20198f9ea9e5cf2fae3488} # immutable release tag, digest-bound
    container_name: cinatra-plane-space-1
    profiles: ["plane"]
    networks:
      plane:
        aliases: ["space"]
    depends_on:
      plane-api:
        condition: service_started
      plane-web:
        condition: service_started

  plane-admin:
    image: makeplane/plane-admin:${PLANE_TAG:-v1.3.1@sha256:ff9219127a2c2c4a4bb066d6a0e25a5fc6a11204cf8484b521dada53d696fe43} # immutable release tag, digest-bound
    container_name: cinatra-plane-admin-1
    profiles: ["plane"]
    networks:
      plane:
        aliases: ["admin"]
    depends_on:
      plane-api:
        condition: service_started
      plane-web:
        condition: service_started

  plane-proxy:
    image: makeplane/plane-proxy:${PLANE_TAG:-v1.3.1@sha256:b4f8bb6998052dcd1488171a90d473674cefbc6ec77114d5095b48c805f4ad27} # immutable release tag, digest-bound
    container_name: cinatra-plane-proxy-1
    profiles: ["plane"]
    networks: ["plane"]
    # LOOPBACK ONLY — the single published port of the entire Plane stack.
    # http://localhost:3400 → proxy:80 → web/space/admin/api/live.
    ports:
      - "127.0.0.1:3400:80"
    environment:
      FILE_SIZE_LIMIT: "5242880"
      BUCKET_NAME: uploads
      APP_DOMAIN: localhost:3400
      SITE_ADDRESS: ":80"
      LISTEN_HTTP_PORT: "80"
      LISTEN_HTTPS_PORT: "443"
    # Resolve `host.docker.internal` (the CINATRA_BASE_URL host used by webhooks
    # back into the cinatra app) to the host gateway, matching the CMS stacks.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      plane-web:
        condition: service_started
      plane-api:
        condition: service_started
      plane-space:
        condition: service_started
      plane-admin:
        condition: service_started
      plane-live:
        condition: service_started

volumes:
  cinatra-postgres:
  cinatra-redis:
  cinatra-verdaccio-storage:
  nango-postgres:
  cinatra-wordpress-db:
  cinatra-wordpress:
  cinatra-drupal-db:
  cinatra-drupal:
  cinatra-neo4j-data:
  cinatra-twenty-db:
  cinatra-twenty-server:
  cinatra-plane-pgdata:
  cinatra-plane-redisdata:
  cinatra-plane-rabbitmq:
  cinatra-plane-uploads:

networks:
  # Dedicated network for the `--profile plane` stack so Plane's proxy (caddy)
  # can resolve its hardcoded bare upstream names (`api`/`web`/`space`/`admin`/
  # `live`) via per-service network aliases, while the cinatra-prefixed service
  # names keep the stack isolated from the default cinatra dev network.
  plane:
    driver: bridge
