# cinatra's configuration for the upstream Graphiti MCP server (cinatra#2591).
#
# HOW THIS FILE RELATES TO THE GENERATED ENV FILE
# -----------------------------------------------
# The upstream server layers its settings sources in this priority order:
#
#     CLI args  >  environment variables  >  THIS YAML  >  code defaults
#
# and the sources are DEEP-merged, not replaced. So the division of labour is:
#
#   * this file holds everything STATIC — transport, database wiring shape,
#     entity/edge vocabulary. It is committed, readable, and diffable.
#   * ENVIRONMENT VARIABLES hold everything that depends on what the OPERATOR
#     configured in the app: which extraction provider, its key, which embedder,
#     and the embedder's endpoint. They override the placeholders here.
#
# NOTHING SECRET IS WRITTEN HERE — OR ANYWHERE ELSE UNDER docker/. There is no
# generated env file: scripts/gen-graphiti-env.mjs resolves the key in memory and
# runs the compose command itself with the variables set in that process's
# environment, so no decrypted credential is ever at rest in this tree.
# `docker/graphiti/.graphiti.env` is never present, and
# scripts/ci/no-keys-in-docker-tree.mjs fails the build if anything under
# docker/ carries a key-shaped value. If you find yourself adding a real
# credential to this file, that is the bug.
#
# The `api_key` below is a NAMED SENTINEL, not a credential, and it is
# load-bearing: the server does NOT degrade when the LLM key is missing, it dies
# at startup. `CrossEncoderFactory` builds an `OpenAIRerankerClient` from the LLM
# provider block whether or not a key exists, and `AsyncOpenAI(api_key=None)`
# raises `Missing credentials`. A bare `docker compose up` — any run where the
# generator has not executed — passes NO provider variables at all (the service
# declares them value-less, so compose omits an unset one rather than setting it
# empty), and these defaults are what it boots on. They are INTENDED to make
# that run boot.
#
# UNVERIFIED (cinatra#2591, stated rather than assumed): on the lane's rootless
# podman host the mounted config was not applied at all — the server logged its
# CODE defaults (gpt-5.5 / text-embedding-3-small) rather than the values here,
# first because the bind mount was unreadable and then, after relabelling, for a
# reason not chased to ground. Every live proof in that lane therefore came from
# the `-e` env vars, NOT from this file. So the "bare `docker compose up` boots"
# property these defaults exist to provide has NOT been demonstrated. Verify it
# on a docker host before relying on it.
#
# And the default LLM `api_url` points at the LOCAL embedder, not at
# api.openai.com. That is deliberate: with no configured key, extraction must
# fail WITHOUT putting projected row content on the wire to a vendor. The local
# service serves embeddings only, so a chat-completions call 404s locally and
# nothing leaves the host. `scripts/gen-graphiti-env.mjs` restores the real
# endpoint when a key is actually configured.
#
# THE KEYLESS STATE IS DELIBERATE. With no provider variables in the environment
# of the bring-up (a fresh checkout, a bare `docker compose up`, or an install
# with no provider configured), the server starts with no LLM key
# and extraction is off. That is a REPORTED state, not a silent one — the
# bring-up says so, the app says so at boot, and the projection path says so
# once per process. See src/lib/knowledge-graph-indexing.ts.

server:
  transport: "http"
  host: "0.0.0.0"
  port: 8000

llm:
  # Overridden by LLM__PROVIDER / LLM__MODEL / LLM__PROVIDERS__*__API_KEY from
  # the generated env file. `openai` here is only the shape the server falls
  # back to when nothing is configured; with no key it extracts nothing.
  provider: "openai"
  model: "gpt-5.5"
  max_tokens: 4096
  providers:
    openai:
      # See the header: a named sentinel + a no-egress URL, both overridden by
      # the generated env file when a provider is actually configured.
      api_key: "cinatra-no-extraction-provider-configured"
      api_url: "http://kg-embedder:8080/v1"
    anthropic:
      api_url: "https://api.anthropic.com"
      max_retries: 3

embedder:
  # Overridden by EMBEDDER__PROVIDER / EMBEDDER__MODEL / EMBEDDER__DIMENSIONS /
  # EMBEDDER__PROVIDERS__OPENAI__API_URL from the generated env file.
  #
  # The embedder is ALWAYS addressed through the `openai` provider shape,
  # whether it is hosted OpenAI or the local `kg-embedder` service — upstream's
  # OpenAI embedder branch forwards `base_url` to the SDK precisely so an
  # OpenAI-compatible endpoint can stand in. Keeping one shape is also what
  # makes the reranker resolution deterministic (see docker/graphiti/Dockerfile
  # on why sentence-transformers is not installed).
  provider: "openai"
  model: "bge-small-en-v1.5"
  dimensions: 384
  providers:
    openai:
      # Defaults to the LOCAL floor for the same reason as the LLM block: an
      # un-generated bring-up must boot, and must not reach a vendor.
      api_key: "cinatra-local-embedder"
      api_url: "http://kg-embedder:8080/v1"

database:
  # Overridden by the static DATABASE__* block in docker-compose.yml. Declared
  # here so a `docker run` of this image without compose still targets Neo4j
  # rather than upstream's bundled-FalkorDB default.
  provider: "neo4j"
  providers:
    neo4j:
      uri: ${NEO4J_URI:bolt://neo4j:7687}
      username: ${NEO4J_USER:neo4j}
      password: ${NEO4J_PASSWORD:cinatra-local}
      database: ${NEO4J_DATABASE:neo4j}

graphiti:
  # group_id is supplied per call by the projector (the lane), never defaulted
  # into a shared bucket; this value only names the fallback for a hand-made
  # call that omits one.
  group_id: ${GRAPHITI_GROUP_ID:cinatra-default}
  user_id: "cinatra"
  # The extraction vocabulary. Kept close to upstream's own list: these steer
  # the extractor, and cinatra's projected rows are ordinary domain records
  # (contacts, artifacts, memory concepts) that this vocabulary covers.
  entity_types:
    - name: "Preference"
      description: "User preferences, choices, opinions, or selections"
    - name: "Requirement"
      description: "Specific needs, features, or functionality that must be fulfilled"
    - name: "Procedure"
      description: "Standard operating procedures and sequential instructions"
    - name: "Location"
      description: "Physical or virtual places where activities occur"
    - name: "Event"
      description: "Time-bound activities, occurrences, or experiences"
    - name: "Organization"
      description: "Companies, institutions, groups, or formal entities"
    - name: "Document"
      description: "Information content in various forms (books, articles, reports, etc.)"
    - name: "Topic"
      description: "Subject of conversation, interest, or knowledge domain (use as last resort)"
    - name: "Object"
      description: "Physical items, tools, devices, or possessions (use as last resort)"
